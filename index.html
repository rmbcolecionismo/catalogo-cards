<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Marketplace de Figurinhas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #101827;
      --gold: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); min-height: 100vh; color: #f8fafc; padding-bottom: 50px; }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1rem 0;
    }
    .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-right: 15px; }
    .top-nav a:hover { color: var(--gold); }
    
    .btn-nav-admin {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--gold);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .btn-nav-admin:hover {
      background: var(--gold);
      color: #0f172a;
    }

    header { padding: 1.5rem 1rem 1rem; text-align: center; }
    header h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(to right, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: #94a3b8; font-size: 0.85rem; margin-top: 0.3rem; }

    .controls-wrapper { max-width: 1100px; margin: 0 auto 1.5rem; padding: 1rem; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-select { flex: 1; min-width: 200px; padding: 0.8rem; border-radius: 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.2); color: white; outline: none; }
    .filter-select:focus { border-color: var(--gold); }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.25rem; }

    .sticker-card { background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); color: #0f172a; display: flex; flex-direction: column; transition: 0.3s; }
    .sticker-card:hover { transform: translateY(-3px); }
    .sticker-img-wrap { height: 180px; background: #f8fafc; padding: 10px; display: flex; align-items: center; justify-content: center; }
    .sticker-card img { width: 100%; height: 100%; object-fit: contain; }
    .sticker-info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
    .colecao-label { font-size: 0.65rem; color: #64748b; font-weight: 700; text-transform: uppercase; }
    .vendedor-label { font-size: 0.7rem; color: #2563eb; font-weight: 700; margin-top: 2px; }
    .sticker-title { font-size: 0.9rem; font-weight: 700; margin: 4px 0; }
    .sticker-price { font-size: 1.1rem; font-weight: 800; color: #059669; margin: 5px 0; }
    .sticker-qtd { font-size: 0.75rem; color: #64748b; margin-bottom: 5px; font-weight: 600; }
    
    .btn-vendedor { 
      background: #2563eb; 
      color: white; 
      border: none; 
      padding: 0.7rem; 
      border-radius: 8px; 
      width: 100%; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: auto; 
      transition: 0.2s; 
      text-align: center;
      text-decoration: none;
      display: block;
      font-size: 0.85rem;
    }
    .btn-vendedor:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="nav-links">
      <a href="index.html" style="color: var(--gold);">🏠 Home</a>
    </div>
    <a href="login.html" class="btn-nav-admin">
      🔐 Login / Painel
    </a>
  </div>

  <header>
    <h1>🛍️ Marketplace de Figurinhas</h1>
    <p>Encontre figurinhas disponíveis e visite o perfil dos vendedores para contato</p>
  </header>

  <div class="container">
    <div class="controls-wrapper">
      <input type="text" id="search" placeholder="🔍 Buscar figurinha por nome ou número..." class="filter-select" oninput="filtrar()">
      <select id="filterColecao" class="filter-select" onchange="filtrar()">
        <option value="">Todas as Coleções</option>
      </select>
    </div>

    <div class="grid" id="catalog">
      <p style="text-align: center; grid-column: 1/-1; color: #94a3b8; padding: 2rem;">Carregando vitrine...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allData = [];

    async function init() {
      try {
        // Busca as ofertas ativas na vitrine trazendo os dados da figurinha e do vendedor correspondente
        const { data, error } = await _supabase
          .from('vitrine_ofertas')
          .select(`
            id,
            preco,
            estoque,
            user_id,
            figurinhas (
              id,
              numero,
              nome,
              imagem,
              selecao_escuderia
            ),
            vendedores_autorizados (
              id,
              nome
            )
          `)
          .gt('estoque', 0);

        if (error) throw error;

        // Mapeia os dados utilizando diretamente os dados retornados da relação do banco
        allData = (data || []).map(item => ({
          oferta_id: item.id,
          preco: item.preco || 0,
          quantidade: item.estoque || 0,
          vendedorId: item.vendedores_autorizados?.id || item.user_id,
          vendedorNome: item.vendedores_autorizados?.nome || 'Vendedor Independente',
          id: item.figurinhas?.id,
          numero: item.figurinhas?.numero,
          nome: item.figurinhas?.nome,
          imagem: item.figurinhas?.imagem,
          selecao_escuderia: item.figurinhas?.selecao_escuderia
        })).filter(item => item.id);

        allData.sort((a, b) => (a.numero || 0) - (b.numero || 0));
        
        const colecoes = [...new Set(allData.map(i => i.selecao_escuderia).filter(Boolean))].sort();
        const select = document.getElementById('filterColecao');
        colecoes.forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);
        
        renderizar(allData);

      } catch (err) {
        console.error("Erro ao carregar vitrine:", err);
        document.getElementById('catalog').innerHTML = `<p style="text-align: center; grid-column: 1/-1; color: #ef4444; padding: 2rem;">Erro ao carregar ofertas. Verifique o console.</p>`;
      }
    }

    function renderizar(lista) {
      const catalog = document.getElementById('catalog');
      if (lista.length === 0) {
        catalog.innerHTML = `<p style="text-align: center; grid-column: 1/-1; color: #94a3b8; padding: 2rem;">Nenhuma oferta encontrada na vitrine.</p>`;
        return;
      }

      catalog.innerHTML = lista.map(f => {
        const precoNum = f.preco || 0;
        const precoFormatado = precoNum.toFixed(2).replace('.', ',');

        return `
          <div class="sticker-card">
            <div class="sticker-img-wrap">
              <img src="${f.imagem || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'}" alt="${f.nome}">
            </div>
            <div class="sticker-info">
              <div class="colecao-label">${f.selecao_escuderia || 'Coleção'}</div>
              <div class="vendedor-label">👤 ${f.vendedorNome}</div>
              <div class="sticker-title">Nº ${f.numero} - ${f.nome || 'Sem Nome'}</div>
              <div class="sticker-qtd">Disponível: ${f.quantidade}</div>
              <div class="sticker-price">€ ${precoFormatado}</div>
              <a href="perfil.html?id=${f.vendedorId}" class="btn-vendedor">Ver Vendedor ➔</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filtrar() {
      const busca = document.getElementById('search').value.toLowerCase().trim();
      const col = document.getElementById('filterColecao').value;
      
      const filtrado = allData.filter(i => {
        const matchBusca = !busca || String(i.numero).includes(busca) || (i.nome && i.nome.toLowerCase().includes(busca));
        const matchCol = !col || i.selecao_escuderia === col;
        return matchBusca && matchCol;
      });
      
      renderizar(filtrado);
    }

    init();
  </script>
</body>
</html>
