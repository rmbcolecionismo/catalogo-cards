<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Marketplace de Figurinhas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #101827;
      --gold: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); min-height: 100vh; color: #f8fafc; padding-bottom: 50px; }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1rem 0;
    }
    .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-right: 15px; }
    .top-nav a:hover { color: var(--gold); }
    
    .btn-nav-admin {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--gold);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .btn-nav-admin:hover {
      background: var(--gold);
      color: #0f172a;
    }

    header { padding: 1.5rem 1rem 1rem; text-align: center; }
    header h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(to right, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: #94a3b8; font-size: 0.85rem; margin-top: 0.3rem; }

    .controls-wrapper { 
      max-width: 1100px; 
      margin: 0 auto 1.5rem; 
      padding: 1rem; 
      background: rgba(255, 255, 255, 0.05); 
      backdrop-filter: blur(10px); 
      border-radius: 16px; 
      border: 1px solid rgba(255,255,255,0.1); 
      display: flex; 
      flex-direction: column;
      gap: 10px; 
    }
    .filters-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filter-select, .filter-input { 
      flex: 1; 
      min-width: 200px; 
      padding: 0.8rem; 
      border-radius: 10px; 
      background: rgba(15, 23, 42, 0.8); 
      border: 1px solid rgba(255,255,255,0.2); 
      color: white; 
      outline: none; 
      font-size: 0.85rem;
    }
    .filter-select:focus, .filter-input:focus { border-color: var(--gold); }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.25rem; }

    .sticker-card { background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); color: #0f172a; display: flex; flex-direction: column; transition: 0.3s; }
    .sticker-card:hover { transform: translateY(-3px); }
    .sticker-img-wrap { height: 160px; background: #f8fafc; padding: 10px; display: flex; align-items: center; justify-content: center; }
    .sticker-card img { width: 100%; height: 100%; object-fit: contain; }
    
    .sticker-info { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .card-row { font-size: 0.75rem; color: #475569; }
    .card-row span { font-weight: 700; color: #0f172a; }
    
    .vendedor-label { font-size: 0.75rem; color: #2563eb; font-weight: 700; margin-bottom: 2px; }
    .sticker-title { font-size: 0.9rem; font-weight: 700; color: #0f172a; margin: 2px 0; }
    .sticker-price { font-size: 1.1rem; font-weight: 800; color: #059669; margin: 4px 0; }
    .sticker-qtd { font-size: 0.75rem; color: #64748b; font-weight: 600; }
    
    .btn-vendedor { 
      background: #2563eb; 
      color: white; 
      border: none; 
      padding: 0.7rem; 
      border-radius: 8px; 
      width: 100%; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: auto; 
      transition: 0.2s; 
      text-align: center;
      text-decoration: none;
      display: block;
      font-size: 0.85rem;
    }
    .btn-vendedor:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="nav-links">
      <a href="index.html" style="color: var(--gold);">🏠 Home</a>
    </div>
    <a href="login.html" class="btn-nav-admin">
      🔐 Login / Painel
    </a>
  </div>

  <header>
    <h1>🛍️ Marketplace de Figurinhas</h1>
    <p>Encontre figurinhas disponíveis e visite o perfil dos vendedores para contato</p>
  </header>

  <div class="container">
    <div class="controls-wrapper">
      <select id="filterAlbum" class="filter-select" onchange="filtrar()">
        <option value="">📂 Todos os Álbuns</option>
      </select>

      <div class="filters-row">
        <input type="text" id="search" placeholder="🔍 Buscar por nome ou código..." class="filter-input" oninput="filtrar()">
        <select id="filterColecao" class="filter-select" onchange="filtrar()">
          <option value="">⚽ Todas as Seleções / Escuderias</option>
        </select>
        <select id="filterTipo" class="filter-select" onchange="filtrar()">
          <option value="">🏷️ Todos os Tipos</option>
        </select>
      </div>
    </div>

    <div class="grid" id="catalog">
      <p style="text-align: center; grid-column: 1/-1; color: #94a3b8; padding: 2rem;">Carregando vitrine...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allData = [];

    async function init() {
      try {
        // 1. Busca os álbuns da tabela 'albuns'
        const { data: albuns } = await _supabase.from('albuns').select('id, nome');
        const albunsMap = {};
        if (albuns) {
          albuns.forEach(a => { albunsMap[a.id] = a.nome; });
        }

        // 2. Busca as figurinhas
        const { data: figurinhas, error: errFig } = await _supabase.from('figurinhas').select('*');
        if (errFig) throw errFig;

        const figurinhasMap = {};
        if (figurinhas) {
          figurinhas.forEach(fig => {
            figurinhasMap[fig.id] = {
              ...fig,
              albumNome: albunsMap[fig.album_id] || 'Álbum Desconhecido'
            };
          });
        }

        // 3. Busca as ofertas ativas na vitrine
        const { data: ofertas, error: errOfertas } = await _supabase
          .from('vitrine_ofertas')
          .select('*')
          .gt('estoque', 0);

        if (errOfertas) throw errOfertas;

        // 4. Mapeia os dados usando diretamente a coluna 'nome_vendedor' e o 'user_id'
        allData = (ofertas || []).map(oferta => {
          const figId = oferta.figurinha_id || oferta.id_figurinha;
          const fig = figurinhasMap[figId] || {};

          return {
            oferta_id: oferta.id,
            preco: oferta.preco || 0,
            quantidade: oferta.estoque || 0,
            vendedorId: oferta.user_id,
            vendedorNome: oferta.nome_vendedor || 'Vendedor',
            numero: fig.numero || 'N/A',
            nome: fig.nome || 'Sem Nome',
            imagem: fig.imagem || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg',
            selecao_escuderia: fig.selecao_escuderia || 'N/A',
            album: fig.albumNome || 'N/A',
            tipo: fig.tipo || 'N/A'
          };
        });

        allData.sort((a, b) => (a.numero || 0) - (b.numero || 0));
        
        // Popula os selects de filtros dinamicamente
        const albunsList = [...new Set(allData.map(i => i.album).filter(item => item !== 'N/A'))].sort();
        const selectAlbum = document.getElementById('filterAlbum');
        albunsList.forEach(a => selectAlbum.innerHTML += `<option value="${a}">${a}</option>`);

        const colecoesList = [...new Set(allData.map(i => i.selecao_escuderia).filter(item => item !== 'N/A'))].sort();
        const selectColecao = document.getElementById('filterColecao');
        colecoesList.forEach(c => selectColecao.innerHTML += `<option value="${c}">${c}</option>`);

        const tiposList = [...new Set(allData.map(i => i.tipo).filter(item => item !== 'N/A'))].sort();
        const selectTipo = document.getElementById('filterTipo');
        tiposList.forEach(t => selectTipo.innerHTML += `<option value="${t}">${t}</option>`);
        
        renderizar(allData);

      } catch (err) {
        console.error("Erro detalhado ao carregar vitrine:", err);
        document.getElementById('catalog').innerHTML = `<p style="text-align: center; grid-column: 1/-1; color: #ef4444; padding: 2rem;">Erro ao carregar ofertas. Verifique o console.</p>`;
      }
    }

    function renderizar(lista) {
      const catalog = document.getElementById('catalog');
      if (lista.length === 0) {
        catalog.innerHTML = `<p style="text-align: center; grid-column: 1/-1; color: #94a3b8; padding: 2rem;">Nenhuma oferta encontrada com esses filtros.</p>`;
        return;
      }

      catalog.innerHTML = lista.map(f => {
        const precoNum = f.preco || 0;
        const precoFormatado = precoNum.toFixed(2).replace('.', ',');

        return `
          <div class="sticker-card">
            <div class="sticker-img-wrap">
              <img src="${f.imagem}" alt="${f.nome}">
            </div>
            <div class="sticker-info">
              <div class="vendedor-label">👤 ${f.vendedorNome}</div>
              <div class="sticker-title">${f.nome}</div>
              <div class="card-row">Código: <span>${f.numero}</span></div>
              <div class="card-row">Álbum: <span>${f.album}</span></div>
              <div class="card-row">Seleção: <span>${f.selecao_escuderia}</span></div>
              <div class="card-row">Tipo: <span>${f.tipo}</span></div>
              <div class="sticker-qtd" style="margin-top: 2px;">Disponível: ${f.quantidade}</div>
              <div class="sticker-price">€ ${precoFormatado}</div>
              <a href="perfil.html?id=${f.vendedorId}" class="btn-vendedor">Ver Vendedor ➔</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filtrar() {
      const busca = document.getElementById('search').value.toLowerCase().trim();
      const albumSel = document.getElementById('filterAlbum').value;
      const colSel = document.getElementById('filterColecao').value;
      const tipoSel = document.getElementById('filterTipo').value;
      
      const filtrado = allData.filter(i => {
        const matchBusca = !busca || 
          String(i.numero).includes(busca) || 
          (i.nome && i.nome.toLowerCase().includes(busca));
        
        const matchAlbum = !albumSel || i.album === albumSel;
        const matchCol = !colSel || i.selecao_escuderia === colSel;
        const matchTipo = !tipoSel || i.tipo === tipoSel;

        return matchBusca && matchAlbum && matchCol && matchTipo;
      });
      
      renderizar(filtrado);
    }

    init();
  </script>
</body>
</html>
