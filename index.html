<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Marketplace de Figurinhas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #101827; /* Mesma cor do seu Admin */
      --accent: #25d366;
      --gold: #f59e0b;
      --card-bg: #ffffff;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); min-height: 100vh; color: #f8fafc; padding-bottom: 100px; }

    /* HEADER */
    header { padding: 2rem 1rem; text-align: center; }
    header h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(to right, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* FILTROS MODERNOS */
    .controls-wrapper { max-width: 800px; margin: 0 auto 1.5rem; padding: 1rem; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; }
    .filter-select { flex: 1; padding: 0.8rem; border-radius: 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.2); color: white; }

    /* GRID ESTILO ADMIN */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.25rem; }

    /* CARD PREMIUM */
    .sticker-card { background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); color: #0f172a; display: flex; flex-direction: column; transition: 0.3s; }
    .sticker-img-wrap { height: 180px; background: #f8fafc; padding: 10px; display: flex; align-items: center; justify-content: center; }
    .sticker-card img { width: 100%; height: 100%; object-fit: contain; }
    .sticker-info { padding: 10px; flex: 1; }
    .colecao-label { font-size: 0.65rem; color: #64748b; font-weight: 700; text-transform: uppercase; }
    .sticker-title { font-size: 0.9rem; font-weight: 700; margin: 4px 0; }
    .sticker-price { font-size: 1.1rem; font-weight: 800; color: #059669; margin: 5px 0; }
    .btn-add { background: var(--primary); color: white; border: none; padding: 0.7rem; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <header><h1>Coleção Disponível</h1></header>

  <div class="container">
    <div class="controls-wrapper">
      <input type="text" id="search" placeholder="🔍 Buscar figurinha..." class="filter-select" oninput="filtrar()">
      <select id="filterColecao" class="filter-select" onchange="filtrar()">
        <option value="">Todas as Coleções</option>
      </select>
    </div>

    <div class="grid" id="catalog"></div>
  </div>

  <script>
    const _supabase = supabase.createClient("SUA_URL", "SUA_KEY");
    let allData = [];

    async function init() {
      const { data } = await _supabase.from('figurinhas').select('*');
      allData = data;
      
      // Popular select sem mexer no banco, apenas renomeando visualmente
      const colecoes = [...new Set(data.map(i => i.selecao_escuderia).filter(Boolean))];
      const select = document.getElementById('filterColecao');
      colecoes.forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);
      
      renderizar(allData);
    }

    function renderizar(lista) {
      const catalog = document.getElementById('catalog');
      catalog.innerHTML = lista.map(f => `
        <div class="sticker-card">
          <div class="sticker-img-wrap"><img src="${f.imagem}"></div>
          <div class="sticker-info">
            <div class="colecao-label">COLEÇÃO: ${f.selecao_escuderia || 'Geral'}</div>
            <div class="sticker-title">${f.nome}</div>
            <div class="sticker-price">€ ${f.preco.toFixed(2).replace('.', ',')}</div>
            <button class="btn-add" onclick="alert('Adicionado: ${f.nome}')">Adicionar</button>
          </div>
        </div>
      `).join('');
    }

    function filtrar() {
      const busca = document.getElementById('search').value.toLowerCase();
      const col = document.getElementById('filterColecao').value;
      
      const filtrado = allData.filter(i => 
        (i.nome.toLowerCase().includes(busca)) && 
        (col === "" || i.selecao_escuderia === col)
      );
      renderizar(filtrado);
    }

    init();
  </script>
</body>
</html>
