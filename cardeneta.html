<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minha Cardeneta de Figurinhas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #f59e0b; --bg: #0f172a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #f8fafc; padding: 20px; padding-bottom: 50px; }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; max-width: 1250px; margin: 0 auto 20px; flex-wrap: wrap; gap: 10px; }
    .nav-links { display: flex; align-items: center; gap: 15px; }
    .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .nav-links a:hover { color: var(--gold); }
    
    .container { max-width: 1250px; margin: 0 auto; }
    
    /* Painel de Estatísticas */
    .stats-panel { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .stats-info h2 { font-size: 1.5rem; color: var(--gold); margin-bottom: 5px; }
    .stats-numbers { display: flex; gap: 12px; flex-wrap: wrap; }
    .stat-box { background: rgba(15, 23, 42, 0.6); padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); text-align: center; min-width: 90px; }
    .stat-box span { display: block; font-size: 0.7rem; color: #94a3b8; }
    .stat-box strong { font-size: 1.05rem; color: #f8fafc; }

    /* Controles e Filtros */
    .controls-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; background: rgba(30, 41, 59, 0.7); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); align-items: center; }
    .filter-field { background: #0f172a; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; flex: 1; min-width: 200px; }
    .filter-field:focus { border-color: var(--gold); }
    
    .btn-gold { background: var(--gold); color: #0f172a; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.85rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-gold:hover { background: #fbbf24; }

    /* Menu de Compartilhamento WhatsApp (Dropdown) */
    .share-dropdown { position: relative; display: inline-block; }
    .share-menu-content { display: none; position: absolute; right: 0; background-color: #1e293b; min-width: 220px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.4); z-index: 10; border-radius: 8px; border: 1px solid rgba(245, 158, 11, 0.3); overflow: hidden; }
    .share-menu-content button { color: #f8fafc; padding: 10px 14px; text-decoration: none; display: block; width: 100%; text-align: left; background: none; border: none; font-size: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .share-menu-content button:hover { background-color: rgba(245, 158, 11, 0.15); color: var(--gold); }
    .share-dropdown.active .share-menu-content { display: block; }

    /* Seções e Agrupamentos Estilo Cardeneta Física */
    .secao-grupo { margin-bottom: 30px; }
    .secao-titulo { font-size: 1.1rem; font-weight: 700; color: var(--gold); margin-bottom: 12px; border-bottom: 1px solid rgba(245, 158, 11, 0.3); padding-bottom: 6px; display: flex; align-items: center; gap: 8px; }

    .cardeneta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    
    .fig-card { background: rgba(30, 41, 59, 0.85); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: all 0.2s ease; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    .fig-card:hover { transform: translateY(-3px); border-color: var(--gold); }
    
    .fig-card.possui { background: rgba(15, 23, 42, 0.7); border-color: rgba(52, 211, 153, 0.5); }
    .fig-card.possui img { opacity: 0.4; filter: grayscale(20%); }
    .fig-card.possui .fig-footer { background: rgba(52, 211, 153, 0.2); color: #34d399; }

    .fig-img-wrap { height: 170px; background: #0f172a; padding: 10px; display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .fig-card img { width: 100%; height: 100%; object-fit: contain; }
    
    .fig-badge-status { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; font-size: 0.65rem; padding: 3px 7px; border-radius: 4px; font-weight: 700; }
    .fig-card.possui .fig-badge-status { background: #34d399; color: #0f172a; }

    .fig-content { padding: 10px; flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .fig-numero { font-size: 0.75rem; color: var(--gold); font-weight: 700; }
    .fig-nome { font-size: 0.8rem; font-weight: 600; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fig-selecao { font-size: 0.7rem; color: #94a3b8; }
    .fig-tipo { font-size: 0.68rem; color: var(--gold); font-weight: 600; margin-top: 2px; }
    
    .fig-actions-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: rgba(15, 23, 42, 0.5); border-top: 1px solid rgba(255,255,255,0.05); }
    .qty-btn { background: #334155; color: white; border: none; width: 24px; height: 24px; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
    .qty-btn:hover { background: var(--gold); color: #0f172a; }
    .qty-display { font-size: 0.75rem; font-weight: 700; color: #cbd5e1; }

    .fig-footer { padding: 6px; text-align: center; font-size: 0.7rem; font-weight: 700; background: rgba(255,255,255,0.05); color: #94a3b8; }
    .empty-state { text-align: center; grid-column: 1 / -1; padding: 40px; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-nav">
      <div class="nav-links">
        <a href="index.html">🏠 Home</a>
        <a href="vitrine.html">📦 Minha Vitrine</a>
      </div>
      <div>
        <span id="userEmail" style="font-size: 0.85rem; color: var(--gold);">Carregando usuário...</span>
      </div>
    </div>

    <!-- Painel de Estatísticas Atualizado -->
    <div class="stats-panel">
      <div class="stats-info">
        <h2>📖 Minha Cardeneta</h2>
        <p style="font-size: 0.85rem; color: #94a3b8;">Clique na imagem para marcar/desmarcar ou use os botões para controlar repetidas.</p>
      </div>
      <div class="stats-numbers">
        <div class="stat-box">
          <span>Total Álbum</span>
          <strong id="statTotal">0</strong>
        </div>
        <div class="stat-box">
          <span>Tenho</span>
          <strong id="statTenho" style="color: #34d399;">0</strong>
        </div>
        <div class="stat-box">
          <span>Faltam</span>
          <strong id="statFaltam" style="color: #f8fafc;">0</strong>
        </div>
        <div class="stat-box">
          <span>Repetidas</span>
          <strong id="statRepetidas" style="color: var(--gold);">0</strong>
        </div>
        <div class="stat-box">
          <span>Progresso</span>
          <strong id="statPorcentagem" style="color: var(--gold);">0%</strong>
        </div>
      </div>
    </div>

    <!-- Barra de Filtros -->
    <div class="controls-bar">
      <select id="selectAlbum" class="filter-field" onchange="mudarAlbum()">
        <option value="">Selecione um Álbum...</option>
      </select>
      <select id="selectFiltroStatus" class="filter-field" onchange="renderizarGrid()">
        <option value="todos">👁️ Mostrar Todas</option>
        <option value="faltam">❌ Mostrar Apenas o que Faltam</option>
        <option value="possui">✅ Mostrar Apenas o que Possui</option>
      </select>
      
      <!-- Botão Compartilhar WhatsApp com Dropdown -->
      <div class="share-dropdown" id="shareDropdown">
        <button class="btn-gold" onclick="toggleShareMenu()">
          📤 Compartilhar WhatsApp ▾
        </button>
        <div class="share-menu-content">
          <button onclick="enviarWhatsApp('ambos')">📋 Faltantes e Repetidas</button>
          <button onclick="enviarWhatsApp('faltantes')">❌ Apenas Faltantes</button>
          <button onclick="enviarWhatsApp('repetidas')">🔁 Apenas Repetidas</button>
        </div>
      </div>
    </div>

    <!-- Container da Coleção Agrupada -->
    <div id="cardenetaContainer">
      <div class="empty-state">Selecione um álbum acima para visualizar sua caderneta.</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let usuarioAtual = null;
    let albumAtualId = null;
    let nomeAlbumAtual = "";
    let figurinhasDoAlbum = [];
    let mapaCadernetaUsuario = {}; 

    // Ordem oficial exata pedida para Adrenalyn XL 2026 com bandeiras/ícones na frente
    const ordemAdrenalynXL = [
      "Golden Ballers ⭐",
      "Argélia", "Argentina", "Austrália", "Áustria e Bélgica", "Brasil", "Canadá", 
      "Cabo Verde", "Colômbia", "Croácia", "Curação", "Equador", "Egito", "Inglaterra", 
      "França", "Alemanha", "Gana", "Haiti", "Irã", "Costa do Marfim", "Japão", 
      "Jordânia", "Coreia do Sul", "México", "Marrocos", "Países Baixos", "Novas Zelândia", 
      "Noruega", "Panamá", "Paraguai", "Portugal", "Catar", "Arábia Saudita", "Escócia", 
      "Senegal", "África do Sul", "Espanha", "Suíça", "Tunísia", "Estados Unidos", 
      "Uruguai", "Uzbequistão", "Contenders - Team Crests", "Dinamarca", "Itália", 
      "Jamaica", "Polônia", "Suécia", "Turquia", "Top Keepers 🧤", "Defensive Rocks 🛡️", 
      "Modfield Maestros 🎯", "Goal Machines ⚽", "Master Rookies 🌟", 
      "Official Emblems & Mascots 🏆", "Eternos 22"
    ];

    // Bandeiras / Icones para grupos específicos atualizados
    const iconesGrupos = {
      "Argélia": "🇩🇿", "Argentina": "🇦🇷", "Austrália": "🇦🇺", "Áustria e Bélgica": "🇦🇹🇧🇪", 
      "Brasil": "🇧🇷", "Canadá": "🇨🇦", "Cabo Verde": "🇨🇻", "Colômbia": "🇨🇴", "Croácia": "🇭🇷", 
      "Curação": "🇨🇼", "Equador": "🇪🇨", "Egito": "🇪🇬", "Inglaterra": "🏴󠁧󠁢󠁥󠁮󠁧󠁿", "França": "🇫🇷", 
      "Alemanha": "🇩🇪", "Gana": "🇬🇭", "Haiti": "🇭🇹", "Irã": "🇮🇷", "Costa do Marfim": "🇨🇮", 
      "Japão": "🇯🇵", "Jordânia": "🇯🇴", "Coreia do Sul": "🇰🇷", "México": "🇲🇽", "Marrocos": "🇲🇦", 
      "Países Baixos": "🇳🇱", "Novas Zelândia": "🇳🇿", "Noruega": "🇳🇴", "Panamá": "🇵🇦", 
      "Paraguai": "🇵🇾", "Portugal": "🇵🇹", "Catar": "🇶🇦", "Arábia Saudita": "🇸🇦", "Escócia": "🏴󠁧󠁢󠁳󠁣󠁴󠁿", 
      "Senegal": "🇸🇳", "África do Sul": "🇿🇦", "Espanha": "🇪🇸", "Suíça": "🇨🇭", "Tunísia": "🇹🇳", 
      "Estados Unidos": "🇺🇸", "Uruguai": "🇺🇾", "Uzbequistão": "🇺🇿", "Dinamarca": "🇩🇰", 
      "Itália": "🇮🇹", "Jamaica": "🇯🇲", "Polônia": "🇵🇱", "Suécia": "🇸🇪", "Turquia": "🇹🇷",
      "Eternos 22": "🇦🇷"
    };

    async function initCardeneta() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        alert("Você precisa fazer login para acessar sua caderneta.");
        window.location.href = "login.html";
        return;
      }
      usuarioAtual = session.user;
      document.getElementById('userEmail').innerText = `👤 ${usuarioAtual.email}`;

      const { data: albuns, error } = await _supabase.from('albuns').select('id, nome');
      if (error) {
        alert("Erro ao carregar álbuns: " + error.message);
        return;
      }

      const select = document.getElementById('selectAlbum');
      select.innerHTML = '<option value="">Selecione um Álbum...</option>' + 
        albuns.map(a => `<option value="${a.id}">${a.nome}</option>`).join('');
    }

    async function mudarAlbum() {
      const selectElement = document.getElementById('selectAlbum');
      albumAtualId = selectElement.value;
      nomeAlbumAtual = selectElement.options[selectElement.selectedIndex]?.text || '';

      if (!albumAtualId) {
        document.getElementById('cardenetaContainer').innerHTML = '<div class="empty-state">Selecione um álbum acima para visualizar sua caderneta.</div>';
        atualizarEstatisticas(0, 0, 0);
        return;
      }

      const { data: figs, error } = await _supabase
        .from('figurinhas')
        .select('*')
        .eq('album_id', albumAtualId)
        .order('numero', { ascending: true });

      if (error) {
        alert("Erro ao buscar figurinhas do álbum.");
        return;
      }
      figurinhasDoAlbum = figs || [];

      const { data: userColecao } = await _supabase
        .from('usuario_cardeneta')
        .select('figurinha_id, quantidade')
        .eq('user_id', usuarioAtual.id);

      mapaCadernetaUsuario = {};
      if (userColecao) {
        userColecao.forEach(item => {
          mapaCadernetaUsuario[item.figurinha_id] = item.quantidade;
        });
      }

      renderizarGrid();
    }

    function renderizarGrid() {
      const container = document.getElementById('cardenetaContainer');
      const filtroStatus = document.getElementById('selectFiltroStatus').value;

      if (figurinhasDoAlbum.length === 0) {
        container.innerHTML = '<div class="empty-state">Este álbum ainda não possui figurinhas cadastradas.</div>';
        atualizarEstatisticas(0, 0, 0);
        return;
      }

      // Cálculo de estatísticas gerais
      let totalAlb = figurinhasDoAlbum.length;
      let tenhoCount = 0;
      let repetidasCount = 0;

      figurinhasDoAlbum.forEach(f => {
        const q = mapaCadernetaUsuario[f.id] || 0;
        if (q > 0) {
          tenhoCount++;
          if (q > 1) {
            repetidasCount += (q - 1);
          }
        }
      });

      atualizarEstatisticas(totalAlb, tenhoCount, repetidasCount);

      // Filtragem das figurinhas
      let filtradas = figurinhasDoAlbum.filter(f => {
        const qtd = mapaCadernetaUsuario[f.id] || 0;
        const possui = qtd > 0;
        if (filtroStatus === 'possui' && !possui) return false;
        if (filtroStatus === 'faltam' && possui) return false;
        return true;
      });

      if (filtradas.length === 0) {
        container.innerHTML = '<div class="empty-state">Nenhuma figurinha encontrada com este filtro.</div>';
        return;
      }

      // Agrupar figurinhas conforme a regra do Adrenalyn XL
      let gruposMap = {};
      filtradas.forEach(f => {
        let categoria = f.selecao_escuderia || f.selecao || f.escuderia || f.tipo || 'Geral';
        if (!gruposMap[categoria]) gruposMap[categoria] = [];
        gruposMap[categoria].push(f);
      });

      // Ordenar chaves dos grupos de acordo com a ordem oficial do Adrenalyn XL
      let chavesOrdenadas = Object.keys(gruposMap).sort((a, b) => {
        let indexA = ordemAdrenalynXL.indexOf(a);
        let indexB = ordemAdrenalynXL.indexOf(b);
        if (indexA !== -1 && indexB !== -1) return indexA - indexB;
        if (indexA !== -1) return -1;
        if (indexB !== -1) return 1;
        return a.localeCompare(b);
      });

      let htmlFinal = '';

      chavesOrdenadas.forEach(cat => {
        let icone = iconesGrupos[cat] ? `${iconesGrupos[cat]} ` : '';
        htmlFinal += `
          <div class="secao-grupo">
            <div class="secao-titulo">${icone}${cat}</div>
            <div class="cardeneta-grid">
        `;

        htmlFinal += gruposMap[cat].map(f => {
          const qtd = mapaCadernetaUsuario[f.id] || 0;
          const possui = qtd > 0;
          const classeCard = possui ? 'fig-card possui' : 'fig-card';
          
          let textoStatus = possui ? (qtd > 1 ? `✅ Tenho +${qtd-1} Repetida(s)` : '✅ Já tenho') : '❌ Falta';
          let footerTexto = possui ? (qtd > 1 ? `Tenho +${qtd-1} Repetida(s)` : '') : 'Falta';

          const imgUrl = f.imagem || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg';
          const selecao = f.selecao_escuderia || f.selecao || f.escuderia || '';
          const tipoCard = f.tipo || '';

          let numLimpo = String(f.numero || '').replace(/#/g, '').trim();

          return `
            <div class="${classeCard}" id="card-${f.id}">
              <div class="fig-img-wrap" onclick="clicarMarcar('${f.id}')" style="cursor:pointer;" title="Clique para alternar entre Possuir/Falta">
                <span class="fig-badge-status" id="badge-${f.id}">${textoStatus}</span>
                <img src="${imgUrl}" alt="${f.nome || 'Figurinha'}">
              </div>
              <div class="fig-content" onclick="clicarMarcar('${f.id}')" style="cursor:pointer;">
                <div class="fig-numero"># ${numLimpo}</div>
                <div class="fig-nome" title="${f.nome || ''}">${f.nome || 'Sem Nome'}</div>
                ${selecao ? `<div class="fig-selecao">${selecao}</div>` : ''}
                ${tipoCard ? `<div class="fig-tipo">⭐ ${tipoCard}</div>` : ''}
              </div>
              <div class="fig-actions-row">
                <button class="qty-btn" onclick="event.stopPropagation(); alterarQtd('${f.id}', -1)" title="Diminuir">-</button>
                <span class="qty-display" id="qty-${f.id}">Qtd: ${qtd}</span>
                <button class="qty-btn" onclick="event.stopPropagation(); alterarQtd('${f.id}', 1)" title="Aumentar">+</button>
              </div>
              <div class="fig-footer" id="footer-${f.id}">${footerTexto}</div>
            </div>
          `;
        }).join('');

        htmlFinal += `</div></div>`;
      });

      container.innerHTML = htmlFinal;
    }

    async function clicarMarcar(figurinhaId) {
      const qtdAtual = mapaCadernetaUsuario[figurinhaId] || 0;
      const novaQtd = qtdAtual > 0 ? 0 : 1;
      await salvarQuantidadeBanco(figurinhaId, novaQtd);
    }

    async function alterarQtd(figurinhaId, delta) {
      const qtdAtual = mapaCadernetaUsuario[figurinhaId] || 0;
      let novaQtd = qtdAtual + delta;
      if (novaQtd < 0) novaQtd = 0;
      await salvarQuantidadeBanco(figurinhaId, novaQtd);
    }

    async function salvarQuantidadeBanco(figurinhaId, novaQtd) {
      if (novaQtd === 0) {
        delete mapaCadernetaUsuario[figurinhaId];
      } else {
        mapaCadernetaUsuario[figurinhaId] = novaQtd;
      }

      atualizarCardVisual(figurinhaId);
      recalcularEstatisticasGlobais();

      if (novaQtd === 0) {
        await _supabase
          .from('usuario_cardeneta')
          .delete()
          .eq('user_id', usuarioAtual.id)
          .eq('figurinha_id', figurinhaId);
      } else {
        await _supabase
          .from('usuario_cardeneta')
          .upsert([{ 
            user_id: usuarioAtual.id, 
            figurinha_id: figurinhaId, 
            quantidade: novaQtd 
          }], { onConflict: 'user_id, figurinha_id' });
      }
    }

    function atualizarCardVisual(figurinhaId) {
      const card = document.getElementById(`card-${figurinhaId}`);
      if (!card) return;

      const qtd = mapaCadernetaUsuario[figurinhaId] || 0;
      const possui = qtd > 0;
      const badge = document.getElementById(`badge-${figurinhaId}`);
      const qtyDisplay = document.getElementById(`qty-${figurinhaId}`);
      const footer = document.getElementById(`footer-${figurinhaId}`);

      if (possui) {
        card.classList.add('possui');
        badge.innerText = qtd > 1 ? `✅ Tenho +${qtd-1} Repetida(s)` : '✅ Já tenho';
        badge.style.background = "#34d399";
        badge.style.color = "#0f172a";
        footer.innerText = qtd > 1 ? `Tenho +${qtd-1} Repetida(s)` : '';
      } else {
        card.classList.remove('possui');
        badge.innerText = '❌ Falta';
        badge.style.background = "rgba(0,0,0,0.7)";
        badge.style.color = "white";
        footer.innerText = 'Falta';
      }
      qtyDisplay.innerText = `Qtd: ${qtd}`;
    }

    function recalcularEstatisticasGlobais() {
      const total = figurinhasDoAlbum.length;
      let tenhoCount = 0;
      let repetidasCount = 0;

      Object.values(mapaCadernetaUsuario).forEach(q => {
        if (q > 0) {
          tenhoCount++;
          if (q > 1) {
            repetidasCount += (q - 1);
          }
        }
      });

      atualizarEstatisticas(total, tenhoCount, repetidasCount);
    }

    function atualizarEstatisticas(total, tenho, repetidas) {
      const faltam = total - tenho;
      const porcentagem = total > 0 ? ((tenho / total) * 100).toFixed(1) : 0;

      document.getElementById('statTotal').innerText = total;
      document.getElementById('statTenho').innerText = tenho;
      document.getElementById('statFaltam').innerText = faltam;
      document.getElementById('statRepetidas').innerText = repetidas;
      document.getElementById('statPorcentagem').innerText = porcentagem + '%';
    }

    function toggleShareMenu() {
      const dropdown = document.getElementById('shareDropdown');
      dropdown.classList.toggle('active');
    }

    window.onclick = function(event) {
      if (!event.target.matches('.btn-gold') && !event.target.closest('.share-dropdown')) {
        document.getElementById('shareDropdown').classList.remove('active');
      }
    }

    function enviarWhatsApp(tipo) {
      if (!albumAtualId) return alert("Selecione um álbum primeiro.");
      document.getElementById('shareDropdown').classList.remove('active');

      let texto = `⚽ *${nomeAlbumAtual || 'Minha Coleção'}*\n`;

      if (tipo === 'ambos' || tipo === 'faltantes') {
        const faltantesObj = {};
        figurinhasDoAlbum.forEach(f => {
          const qtd = mapaCadernetaUsuario[f.id] || 0;
          if (qtd === 0) {
            const cat = f.selecao_escuderia || f.selecao || f.escuderia || f.tipo || 'Geral';
            if (!faltantesObj[cat]) faltantesObj[cat] = [];
            let numLimpo = String(f.numero || '').replace(/#/g, '').trim();
            faltantesObj[cat].push(numLimpo);
          }
        });

        if (Object.keys(faltantesObj).length > 0) {
          texto += `\n❌ *Faltantes*\n`;
          for (let cat in faltantesObj) {
            let icone = iconesGrupos[cat] ? `${iconesGrupos[cat]} ` : '';
            texto += `• ${icone}${cat}: ${faltantesObj[cat].join(', ')}\n`;
          }
        } else {
          texto += `\n❌ *Faltantes*: Álbum Completo! 🎉\n`;
        }
      }

      if (tipo === 'ambos' || tipo === 'repetidas') {
        const repetidasObj = {};
        figurinhasDoAlbum.forEach(f => {
          const qtd = mapaCadernetaUsuario[f.id] || 0;
          if (qtd > 1) {
            const cat = f.selecao_escuderia || f.selecao || f.escuderia || f.tipo || 'Geral';
            if (!repetidasObj[cat]) repetidasObj[cat] = [];
            let numLimpo = String(f.numero || '').replace(/#/g, '').trim();
            let numRepetidasExtras = qtd - 1;
            let sufixo = numRepetidasExtras > 0 ? ` (×${qtd})` : '';
            repetidasObj[cat].push(`${numLimpo}${sufixo}`);
          }
        });

        if (Object.keys(repetidasObj).length > 0) {
          texto += `\n🔁 *Repetidas*\n`;
          for (let cat in repetidasObj) {
            let icone = iconesGrupos[cat] ? `${iconesGrupos[cat]} ` : '';
            texto += `• ${icone}${cat}: ${repetidasObj[cat].join(', ')}\n`;
          }
        } else if (tipo === 'repetidas') {
          texto += `\n🔁 *Repetidas*: Nenhuma cadastrada.\n`;
        }
      }

      texto += `\nAlguém tem interesse em troca ou venda?`;

      const urlWpp = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
      window.open(urlWpp, '_blank');
    }

    initCardeneta();
  </script>
