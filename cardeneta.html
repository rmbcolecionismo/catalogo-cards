<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minha Cardeneta de Figurinhas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #f59e0b; --bg: #0f172a; --primary: #3b82f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #f8fafc; padding: 20px; padding-bottom: 50px; }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; max-width: 1250px; margin: 0 auto 20px; flex-wrap: wrap; gap: 10px; }
    .nav-links { display: flex; align-items: center; gap: 15px; }
    .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .nav-links a:hover { color: var(--gold); }
    
    .container { max-width: 1250px; margin: 0 auto; }
    
    /* Painel de Estatísticas */
    .stats-panel { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .stats-info h2 { font-size: 1.5rem; color: var(--gold); margin-bottom: 5px; }
    .stats-numbers { display: flex; gap: 20px; flex-wrap: wrap; }
    .stat-box { background: rgba(15, 23, 42, 0.6); padding: 10px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); text-align: center; min-width: 110px; }
    .stat-box span { display: block; font-size: 0.75rem; color: #94a3b8; }
    .stat-box strong { font-size: 1.1rem; color: #f8fafc; }

    /* Controles e Filtros */
    .controls-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; background: rgba(30, 41, 59, 0.6); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
    .filter-field { background: #0f172a; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; flex: 1; min-width: 200px; }
    .filter-field:focus { border-color: var(--gold); }
    
    .btn-action { background: var(--gold); color: #0f172a; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
    .btn-action:hover { background: #fbbf24; }

    /* Grid da Cardeneta */
    .cardeneta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    
    .fig-card { background: rgba(30, 41, 59, 0.85); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: all 0.2s ease; position: relative; }
    .fig-card:hover { transform: translateY(-3px); border-color: var(--gold); }
    
    /* Estado: Figurinha que JÁ TEM (Ofuscada) */
    .fig-card.possui { background: rgba(15, 23, 42, 0.5); border-color: rgba(52, 211, 153, 0.4); }
    .fig-card.possui img { opacity: 0.35; filter: grayscale(30%); }
    .fig-card.possui .fig-footer { background: rgba(52, 211, 153, 0.15); color: #34d399; }

    .fig-img-wrap { height: 160px; background: #0f172a; padding: 10px; display: flex; align-items: center; justify-content: center; position: relative; }
    .fig-card img { width: 100%; height: 100%; object-fit: contain; transition: opacity 0.2s; }
    
    .fig-badge-status { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
    .fig-card.possui .fig-badge-status { background: #34d399; color: #0f172a; }

    .fig-content { padding: 10px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .fig-numero { font-size: 0.75rem; color: var(--gold); font-weight: 700; }
    .fig-nome { font-size: 0.8rem; font-weight: 600; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fig-footer { margin-top: auto; padding: 4px; text-align: center; font-size: 0.7rem; font-weight: 700; border-radius: 4px; background: rgba(255,255,255,0.05); color: #94a3b8; }

    .empty-state { text-align: center; grid-column: 1 / -1; padding: 40px; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-nav">
      <div class="nav-links">
        <a href="index.html">🏠 Voltar ao Marketplace</a>
        <a href="vitrine.html">📦 Minha Vitrine</a>
      </div>
      <div>
        <span id="userEmail" style="font-size: 0.85rem; color: var(--gold);">Carregando usuário...</span>
      </div>
    </div>

    <!-- Painel de Estatísticas -->
    <div class="stats-panel">
      <div class="stats-info">
        <h2>📖 Minha Cardeneta</h2>
        <p style="font-size: 0.85rem; color: #94a3b8;">Clique em uma figurinha para marcar ou desmarcar da sua coleção.</p>
      </div>
      <div class="stats-numbers">
        <div class="stat-box">
          <span>Total</span>
          <strong id="statTotal">0</strong>
        </div>
        <div class="stat-box">
          <span>Possui</span>
          <strong id="statPossui" style="color: #34d399;">0</strong>
        </div>
        <div class="stat-box">
          <span>Faltam</span>
          <strong id="statFaltam" style="color: #f8fafc;">0</strong>
        </div>
        <div class="stat-box">
          <span>Progresso</span>
          <strong id="statPorcentagem" style="color: var(--gold);">0%</strong>
        </div>
      </div>
    </div>

    <!-- Barra de Filtros -->
    <div class="controls-bar">
      <select id="selectAlbum" class="filter-field" onchange="mudarAlbum()">
        <option value="">Selecione um Álbum...</option>
      </select>
      <select id="selectFiltroStatus" class="filter-field" onchange="renderizarGrid()">
        <option value="todos">👁️ Mostrar Todas</option>
        <option value="faltam">❌ Mostrar Apenas o que Faltam</option>
        <option value="possui">✅ Mostrar Apenas o que Possui</option>
      </select>
      <button class="btn-action" onclick="copiarFaltantes()">📋 Copiar Faltantes p/ WhatsApp</button>
    </div>

    <!-- Grid da Coleção -->
    <div class="cardeneta-grid" id="cardenetaGrid">
      <div class="empty-state">Selecione um álbum acima para visualizar sua caderneta.</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let usuarioAtual = null;
    let albumAtualId = null;
    let figurinhasDoAlbum = [];
    let minhasFigurinhasIds = new Set(); // Armazena os IDs que o usuário já possui

    async function initCardeneta() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        alert("Você precisa fazer login para acessar sua caderneta.");
        window.location.href = "login.html";
        return;
      }
      usuarioAtual = session.user;
      document.getElementById('userEmail').innerText = `👤 ${usuarioAtual.email}`;

      // Carregar álbuns disponíveis no sistema
      const { data: albuns, error } = await _supabase.from('albuns').select('id, nome');
      if (error) {
        alert("Erro ao carregar álbuns: " + error.message);
        return;
      }

      const select = document.getElementById('selectAlbum');
      select.innerHTML = '<option value="">Selecione um Álbum...</option>' + 
        albuns.map(a => `<option value="${a.id}">${a.nome}</option>`).join('');
    }

    async function mudarAlbum() {
      albumAtualId = document.getElementById('selectAlbum').value;
      if (!albumAtualId) {
        document.getElementById('cardenetaGrid').innerHTML = '<div class="empty-state">Selecione um álbum acima para visualizar sua caderneta.</div>';
        atualizarEstatisticas(0, 0);
        return;
      }

      // 1. Carregar todas as figurinhas deste álbum
      const { data: figs, error } = await _supabase
        .from('figurinhas')
        .select('*')
        .eq('album_id', albumAtualId)
        .order('numero', { ascending: true });

      if (error) {
        alert("Erro ao buscar figurinhas do álbum.");
        return;
      }
      figurinhasDoAlbum = figs || [];

      // 2. Carregar quais figurinhas o usuário já tem marcadas na sua caderneta
      const { data: userColecao, error: errCol } = await _supabase
        .from('usuario_cardeneta') // Sugestão de tabela para salvar a coleção do usuário
        .select('figurinha_id')
        .eq('user_id', usuarioAtual.id);

      // Nota: Caso queira usar uma tabela dedicada para a cardeneta, crie-a com user_id e figurinha_id.
      minhasFigurinhasIds = new Set();
      if (userColecao) {
        userColecao.forEach(item => minhasFigurinhasIds.add(item.figurinha_id));
      }

      renderizarGrid();
    }

    function renderizarGrid() {
      const grid = document.getElementById('cardenetaGrid');
      const filtroStatus = document.getElementById('selectFiltroStatus').value;

      if (figurinhasDoAlbum.length === 0) {
        grid.innerHTML = '<div class="empty-state">Este álbum ainda não possui figurinhas cadastradas.</div>';
        atualizarEstatisticas(0, 0);
        return;
      }

      let filtradas = figurinhasDoAlbum.filter(f => {
        const possui = minhasFigurinhasIds.has(f.id);
        if (filtroStatus === 'possui' && !possui) return false;
        if (filtroStatus === 'faltam' && possui) return false;
        return true;
      });

      atualizarEstatisticas(figurinhasDoAlbum.length, minhasFigurinhasIds.size);

      if (filtradas.length === 0) {
        grid.innerHTML = '<div class="empty-state">Nenhuma figurinha encontrada com este filtro.</div>';
        return;
      }

      grid.innerHTML = filtradas.map(f => {
        const possui = minhasFigurinhasIds.has(f.id);
        const classeCard = possui ? 'fig-card possui' : 'fig-card';
        const textoStatus = possui ? '✅ Já tenho' : '❌ Falta';
        const imgUrl = f.imagem || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg';

        return `
          <div class="${classeCard}" onclick="toggleFigurinha('${f.id}')">
            <div class="fig-img-wrap">
              <span class="fig-badge-status">${textoStatus}</span>
              <img src="${imgUrl}" alt="${f.nome || 'Figurinha'}">
            </div>
            <div class="fig-content">
              <div class="fig-numero"># ${f.numero || '-'}</div>
              <div class="fig-nome" title="${f.nome || ''}">${f.nome || 'Sem Nome'}</div>
            </div>
            <div class="fig-footer">${possui ? 'Possuo' : 'Falta'}</div>
          </div>
        `;
      }).join('');
    }

    async function toggleFigurinha(figurinhaId) {
      const jaTem = minhasFigurinhasIds.has(figurinhaId);

      if (jaTem) {
        // Remove do banco
        minhasFigurinhasIds.delete(figurinhaId);
        await _supabase
          .from('usuario_cardeneta')
          .delete()
          .eq('user_id', usuarioAtual.id)
          .eq('figurinha_id', figurinhaId);
      } else {
        // Adiciona no banco
        minhasFigurinhasIds.add(figurinhaId);
        await _supabase
          .from('usuario_cardeneta')
          .insert([{ user_id: usuarioAtual.id, figurinha_id: figurinhaId }]);
      }

      renderizarGrid();
    }

    function atualizarEstatisticas(total, possui) {
      const faltam = total - possui;
      const porcentagem = total > 0 ? ((possui / total) * 100).toFixed(1) : 0;

      document.getElementById('statTotal').innerText = total;
      document.getElementById('statPossui').innerText = possui;
      document.getElementById('statFaltam').innerText = faltam;
      document.getElementById('statPorcentagem').innerText = porcentagem + '%';
    }

    function copiarFaltantes() {
      if (!albumAtualId) return alert("Selecione um álbum primeiro.");
      
      const faltantes = figurinhasDoAlbum
        .filter(f => !minhasFigurinhasIds.has(f.id))
        .map(f => f.numero)
        .join(', ');

      if (!faltantes) return alert("Parabéns! Você concluiu este álbum!");

      const texto = `⚽ Olá! Estas são as figurinhas que **faltam** na minha caderneta:\n\n${faltantes}\n\nAlguém tem para troca ou venda?`;
      
      navigator.clipboard.writeText(texto).then(() => {
        alert("Lista de faltantes copiada para a área de transferência! Cole no WhatsApp.");
      });
    }

    initCardeneta();
  </script>
</body>
</html>
