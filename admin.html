<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Álbum Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body { background: var(--bg-gradient); min-height: 100vh; color: white; padding: 1rem; }
    header { max-width: 1000px; margin: 0 auto 1.5rem; }

    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
    .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-right: 15px; transition: color 0.2s; }
    .nav-links a:hover { color: var(--gold); }

    .user-profile-top { display: flex; align-items: center; gap: 0.75rem; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 0.4rem 0.8rem; border-radius: 30px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); background: #0f172a; }
    .user-greeting { font-size: 0.85rem; font-weight: 600; color: #f1f5f9; }
    .btn-logout { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.2s; }
    .btn-logout:hover { background: #ef4444; color: white; }

    h1 { font-size: 1.8rem; font-weight: 800; color: var(--gold); }
    p.subtitle { color: #94a3b8; font-size: 0.85rem; }
    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1.5rem; }
    .card h2 { font-size: 1.2rem; color: var(--gold); margin-bottom: 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 0.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .form-row .form-group { flex: 1; min-width: 200px; }
    label { display: block; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 0.3rem; font-weight: 600; }
    input, select { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: white; font-size: 0.9rem; outline: none; }
    input:focus, select:focus { border-color: var(--gold); }
    .btn-submit { background: var(--gold); color: #0f172a; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 800; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
    .btn-submit:hover { background: #d97706; }
    .msg-feedback { margin-top: 0.8rem; font-size: 0.85rem; padding: 0.6rem; border-radius: 6px; display: none; }
    .msg-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #6ee7b7; }
    .msg-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
  </style>
</head>
<body>

  <header>
    <div class="top-nav">
      <div class="nav-links">
        <a href="index.html">🏠 Home</a>
        <a href="perfil.html">👤 Meu Perfil</a>
        <a href="vitrine.html">📦 Minha Vitrine</a>
        <a href="admin.html" style="color: var(--gold);">⚙️ Painel Admin</a>
        <a href="estoque.html">📊 Estoque</a>
      </div>
      
      <div class="user-profile-top">
        <img id="userAvatar" src="https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg" alt="Avatar" class="user-avatar" onerror="this.src='https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'">
        <span class="user-greeting" id="userGreeting">Olá...</span>
        <button class="btn-logout" onclick="fazerLogout()">Sair 🚪</button>
      </div>
    </div>

    <h1>⚙️ Painel de Administração</h1>
    <p class="subtitle">Gerencie álbuns, tipos, vendedores e adicione figurinhas</p>
  </header>

  <div class="container">
    <!-- CARD: Cadastrar Tipo -->
    <div class="card">
      <h2>🏷️ Cadastrar Tipo / Categoria</h2>
      <div class="form-group">
        <label>Nome do Tipo</label>
        <input type="text" id="inputNomeTipo" placeholder="Ex: Rara, Lendária, Comum">
      </div>
      <button class="btn-submit" onclick="cadastrarTipo()">Salvar Tipo</button>
      <div id="msgTipo" class="msg-feedback"></div>
    </div>

    <!-- CARD: Cadastrar Figurinha -->
    <div class="card">
      <h2>🃏 Cadastrar Figurinha / Card</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Álbum</label>
          <select id="selectAlbumFigurinha">
            <option value="">Selecione o álbum...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tipo</label>
          <select id="selectTipoFigurinha">
            <option value="">Selecione o tipo...</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Número</label>
          <input type="text" id="inputNumeroFigurinha" placeholder="Ex: 001">
        </div>
        <div class="form-group">
          <label>Nome da Figurinha</label>
          <input type="text" id="inputNomeFigurinha" placeholder="Ex: Jogador Famoso">
        </div>
      </div>
      <div class="form-group">
        <label>Link da Imagem</label>
        <input type="text" id="inputImagemFigurinha" placeholder="https://exemplo.com/imagem.jpg">
      </div>
      <button class="btn-submit" onclick="cadastrarFigurinha()">Cadastrar Figurinha</button>
      <div id="msgFigurinha" class="msg-feedback"></div>
    </div>

    <!-- CARD: Liberar Vendedor -->
    <div class="card">
      <h2>👥 Liberar / Gerenciar Vendedor</h2>
      <div class="form-row">
        <div class="form-group">
          <label>E-mail do Vendedor</label>
          <input type="email" id="inputEmailVendedor" placeholder="vendedor@email.com">
        </div>
        <div class="form-group">
          <label>Nome do Vendedor</label>
          <input type="text" id="inputNomeVendedor" placeholder="Nome Completo">
        </div>
      </div>
      <div class="form-group">
        <label>Função / Permissão</label>
        <select id="selectFuncaoVendedor">
          <option value="vendedor">Vendedor</option>
          <option value="admin">Administrador</option>
          <option value="master">Master</option>
        </select>
      </div>
      <button class="btn-submit" onclick="liberarVendedor()">Autorizar / Salvar Vendedor</button>
      <div id="msgVendedor" class="msg-feedback"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function verificarAdminMaster() {
      try {
        const { data: { session } } = await _supabase.auth.getSession();
        
        if (!session) {
          window.location.replace("login.html");
          return false;
        }

        const emailUser = session.user.email;

        const { data: autorizado, error } = await _supabase
          .from('vendedores_autorizados')
          .select('*')
          .eq('email', emailUser)
          .maybeSingle();

        if (error) {
          console.error("Erro ao verificar permissão:", error);
        }

        const isAdminOuMaster = autorizado && (
          autorizado.is_admin === true || 
          autorizado.funcao === 'admin' || 
          autorizado.funcao === 'master'
        );

        if (!isAdminOuMaster) {
          alert("Acesso restrito a administradores.");
          window.location.replace("perfil.html");
          return false;
        }

        const nomeExibicao = (autorizado && autorizado.nome) ? autorizado.nome : emailUser.split('@')[0];
        document.getElementById('userGreeting').innerText = `Olá, ${nomeExibicao}`;
        
        if (autorizado && autorizado.avatar) {
          document.getElementById('userAvatar').src = autorizado.avatar;
        }

        return true;
      } catch (err) {
        console.error("Erro crítico na autenticação:", err);
        window.location.replace("login.html");
        return false;
      }
    }

    async function fazerLogout() {
      await _supabase.auth.signOut();
      localStorage.clear();
      sessionStorage.clear();
      window.location.replace("login.html");
    }

    // Funções de carregamento para selects
    async function carregarAlbuns() {
      const { data } = await _supabase.from('albuns').select('*');
      const select = document.getElementById('selectAlbumFigurinha');
      if (!select) return;
      select.innerHTML = '<option value="">Selecione o álbum...</option>';
      if (data) {
        data.forEach(album => {
          select.innerHTML += `<option value="${album.id}">${album.nome}</option>`;
        });
      }
    }

    async function carregarTipos() {
      const { data } = await _supabase.from('tipos').select('*');
      const select = document.getElementById('selectTipoFigurinha');
      if (!select) return;
      select.innerHTML = '<option value="">Selecione o tipo...</option>';
      if (data) {
        data.forEach(tipo => {
          select.innerHTML += `<option value="${tipo.id}">${tipo.nome}</option>`;
        });
      }
    }

    // Funções de cadastro
    async function cadastrarTipo() {
      const nome = document.getElementById('inputNomeTipo').value.trim();
      const msg = document.getElementById('msgTipo');
      if (!nome) {
        msg.className = "msg-feedback msg-error";
        msg.innerText = "Preencha o nome do tipo.";
        msg.style.display = "block";
        return;
      }
      const { error } = await _supabase.from('tipos').insert([{ nome }]);
      if (error) {
        msg.className = "msg-feedback msg-error";
        msg.innerText = "Erro: " + error.message;
      } else {
        msg.className = "msg-feedback msg-success";
        msg.innerText = "Tipo cadastrado com sucesso!";
        document.getElementById('inputNomeTipo').value = '';
        carregarTipos();
      }
      msg.style.display = "block";
    }

    async function cadastrarFigurinha() {
      const album_id = document.getElementById('selectAlbumFigurinha').value;
      const tipo_id = document.getElementById('selectTipoFigurinha').value;
      const numero = document.getElementById('inputNumeroFigurinha').value.trim();
      const nome = document.getElementById('inputNomeFigurinha').value.trim();
      const imagem = document.getElementById('inputImagemFigurinha').value.trim();
      const msg = document.getElementById('msgFigurinha');

      if (!album_id || !tipo_id || !numero || !nome) {
        msg.className = "msg-feedback msg-error";
        msg.innerText = "Preencha os campos obrigatórios.";
        msg.style.display = "block";
        return;
      }

      const { error } = await _supabase.from('figurinhas').insert([{ album_id, tipo_id, numero, nome, imagem }]);
      if (error) {
        msg.className = "msg-feedback msg-error";
        msg.innerText = "Erro: " + error.message;
      } else {
        msg.className = "msg-feedback msg-success";
        msg.innerText = "Figurinha cadastrada com sucesso!";
        document.getElementById('inputNumeroFigurinha').value = '';
        document.getElementById('inputNomeFigurinha').value = '';
        document.getElementById('inputImagemFigurinha').value = '';
      }
      msg.style.display = "block";
    }

    async function liberarVendedor() {
      const email = document.getElementById('inputEmailVendedor').value.trim();
      const nome = document.getElementById('inputNomeVendedor').value.trim();
      const funcao = document.getElementById('selectFuncaoVendedor').value;
      const msg = document.getElementById('msgVendedor');

      if (!email) {
        msg.className = "msg-feedback msg-error";
        msg.innerText = "Informe o e-mail do vendedor.";
        msg.style.display = "block";
        return;
      }

      const is_admin = (funcao === 'admin' || funcao === 'master');

      const { error } = await _supabase.from('vendedores_autorizados').upsert([
        { email, nome, funcao, is_admin }
      ], { onConflict: 'email' });

      if (error) {
        msg.className = "msg-feedback msg-error";
        msg.innerText = "Erro: " + error.message;
      } else {
        msg.className = "msg-feedback msg-success";
        msg.innerText = "Vendedor autorizado/atualizado com sucesso!";
        document.getElementById('inputEmailVendedor').value = '';
        document.getElementById('inputNomeVendedor').value = '';
      }
      msg.style.display = "block";
    }

    async function inicializarAdmin() {
      const autorizado = await verificarAdminMaster();
      if (!autorizado) return;

      carregarAlbuns();
      carregarTipos();
    }

    inicializarAdmin();
  </script>
</body>
</html>
