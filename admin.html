<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 1rem; padding: 0 1rem;">
      <div>
        <a href="admin.html" style="color: #cbd5e1; text-decoration: none; margin-right: 15px; font-size: 0.85rem; font-weight: 600;">⚙️ Cadastrar</a>
        <a href="estoque.html" style="color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 600;">📦 Estoque</a>
      </div>
      <button onclick="fazerLogout()" style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600;">
        Sair 🚪
      </button>
    </div>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Álbum Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 2rem 1rem; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; }
    h1, h2 { text-align: center; color: #f59e0b; margin-bottom: 1.5rem; }
    
    .card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.4rem; font-weight: 600; }
    input, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.95rem;
    }
    input:focus, select:focus { outline: none; border-color: #f59e0b; }

    .btn-submit {
      width: 100%;
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }
    .btn-submit:hover { background: #d97706; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .alert { padding: 0.8rem; border-radius: 8px; font-size: 0.9rem; margin-top: 1rem; display: none; }
    .alert-success { background: #065f46; color: #34d399; }
    .alert-error { background: #991b1b; color: #fca5a5; }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚙️ Painel de Administração</h1>

    <!-- FORMULÁRIO DE CRIAR ÁLBUM -->
    <div class="card">
      <h2>1. Cadastrar Novo Álbum</h2>
      <form id="formAlbum" onsubmit="salvarAlbum(event)">
        <div class="form-group">
          <label for="nomeAlbum">Nome do Álbum (Ex: Copa 2026, Brasileirão):</label>
          <input type="text" id="nomeAlbum" required placeholder="Digite o nome do álbum...">
        </div>
        <button type="submit" class="btn-submit" id="btnAlbum">Cadastrar Álbum</button>
      </form>
    </div>

    <!-- FORMULÁRIO DE CADASTRAR FIGURINHA -->
    <div class="card">
      <h2>2. Cadastrar Nova Figurinha</h2>
      <form id="formFigurinha" onsubmit="salvarFigurinha(event)">
        
        <div class="form-group">
          <label for="selectAlbum">Selecione o Álbum:</label>
          <select id="selectAlbum" required>
            <option value="">Carregando álbuns...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="numero">Número da Figurinha:</label>
          <input type="text" id="numero" required placeholder="Ex: 10 ou BRA10">
        </div>

        <div class="form-group">
          <label for="nome">Nome do Jogador / Figurinha:</label>
          <input type="text" id="nome" required placeholder="Ex: Neymar Jr.">
        </div>

        <div class="form-group">
          <label for="preco">Preço (€):</label>
          <input type="number" id="preco" step="0.01" min="0" required placeholder="Ex: 0.50">
        </div>

        <div class="form-group">
          <label for="estoque">Quantidade Inicial em Estoque:</label>
          <input type="number" id="estoque" min="0" value="1" required>
        </div>

        <div class="form-group">
          <label for="imagemFile">Foto da Figurinha:</label>
          <input type="file" id="imagemFile" accept="image/*" required>
        </div>

        <button type="submit" class="btn-submit" id="btnFigurinha">Cadastrar Figurinha</button>
      </form>
      <div id="msg" class="alert"></div>
    </div>
  </div>

  <script>
    // ⚠️ SUBSTITUA PELAS SUAS CHAVES DO SUPABASE
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function verificarAutenticacao() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        // Se NÃO estiver logado, manda para o login.html
        window.location.href = "login.html";
      }
    }

    // Executa a verificação assim que a página carrega
    verificarAutenticacao();
    async function carregarAlbuns() {
      const select = document.getElementById('selectAlbum');
      try {
        const { data: albuns, error } = await _supabase.from('albuns').select('*').order('nome');
        
        if (error) throw error;

        select.innerHTML = '<option value="">-- Selecione um Álbum --</option>';
        if (albuns && albuns.length > 0) {
          albuns.forEach(a => {
            select.innerHTML += `<option value="${a.id}">${a.nome}</option>`;
          });
        } else {
          select.innerHTML = '<option value="">Nenhum álbum cadastrado ainda</option>';
        }
      } catch (err) {
        console.error("Erro ao carregar álbuns:", err);
        select.innerHTML = `<option value="">Erro ao carregar (Verifique o Supabase)</option>`;
      }
    }

    async function salvarAlbum(e) {
      e.preventDefault();
      const btn = document.getElementById('btnAlbum');
      const nome = document.getElementById('nomeAlbum').value.trim();

      if (!nome) return;

      btn.innerText = "Salvando...";
      btn.disabled = true;

      try {
        const { error } = await _supabase.from('albuns').insert([{ nome: nome }]);
        if (error) throw error;

        mostrarMensagem("Álbum cadastrado com sucesso!", false);
        document.getElementById('formAlbum').reset();
        await carregarAlbuns();
      } catch (err) {
        mostrarMensagem("Erro ao cadastrar álbum: " + err.message, true);
      } finally {
        btn.innerText = "Cadastrar Álbum";
        btn.disabled = false;
      }
    }

    async function salvarFigurinha(e) {
      e.preventDefault();
      const btn = document.getElementById('btnFigurinha');
      
      const album_id = document.getElementById('selectAlbum').value;
      const numero = document.getElementById('numero').value.trim();
      const nome = document.getElementById('nome').value.trim();
      const preco = parseFloat(document.getElementById('preco').value);
      const estoque = parseInt(document.getElementById('estoque').value);
      const fileInput = document.getElementById('imagemFile');

      if (!album_id || !fileInput.files.length) {
        mostrarMensagem("Preencha todos os campos e escolha uma imagem!", true);
        return;
      }

      btn.innerText = "Enviando Imagem...";
      btn.disabled = true;

      try {
        // 1. Upload da imagem para o bucket 'figurinhas'
        const file = fileInput.files[0];
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

        const { error: uploadError } = await _supabase.storage.from('figurinhas').upload(fileName, file);
        if (uploadError) throw uploadError;

        // 2. Pegar URL pública da imagem
        const { data: urlData } = _supabase.storage.from('figurinhas').getPublicUrl(fileName);
        const imagemUrl = urlData.publicUrl;

        // 3. Inserir registro na tabela 'figurinhas'
        btn.innerText = "Cadastrando no banco...";
        const { error: dbError } = await _supabase.from('figurinhas').insert([{
          album_id: album_id,
          numero: numero,
          nome: nome,
          preco: preco,
          estoque: estoque,
          imagem: imagemUrl
        }]);

        if (dbError) throw dbError;

        mostrarMensagem("Figurinha cadastrada com sucesso!", false);
        document.getElementById('formFigurinha').reset();

      } catch (err) {
        mostrarMensagem("Erro ao cadastrar figurinha: " + err.message, true);
        console.error(err);
      } finally {
        btn.innerText = "Cadastrar Figurinha";
        btn.disabled = false;
      }
    }

    function mostrarMensagem(texto, ehErro) {
      const msg = document.getElementById('msg');
      msg.innerText = texto;
      msg.className = `alert ${ehErro ? 'alert-error' : 'alert-success'}`;
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 4000);
    }

    // Inicialização
    carregarAlbuns();
  </script>
</body>
</html>
