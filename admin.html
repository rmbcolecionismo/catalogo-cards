<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Álbum Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body { background: var(--bg-gradient); min-height: 100vh; color: white; padding: 1rem; }
    header { max-width: 1000px; margin: 0 auto 1.5rem; }

    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
    .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-right: 15px; transition: color 0.2s; }
    .nav-links a:hover { color: var(--gold); }

    .user-profile-top { display: flex; align-items: center; gap: 0.75rem; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 0.4rem 0.8rem; border-radius: 30px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); background: #0f172a; }
    .user-greeting { font-size: 0.85rem; font-weight: 600; color: #f1f5f9; }
    .btn-logout { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.2s; }
    .btn-logout:hover { background: #ef4444; color: white; }

    h1 { font-size: 1.8rem; font-weight: 800; color: var(--gold); }
    p.subtitle { color: #94a3b8; font-size: 0.85rem; }
    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1.5rem; }
    .card h2 { font-size: 1.2rem; color: var(--gold); margin-bottom: 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 0.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .form-row .form-group { flex: 1; min-width: 200px; }
    label { display: block; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 0.3rem; font-weight: 600; }
    input, select { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: white; font-size: 0.9rem; outline: none; }
    input:focus, select:focus { border-color: var(--gold); }
    .btn-submit { background: var(--gold); color: #0f172a; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 800; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
    .btn-submit:hover { background: #d97706; }
    .msg-feedback { margin-top: 0.8rem; font-size: 0.85rem; padding: 0.6rem; border-radius: 6px; display: none; }
    .msg-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #6ee7b7; }
    .msg-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
  </style>
</head>
<body>

  <header>
    <div class="top-nav">
      <div class="nav-links">
        <a href="index.html">🏠 Home</a>
        <a href="perfil.html">👤 Meu Perfil</a>
        <a href="vitrine.html">📦 Minha Vitrine</a>
        <a href="admin.html" style="color: var(--gold);">⚙️ Painel Admin</a>
        <a href="estoque.html">📊 Estoque</a>
      </div>
      
      <div class="user-profile-top">
        <img id="userAvatar" src="https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg" alt="Avatar" class="user-avatar" onerror="this.src='https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'">
        <span class="user-greeting" id="userGreeting">Olá...</span>
        <button class="btn-logout" onclick="fazerLogout()">Sair 🚪</button>
      </div>
    </div>

    <h1>⚙️ Painel de Administração</h1>
    <p class="subtitle">Gerencie álbuns, tipos, vendedores e adicione figurinhas</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>📁 Gerenciamento Geral</h2>
      <p style="color: #cbd5e1; font-size: 0.9rem;">Insira aqui os formulários de cadastro do seu painel administrativo.</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function verificarAdminMaster() {
      try {
        const { data: { session } } = await _supabase.auth.getSession();
        
        if (!session) {
          window.location.replace("login.html");
          return false;
        }

        const { data: autorizado, error } = await _supabase
          .from('vendedores_autorizados')
          .select('*')
          .eq('email', session.user.email)
          .maybeSingle();

        if (error || !autorizado) {
          alert("Acesso restrito.");
          window.location.replace("perfil.html");
          return false;
        }

        // Valida se o usuário tem permissão de admin ou master
        if (autorizado.funcao !== 'admin' && autorizado.funcao !== 'master') {
          alert("Acesso restrito a administradores.");
          window.location.replace("perfil.html");
          return false;
        }

        const nomeExibicao = autorizado.nome || session.user.email.split('@')[0];
        document.getElementById('userGreeting').innerText = `Olá, ${nomeExibicao}`;
        
        if (autorizado.avatar) {
          document.getElementById('userAvatar').src = autorizado.avatar;
        }

        return true;
      } catch (err) {
        console.error("Erro crítico na autenticação:", err);
        window.location.replace("login.html");
        return false;
      }
    }

    async function fazerLogout() {
      await _supabase.auth.signOut();
      localStorage.clear();
      sessionStorage.clear();
      window.location.replace("login.html");
    }

    function carregarVendedores() { /* sua lógica antiga */ }
    function carregarAlbuns() { /* sua lógica antiga */ }
    function carregarTipos() { /* sua lógica antiga */ }

    async function inicializarAdmin() {
      const autorizado = await verificarAdminMaster();
      if (!autorizado) return;

      if (typeof carregarVendedores === 'function') carregarVendedores();
      if (typeof carregarAlbuns === 'function') carregarAlbuns();
      if (typeof carregarTipos === 'function') carregarTipos();
    }

    inicializarAdmin();
  </script>
</body>
</html>
