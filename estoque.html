<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Estoque</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { font-family: sans-serif; max-width: 1050px; margin: 2rem auto; padding: 0 1rem; background: #f8fafc; color: #1e293b; }
    h1 { margin-bottom: 1.5rem; text-align: center; color: #0f172a; font-weight: 800; }
    
    .search-bar { width: 100%; padding: 0.85rem 1rem; margin-bottom: 1.5rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .search-bar:focus { outline: none; border-color: #2563eb; }

    table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    th, td { padding: 0.9rem 1rem; text-align: left; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    th { background: #0f172a; color: white; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .img-preview { width: 45px; height: 55px; object-fit: contain; border-radius: 6px; background: #f1f5f9; border: 1px solid #e2e8f0; }
    .qty-controls { display: flex; align-items: center; gap: 0.5rem; }
    .qty-input { width: 65px; padding: 0.45rem; text-align: center; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: bold; }
    
    .btn-action { background: #2563eb; color: white; border: none; padding: 0.45rem 0.8rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: background 0.2s; }
    .btn-action:hover { background: #1d4ed8; }
    
    .btn-img { background: #475569; margin-top: 4px; font-size: 0.72rem; padding: 0.3rem 0.5rem; display: block; width: 100%; text-align: center; }
    .btn-img:hover { background: #334155; }

    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: inline-block; }
    .status-ok { background: #dcfce7; color: #166534; }
    .status-zero { background: #fee2e2; color: #991b1b; }

    .file-input-hidden { display: none; }
  </style>
</head>
<body>

  <h1>Controle de Estoque & Imagens</h1>
  <input type="text" id="search" class="search-bar" placeholder="🔍 Filtrar por nome, número ou álbum..." oninput="filtrar()">

  <table>
    <thead>
      <tr>
        <th>Foto / Alterar</th>
        <th>Álbum / Nº</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Status</th>
        <th>Estoque</th>
      </tr>
    </thead>
    <tbody id="stock-list">
      <tr><td colspan="6" style="text-align: center; padding: 2rem;">Carregando estoque...</td></tr>
    </tbody>
  </table>

  <script>
    // ⚠️ SUBSTITUA PELAS SUAS CHAVES DO SUPABASE
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE
";
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let figurinhasGlobal = [];

    async function carregarEstoque() {
      const tbody = document.getElementById('stock-list');
      try {
        const { data, error } = await _supabase
          .from('figurinhas')
          .select('*, albuns(nome)')
          .order('id', { ascending: false });

        if (error) throw error;

        figurinhasGlobal = data || [];
        renderizarTabela(figurinhasGlobal);
      } catch (err) {
        console.error("Erro ao carregar estoque:", err);
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">Erro ao carregar dados: ${err.message}</td></tr>`;
      }
    }

    function renderizarTabela(lista) {
      const tbody = document.getElementById('stock-list');
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem;">Nenhuma figurinha cadastrada.</td></tr>';
        return;
      }

      lista.forEach(f => {
        const qtdEstoque = f.estoque !== null && f.estoque !== undefined ? f.estoque : 0;
        const statusClass = qtdEstoque > 0 ? 'status-ok' : 'status-zero';
        const statusTexto = qtdEstoque > 0 ? 'Disponível' : 'Esgotado';
        const nomeAlbum = f.albuns ? f.albuns.nome : 'Sem álbum';
        const precoFormatado = f.preco ? f.preco.toFixed(2).replace('.', ',') : '0,00';

        tbody.innerHTML += `
          <tr>
            <td style="width: 110px;">
              <img src="${f.imagem}" class="img-preview" id="img-preview-${f.id}" alt="Foto"><br>
              <!-- Input de arquivo escondido para cada linha -->
              <input type="file" id="file-${f.id}" class="file-input-hidden" accept="image/*" onchange="trocarImagem(${f.id})">
              <button class="btn-action btn-img" id="btn-img-${f.id}" onclick="document.getElementById('file-${f.id}').click()">
                📷 Trocar
              </button>
            </td>
            <td><small style="color:#64748b; font-weight:600;">${nomeAlbum}</small><br><strong>Nº ${f.numero}</strong></td>
            <td><strong>${f.nome}</strong></td>
            <td>€ ${precoFormatado}</td>
            <td><span class="status-badge ${statusClass}">${statusTexto}</span></td>
            <td>
              <div class="qty-controls">
                <input type="number" min="0" value="${qtdEstoque}" id="input-${f.id}" class="qty-input">
                <button class="btn-action" onclick="atualizarEstoque(${f.id})">Salvar</button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    function filtrar() {
      const termo = document.getElementById('search').value.toLowerCase();
      const resultado = figurinhasGlobal.filter(f => 
        (f.nome && f.nome.toLowerCase().includes(termo)) || 
        (f.numero && f.numero.toString().toLowerCase().includes(termo)) ||
        (f.albuns && f.albuns.nome.toLowerCase().includes(termo))
      );
      renderizarTabela(resultado);
    }

    // 🔄 FUNÇÃO PARA SUBSTITUIR A IMAGEM NO SUPABASE
    async function trocarImagem(id) {
      const fileInput = document.getElementById(`file-${id}`);
      const btnImg = document.getElementById(`btn-img-${id}`);

      if (!fileInput.files || fileInput.files.length === 0) return;

      const file = fileInput.files[0];
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

      btnImg.innerText = "Enviando...";
      btnImg.disabled = true;

      try {
        // 1. Upload do novo arquivo para o Storage 'figurinhas'
        const { error: uploadError } = await _supabase
          .storage
          .from('figurinhas')
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        // 2. Pegar a nova URL pública
        const { data: urlData } = _supabase
          .storage
          .from('figurinhas')
          .getPublicUrl(fileName);

        const novaImagemUrl = urlData.publicUrl;

        // 3. Atualizar a coluna 'imagem' da figurinha no banco de dados
        const { error: dbError } = await _supabase
          .from('figurinhas')
          .update({ imagem: novaImagemUrl })
          .eq('id', id);

        if (dbError) throw dbError;

        alert("Imagem substituída com sucesso!");
        carregarEstoque(); // Recarrega a tabela com a foto nova

      } catch (err) {
        alert("Erro ao substituir imagem: " + err.message);
        console.error(err);
      } finally {
        btnImg.innerText = "📷 Trocar";
        btnImg.disabled = false;
      }
    }

    // 💾 FUNÇÃO PARA SALVAR A QUANTIDADE DO ESTOQUE
    async function atualizarEstoque(id) {
      const input = document.getElementById(`input-${id}`);
      const novaQtd = parseInt(input.value);
      
      if (isNaN(novaQtd) || novaQtd < 0) {
        alert("Por favor, insira uma quantidade válida.");
        return;
      }

      try {
        const { error } = await _supabase
          .from('figurinhas')
          .update({ estoque: novaQtd })
          .eq('id', id);

        if (error) throw error;

        alert("Estoque atualizado!");
        carregarEstoque();
      } catch (err) {
        alert("Erro ao atualizar estoque: " + err.message);
        console.error(err);
      }
    }

    // Inicializar
    carregarEstoque();
  </script>
</body>
</html>
