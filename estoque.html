<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Estoque - Álbum Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: white;
      padding: 1rem;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 1.5rem;
    }

    /* BARRA SUPERIOR DE NAVEGAÇÃO E LOGOUT */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .top-nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      margin-right: 15px;
      transition: color 0.2s;
    }

    .top-nav a:hover {
      color: var(--gold);
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #ef4444;
      color: white;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--gold);
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* PAINEL DE CONTROLES E FILTROS */
    .controls-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .filter-group {
      flex: 1;
      min-width: 200px;
    }

    .filter-group label {
      display: block;
      font-size: 0.75rem;
      color: #cbd5e1;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #0f172a;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--gold);
    }

    /* TABELA DE ESTOQUE */
    .table-container {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background: rgba(15, 23, 42, 0.8);
      color: var(--gold);
      padding: 0.8rem 1rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    td {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      vertical-align: middle;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .img-preview {
      width: 40px;
      height: 50px;
      object-fit: contain;
      background: #0f172a;
      border-radius: 4px;
      padding: 2px;
    }

    /* CONTROLE DE QTD NO ESTOQUE */
    .stock-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .input-stock {
      width: 70px;
      text-align: center;
      padding: 0.5rem;
      font-weight: 700;
    }

    .btn-save-stock {
      background: #10b981;
      color: white;
      border: none;
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      transition: background 0.2s;
    }

    .btn-save-stock:hover {
      background: #059669;
    }

    .badge-out {
      background: #ef4444;
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .badge-ok {
      background: #10b981;
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <!-- NAVEGAÇÃO SUPERIOR -->
    <div class="top-nav">
      <div>
        <a href="index.html">🏠 Home</a>
        <a href="admin.html">⚙️ Cadastrar</a>
        <a href="estoque.html" style="color: var(--gold);">📦 Estoque</a>
      </div>
      <button class="btn-logout" onclick="fazerLogout()">Sair 🚪</button>
    </div>

    <h1>📦 Controle de Estoque</h1>
    <p class="subtitle">Ajuste rapidamente as quantidades disponíveis de cada figurinha</p>
  </header>

  <div class="container">
    
    <!-- CONTROLES DE FILTRO -->
    <div class="controls-panel">
      <!-- FILTRO POR ÁLBUM -->
      <div class="filter-group">
        <label for="filterAlbum">Filtrar por Álbum:</label>
        <select id="filterAlbum" onchange="filtrar()">
          <option value="todos">Todos os Álbuns</option>
        </select>
      </div>

      <!-- BUSCA POR TEXTO/NÚMERO -->
      <div class="filter-group">
        <label for="search">Buscar Figurinha:</label>
        <input type="text" id="search" placeholder="🔍 Digite o número ou nome..." oninput="filtrar()">
      </div>
    </div>

    <!-- TABELA DE ESTOQUE -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Foto</th>
            <th>Nº</th>
            <th>Nome</th>
            <th>Álbum</th>
            <th>Preço</th>
            <th>Status</th>
            <th>Qtd. Estoque</th>
          </tr>
        </thead>
        <tbody id="stockTableBody">
          <tr>
            <td colspan="7" style="text-align: center; color: #94a3b8; padding: 2rem;">Carregando dados...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // ⚠️ SUBSTITUA PELAS SUAS CHAVES DO SUPABASE
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let figurinhasGlobal = [];
    let mapaAlbuns = {};

    // 🔐 VERIFICAÇÃO DE AUTENTICAÇÃO
    async function verificarAutenticacao() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
      }
    }
    verificarAutenticacao();

    async function fazerLogout() {
      await _supabase.auth.signOut();
      window.location.href = "login.html";
    }

    // CARREGAR DADOS DE ÁLBUNS E FIGURINHAS
    async function init() {
      try {
        // 1. Carrega os Álbuns para montar o select do filtro
        const { data: albuns } = await _supabase.from('albuns').select('*').order('nome');
        const selectAlbum = document.getElementById('filterAlbum');

        if (albuns && albuns.length > 0) {
          albuns.forEach(a => {
            mapaAlbuns[a.id] = a.nome;
            selectAlbum.innerHTML += `<option value="${a.id}">${a.nome}</option>`;
          });
        }

        // 2. Carrega as Figurinhas
        const { data: figurinhas, error } = await _supabase
          .from('figurinhas')
          .select('*')
          .order('numero', { ascending: true });

        if (error) throw error;

        figurinhasGlobal = figurinhas || [];
        renderizarTabela(figurinhasGlobal);

      } catch (err) {
        console.error("Erro ao carregar estoque:", err);
        document.getElementById('stockTableBody').innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; color: #ef4444; padding: 2rem;">
              Erro ao carregar dados: ${err.message || 'Verifique a conexão'}
            </td>
          </tr>
        `;
      }
    }

    // RENDERIZAR TABELA
    function renderizarTabela(lista) {
      const tbody = document.getElementById('stockTableBody');
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; color: #94a3b8; padding: 2rem;">
              Nenhuma figurinha encontrada.
            </td>
          </tr>
        `;
        return;
      }

      lista.forEach(f => {
        const nomeAlbum = mapaAlbuns[f.album_id] || 'Coleção';
        const precoFormatado = f.preco ? f.preco.toFixed(2).replace('.', ',') : '0,00';
        const qtdEstoque = f.estoque ?? 0;
        const statusBadge = qtdEstoque > 0 
          ? `<span class="badge-ok">Disponível</span>` 
          : `<span class="badge-out">Esgotado</span>`;

        tbody.innerHTML += `
          <tr>
            <td><img src="${f.imagem}" class="img-preview" alt="${f.nome}"></td>
            <td><strong>Nº ${f.numero}</strong></td>
            <td>${f.nome}</td>
            <td style="color: #94a3b8; font-size: 0.85rem;">${nomeAlbum}</td>
            <td>€ ${precoFormatado}</td>
            <td>${statusBadge}</td>
            <td>
              <div class="stock-control">
                <input type="number" class="input-stock" id="input-stock-${f.id}" value="${qtdEstoque}" min="0">
                <button class="btn-save-stock" onclick="salvarEstoque(${f.id})">Salvar</button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    // FUNÇÃO DE FILTRAGEM (POR ÁLBUM E POR TEXTO/NÚMERO)
    function filtrar() {
      const albumId = document.getElementById('filterAlbum').value;
      const busca = document.getElementById('search').value.toLowerCase();

      const resultado = figurinhasGlobal.filter(f => {
        const bateAlbum = albumId === 'todos' || f.album_id == albumId;
        const bateTexto = (f.nome && f.nome.toLowerCase().includes(busca)) ||
                          (f.numero && f.numero.toString().toLowerCase().includes(busca));

        return bateAlbum && bateTexto;
      });

      renderizarTabela(resultado);
    }

    // SALVAR ALTERAÇÃO DE ESTOQUE NO SUPABASE
    async function salvarEstoque(id) {
      const input = document.getElementById(`input-stock-${id}`);
      const novaQtd = parseInt(input.value);

      if (isNaN(novaQtd) || novaQtd < 0) {
        alert("Por favor, digite um número válido para o estoque.");
        return;
      }

      try {
        const { error } = await _supabase
          .from('figurinhas')
          .update({ estoque: novaQtd })
          .eq('id', id);

        if (error) throw error;

        // Atualiza a lista local em memória
        const item = figurinhasGlobal.find(f => f.id === id);
        if (item) item.estoque = novaQtd;

        // Re-renderiza para atualizar os status (Disponível / Esgotado)
        filtrar();

      } catch (err) {
        alert("Erro ao atualizar o estoque: " + err.message);
      }
    }

    init();
  </script>
</body>
</html>
