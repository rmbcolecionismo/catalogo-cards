<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Estoque - Álbum Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #f59e0b; --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); min-height: 100vh; color: white; padding: 1rem; }
    header { max-width: 1300px; margin: 0 auto 1.5rem; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
    .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-right: 15px; }
    .top-nav a:hover { color: var(--gold); }
    .user-profile-top { display: flex; align-items: center; gap: 0.75rem; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 0.4rem 0.8rem; border-radius: 30px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
    .btn-logout { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    h1 { font-size: 1.8rem; color: var(--gold); }
    .controls-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    .filter-group { flex: 1; min-width: 200px; }
    input, select { width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: white; }
    .table-container { background: rgba(30, 41, 59, 0.7); border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: rgba(15, 23, 42, 0.8); color: var(--gold); padding: 0.8rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    td { padding: 0.6rem 0.8rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .img-preview { width: 45px; height: 55px; object-fit: contain; background: #0f172a; }
    .btn-save-row { background: #10b981; color: white; border: none; padding: 0.5rem 0.8rem; border-radius: 6px; cursor: pointer; }
    .load-more-container { text-align: center; margin-top: 1.5rem; }
    .btn-load-more { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--gold); color: var(--gold); padding: 0.75rem 2rem; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="top-nav">
      <div class="nav-links">
        <a href="index.html">🏠 Home</a>
        <a href="admin.html" id="linkAdmin" style="display: none;">⚙️ Cadastrar</a>
        <a href="estoque.html" style="color: var(--gold);">📦 Estoque</a>
      </div>
      <div class="user-profile-top">
        <img id="userAvatar" src="https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg" class="user-avatar">
        <span id="userGreeting">Olá, Carregando...</span>
        <button class="btn-logout" onclick="fazerLogout()">Sair 🚪</button>
      </div>
    </div>
    <h1>📦 Gerenciador de Estoque</h1>
  </header>

  <div class="container">
    <div class="controls-panel">
      <div class="filter-group">
        <label>Filtrar por Álbum:</label>
        <select id="filterAlbum" onchange="aplicarFiltros()">
          <option value="todos">Todos os Álbuns</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Buscar Figurinha:</label>
        <input type="text" id="search" placeholder="🔍 Ex: #10, Messi, Brasil...">
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr><th>Foto</th><th>Álbum</th><th>Nº</th><th>Nome</th><th>Seleção</th><th>Preço</th><th>Status</th><th>Qtd</th><th>Ações</th></tr>
        </thead>
        <tbody id="stockTableBody"></tbody>
      </table>
    </div>

    <div class="load-more-container" id="loadMoreContainer" style="display: none;">
      <button class="btn-load-more" onclick="carregarMaisFigurinhas()">Carregar mais 50 itens</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const ITENS_POR_PAGINA = 50;
    
    let figurinhasGlobal = [];
    let mapaAlbuns = {};
    let paginaAtual = 0;

    async function verificarAcesso() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
        return null;
      }

      // Verifica se é admin para mostrar link de cadastro
      const { data: perfil } = await _supabase
        .from('vendedores_autorizados')
        .select('nome, avatar, is_admin')
        .eq('email', session.user.email)
        .maybeSingle();

      if (perfil) {
        document.getElementById('userGreeting').innerText = `Olá, ${perfil.nome || session.user.email.split('@')[0]}`;
        if (perfil.avatar) document.getElementById('userAvatar').src = perfil.avatar;
        if (perfil.is_admin) document.getElementById('linkAdmin').style.display = 'inline';
      }
      return session;
    }

    async function aplicarFiltros() {
      paginaAtual = 0;
      figurinhasGlobal = [];
      const albumId = document.getElementById('filterAlbum').value;
      const termo = document.getElementById('search').value.trim().replace('#', '');

      let query = _supabase.from('figurinhas').select('*', { count: 'exact' }).order('numero', { ascending: true });
      if (albumId !== 'todos') query = query.eq('album_id', albumId);
      if (termo !== "") query = query.or(`numero.ilike.%${termo}%,nome.ilike.%${termo}%,selecao_escuderia.ilike.%${termo}%`);

      const { data } = await query.range(0, ITENS_POR_PAGINA - 1);
      figurinhasGlobal = data || [];
      renderizarTabela(figurinhasGlobal);
      document.getElementById('loadMoreContainer').style.display = (data && data.length >= ITENS_POR_PAGINA) ? 'block' : 'none';
    }

    let timeoutBusca;
    document.getElementById('search').addEventListener('input', () => {
      clearTimeout(timeoutBusca);
      timeoutBusca = setTimeout(aplicarFiltros, 500);
    });

    async function carregarMaisFigurinhas() {
      paginaAtual++;
      const inicio = paginaAtual * ITENS_POR_PAGINA;
      const albumId = document.getElementById('filterAlbum').value;
      const termo = document.getElementById('search').value.trim().replace('#', '');

      let query = _supabase.from('figurinhas').select('*').order('numero', { ascending: true });
      if (albumId !== 'todos') query = query.eq('album_id', albumId);
      if (termo !== "") query = query.or(`numero.ilike.%${termo}%,nome.ilike.%${termo}%,selecao_escuderia.ilike.%${termo}%`);

      const { data } = await query.range(inicio, inicio + ITENS_POR_PAGINA - 1);
      if (data) {
        figurinhasGlobal = figurinhasGlobal.concat(data);
        renderizarTabela(figurinhasGlobal);
        document.getElementById('loadMoreContainer').style.display = (data.length >= ITENS_POR_PAGINA) ? 'block' : 'none';
      }
    }

    function renderizarTabela(lista) {
      const tbody = document.getElementById('stockTableBody');
      tbody.innerHTML = lista.map(f => `<tr>
        <td><img src="${f.imagem || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'}" class="img-preview"></td>
        <td>${mapaAlbuns[f.album_id] || '-'}</td>
        <td><input type="text" value="${f.numero || ''}" style="width:50px"></td>
        <td><input type="text" value="${f.nome || ''}"></td>
        <td><input type="text" value="${f.selecao_escuderia || ''}"></td>
        <td><input type="number" value="${f.preco ?? 0}" style="width:60px"></td>
        <td>${(f.estoque ?? 0) > 0 ? '<span style="color:#10b981">Disponível</span>' : '<span style="color:#ef4444">Esgotado</span>'}</td>
        <td><input type="number" value="${f.estoque ?? 0}" style="width:50px"></td>
        <td><button class="btn-save-row" onclick="salvar(${f.id})">Salvar</button></td>
      </tr>`).join('');
    }

    async function init() {
      const session = await verificarAcesso();
      if (!session) return;
      
      const { data: albuns } = await _supabase.from('albuns').select('*');
      albuns?.forEach(a => { 
        mapaAlbuns[a.id] = a.nome; 
        document.getElementById('filterAlbum').innerHTML += `<option value="${a.id}">${a.nome}</option>`; 
      });
      aplicarFiltros();
    }

    async function fazerLogout() { await _supabase.auth.signOut(); window.location.href = "login.html"; }
    init();
  </script>
</body>
</html>
