<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Estoque - Álbum Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: white;
      padding: 1rem;
    }

    header {
      max-width: 1300px;
      margin: 0 auto 1.5rem;
    }

    /* BARRA SUPERIOR DE NAVEGAÇÃO E LOGOUT */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .top-nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      margin-right: 15px;
      transition: color 0.2s;
    }

    .top-nav a:hover {
      color: var(--gold);
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #ef4444;
      color: white;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--gold);
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    /* PAINEL DE CONTROLES E FILTROS */
    .controls-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .filter-group {
      flex: 1;
      min-width: 200px;
    }

    .filter-group label {
      display: block;
      font-size: 0.75rem;
      color: #cbd5e1;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 0.65rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #0f172a;
      color: white;
      font-size: 0.85rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--gold);
    }

    /* TABELA DE ESTOQUE */
    .table-container {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th {
      background: rgba(15, 23, 42, 0.8);
      color: var(--gold);
      padding: 0.8rem 0.8rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
    }

    td {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      vertical-align: middle;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    /* ALTERAÇÃO: FOTO EM CIMA E BOTÃO EMBAIXO */
    .img-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .img-preview {
      width: 45px;
      height: 55px;
      object-fit: contain;
      background: #0f172a;
      border-radius: 4px;
      padding: 2px;
    }

    .btn-upload-label {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 0.25rem 0.4rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.68rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
      text-align: center;
      width: 100%;
    }

    .btn-upload-label:hover {
      background: var(--gold);
      color: #0f172a;
    }

    /* INPUTS EDITÁVEIS DENTRO DA TABELA */
    .input-edit-num {
      width: 80px;
      text-align: center;
      font-weight: 700;
    }

    .input-edit-nome {
      width: 100%;
      min-width: 130px;
    }

    .input-edit-team {
      width: 100%;
      min-width: 110px;
    }

    .select-edit-tipo {
      min-width: 120px;
      font-size: 0.8rem;
    }

    .input-edit-preco {
      width: 80px;
      text-align: right;
    }

    .input-edit-stock {
      width: 70px;
      text-align: center;
      font-weight: 700;
    }

    .actions-cell {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }

    .btn-save-row {
      background: #10b981;
      color: white;
      border: none;
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn-save-row:hover {
      background: #059669;
    }

    .btn-delete-row {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 0.5rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-delete-row:hover {
      background: #ef4444;
      color: white;
    }

    .badge-out {
      background: #ef4444;
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .badge-ok {
      background: #10b981;
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-nav">
      <div>
        <a href="index.html">🏠 Home</a>
        <a href="admin.html">⚙️ Cadastrar</a>
        <a href="estoque.html" style="color: var(--gold);">📦 Estoque</a>
      </div>
      <button class="btn-logout" onclick="fazerLogout()">Sair 🚪</button>
    </div>

    <h1>📦 Gerenciador de Estoque & Edição</h1>
    <p class="subtitle">Ajuste o código, nome, seleção, tipo, imagem, preço e quantidade ou remova figurinhas</p>
  </header>

  <div class="container">
    
    <div class="controls-panel">
      <div class="filter-group">
        <label for="filterAlbum">Filtrar por Álbum:</label>
        <select id="filterAlbum" onchange="filtrar()">
          <option value="todos">Todos os Álbuns</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="search">Buscar Figurinha:</label>
        <input type="text" id="search" placeholder="🔍 Digite o número, nome, seleção..." oninput="filtrar()">
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Foto</th>
            <th>Álbum</th>
            <th>Nº / Código</th>
            <th>Nome do Jogador / Item</th>
            <th>Seleção / Escuderia</th>
            <th>Tipo</th>
            <th>Preço (€)</th>
            <th>Status</th>
            <th>Qtd. Estoque</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="stockTableBody">
          <tr>
            <td colspan="10" style="text-align: center; color: #94a3b8; padding: 2rem;">Carregando dados...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";
    const IMAGEM_PADRAO = "https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let figurinhasGlobal = [];
    let mapaAlbuns = {};
    let listaTiposGlobal = []; // Guarda os tipos vindos do Supabase
    let imagensNovasCarregadas = {};

    async function verificarAutenticacao() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
      }
    }
    verificarAutenticacao();

    async function fazerLogout() {
      await _supabase.auth.signOut();
      window.location.href = "login.html";
    }

    async function init() {
      try {
        // 1. Buscar Álbuns
        const { data: albuns } = await _supabase.from('albuns').select('*').order('nome');
        const selectAlbum = document.getElementById('filterAlbum');

        if (albuns && albuns.length > 0) {
          albuns.forEach(a => {
            mapaAlbuns[a.id] = a.nome;
            selectAlbum.innerHTML += `<option value="${a.id}">${a.nome}</option>`;
          });
        }

        // 2. Buscar Tipos da tabela 'tipos'
        const { data: tiposData, error: errorTipos } = await _supabase
          .from('tipos')
          .select('*')
          .order('nome', { ascending: true });

        if (!errorTipos && tiposData && tiposData.length > 0) {
          listaTiposGlobal = tiposData.map(t => typeof t === 'string' ? t : (t.nome || t.tipo || t.title));
        } else {
          // Fallback caso a tabela tipos esteja vazia ou indisponível
          listaTiposGlobal = ['Base', 'Brilhante', 'Holográfica', 'Especial', 'Lenda', 'Golden Baller'];
        }

        // 3. Buscar Figurinhas
        const { data: figurinhas, error } = await _supabase
          .from('figurinhas')
          .select('*')
          .order('numero', { ascending: true });

        if (error) throw error;

        figurinhasGlobal = figurinhas || [];
        renderizarTabela(figurinhasGlobal);

      } catch (err) {
        console.error("Erro ao carregar estoque:", err);
        document.getElementById('stockTableBody').innerHTML = `
          <tr>
            <td colspan="10" style="text-align: center; color: #ef4444; padding: 2rem;">
              Erro ao carregar dados: ${err.message || 'Verifique a conexão'}
            </td>
          </tr>
        `;
      }
    }

    function renderizarTabela(lista) {
      const tbody = document.getElementById('stockTableBody');
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="10" style="text-align: center; color: #94a3b8; padding: 2rem;">
              Nenhuma figurinha encontrada.
            </td>
          </tr>
        `;
        return;
      }

      lista.forEach(f => {
        const nomeAlbum = mapaAlbuns[f.album_id] || 'Coleção';
        const qtdEstoque = f.estoque ?? 0;
        const statusBadge = qtdEstoque > 0 
          ? `<span class="badge-ok">Disponível</span>` 
          : `<span class="badge-out">Esgotado</span>`;

        const imgUrl = f.imagem || IMAGEM_PADRAO;
        const selecaoVal = f.selecao_escuderia || f.team || '';
        const tipoVal = f.tipo || f.type || 'Base';

        // Garante que o tipo atual da figurinha apareça no select mesmo que não esteja cadastrado na tabela tipos
        let todosOsTipos = [...listaTiposGlobal];
        if (tipoVal && !todosOsTipos.includes(tipoVal)) {
          todosOsTipos.unshift(tipoVal);
        }

        // Monta as opções do select dinamicamente
        const optionsTipo = todosOsTipos.map(t => {
          const selected = String(t).toLowerCase() === String(tipoVal).toLowerCase() ? 'selected' : '';
          return `<option value="${t}" ${selected}>${t}</option>`;
        }).join('');

        tbody.innerHTML += `
          <tr>
            <td>
              <div class="img-cell">
                <img src="${imgUrl}" id="img-prev-${f.id}" class="img-preview" alt="${f.nome}" onerror="this.src='${IMAGEM_PADRAO}'">
                <label for="file-input-${f.id}" class="btn-upload-label">Trocar Foto</label>
                <input type="file" id="file-input-${f.id}" accept="image/*" style="display: none;" onchange="fazerUploadFoto(${f.id})">
              </div>
            </td>
            <td style="color: #94a3b8; font-size: 0.8rem; font-weight: 600;">${nomeAlbum}</td>
            <td>
              <input type="text" class="input-edit-num" id="input-num-${f.id}" value="${f.numero || ''}">
            </td>
            <td>
              <input type="text" class="input-edit-nome" id="input-nome-${f.id}" value="${f.nome || ''}">
            </td>
            <td>
              <input type="text" class="input-edit-team" id="input-team-${f.id}" value="${selecaoVal}" placeholder="Ex: Brasil">
            </td>
            <td>
              <select class="select-edit-tipo" id="select-tipo-${f.id}">
                ${optionsTipo}
              </select>
            </td>
            <td>
              <input type="number" step="0.01" class="input-edit-preco" id="input-preco-${f.id}" value="${f.preco ?? 0}">
            </td>
            <td>${statusBadge}</td>
            <td>
              <input type="number" class="input-edit-stock" id="input-stock-${f.id}" value="${qtdEstoque}" min="0">
            </td>
            <td>
              <div class="actions-cell">
                <button class="btn-save-row" id="btn-save-${f.id}" onclick="salvarAlteracoes(${f.id})">Salvar</button>
                <button class="btn-delete-row" title="Excluir Figurinha" onclick="excluirFigurinha(${f.id})">🗑️</button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    async function fazerUploadFoto(id) {
      const fileInput = document.getElementById(`file-input-${id}`);
      if (!fileInput.files || !fileInput.files[0]) return;

      const file = fileInput.files[0];
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

      const btnSave = document.getElementById(`btn-save-${id}`);
      const originalText = btnSave.innerText;
      btnSave.innerText = "Enviando...";
      btnSave.disabled = true;

      try {
        const { error: uploadError } = await _supabase.storage
          .from('figurinhas')
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data: urlData } = _supabase.storage
          .from('figurinhas')
          .getPublicUrl(fileName);

        const novaUrl = urlData.publicUrl;
        imagensNovasCarregadas[id] = novaUrl;

        document.getElementById(`img-prev-${id}`).src = novaUrl;

      } catch (err) {
        alert("Erro ao fazer upload da imagem: " + err.message);
      } finally {
        btnSave.innerText = originalText;
        btnSave.disabled = false;
      }
    }

    function filtrar() {
      const albumId = document.getElementById('filterAlbum').value;
      const busca = document.getElementById('search').value.toLowerCase();

      const resultado = figurinhasGlobal.filter(f => {
        const selecaoVal = (f.selecao_escuderia || f.team || '').toLowerCase();
        const bateAlbum = albumId === 'todos' || f.album_id == albumId;
        const bateTexto = (f.nome && f.nome.toLowerCase().includes(busca)) ||
                          (f.numero && f.numero.toString().toLowerCase().includes(busca)) ||
                          selecaoVal.includes(busca);

        return bateAlbum && bateTexto;
      });

      renderizarTabela(resultado);
    }

    // SALVAR ALTERAÇÕES (SISTEMA SEGURO ANTI-ERRO 400)
    async function salvarAlteracoes(id) {
      const item = figurinhasGlobal.find(f => f.id === id);
      if (!item) return;

      const inputNum = document.getElementById(`input-num-${id}`);
      const inputNome = document.getElementById(`input-nome-${id}`);
      const inputTeam = document.getElementById(`input-team-${id}`);
      const selectTipo = document.getElementById(`select-tipo-${id}`);
      const inputPreco = document.getElementById(`input-preco-${id}`);
      const inputStock = document.getElementById(`input-stock-${id}`);
      const btnSave = document.getElementById(`btn-save-${id}`);

      const novoNumero = inputNum.value.trim();
      const novoNome = inputNome.value.trim();
      const novaSelecao = inputTeam.value.trim();
      const novoTipo = selectTipo.value;
      const novoPreco = parseFloat(inputPreco.value);
      const novoEstoque = parseInt(inputStock.value);

      let novaImg = imagensNovasCarregadas[id] || item.imagem || IMAGEM_PADRAO;

      if (!novoNumero || !novoNome) {
        alert("O número/código e o nome da figurinha não podem ficar em branco.");
        return;
      }

      if (isNaN(novoPreco) || novoPreco < 0) {
        alert("Digite um preço válido.");
        return;
      }

      if (isNaN(novoEstoque) || novoEstoque < 0) {
        alert("Digite um estoque válido.");
        return;
      }

      btnSave.innerText = "Salvando...";
      btnSave.style.opacity = "0.7";

      // 1. Monta apenas os campos universais
      const payload = {
        imagem: novaImg,
        numero: novoNumero,
        nome: novoNome,
        preco: novoPreco,
        estoque: novoEstoque
      };

      // 2. Adiciona o campo de tipo correto dependendo da coluna existente
      if ('tipo' in item) {
        payload.tipo = novoTipo;
      } else if ('type' in item) {
        payload.type = novoTipo;
      }

      // 3. Adiciona o campo de equipe/seleção correto dependendo da coluna existente
      if ('selecao_escuderia' in item) {
        payload.selecao_escuderia = novaSelecao;
      } else if ('team' in item) {
        payload.team = novaSelecao;
      }

      try {
        const { error } = await _supabase
          .from('figurinhas')
          .update(payload)
          .eq('id', id);

        if (error) throw error;

        // Atualiza na memória local
        Object.assign(item, payload);
        delete imagensNovasCarregadas[id];

        btnSave.innerText = "Salvo! ✓";
        btnSave.style.background = "#25d366";

        setTimeout(() => {
          filtrar();
        }, 800);

      } catch (err) {
        console.error("Erro no Supabase:", err);
        alert("Erro ao salvar no banco de dados: " + (err.message || "Verifique as colunas do Supabase"));
        btnSave.innerText = "Salvar";
        btnSave.style.background = "#10b981";
        btnSave.style.opacity = "1";
      }
    }

    async function excluirFigurinha(id) {
      const item = figurinhasGlobal.find(f => f.id === id);
      const nomeItem = item ? item.nome : "esta figurinha";

      if (!confirm(`Tem certeza que deseja excluir "${nomeItem}" do sistema?`)) {
        return;
      }

      try {
        const { error } = await _supabase
          .from('figurinhas')
          .delete()
          .eq('id', id);

        if (error) throw error;

        figurinhasGlobal = figurinhasGlobal.filter(f => f.id !== id);
        filtrar();

      } catch (err) {
        alert("Erro ao excluir figurinha: " + err.message);
      }
    }

    init();
  </script>
</body>
</html>
