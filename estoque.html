<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Cadastro de Figurinhas - Painel Profissional</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { 
      --gold: #f59e0b; 
      --gold-dark: #d97706;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    
    body { background: var(--bg-gradient); min-height: 100vh; color: #f8fafc; padding: 1.5rem; }
    
    header { max-width: 1400px; margin: 0 auto 1.5rem; }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 1rem; background: rgba(15, 23, 42, 0.6); padding: 0.75rem 1.25rem; border-radius: 12px; border: 1px solid var(--border-color); backdrop-filter: blur(10px); }
    
    .nav-links { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
    .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: color 0.2s; }
    .nav-links a:hover { color: var(--gold); }
    
    .user-profile-top { display: flex; align-items: center; gap: 0.75rem; background: rgba(30, 41, 59, 0.9); border: 1px solid var(--border-color); padding: 0.4rem 1rem; border-radius: 30px; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
    .user-greeting { font-size: 0.85rem; font-weight: 600; color: #f1f5f9; }
    .btn-logout { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 0.35rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 600; transition: all 0.2s; }
    .btn-logout:hover { background: #ef4444; color: white; }

    h1 { font-size: 1.7rem; font-weight: 800; color: var(--gold); display: flex; align-items: center; gap: 0.5rem; }
    
    .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
    
    .controls-panel { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.25rem; display: flex; gap: 1.25rem; flex-wrap: wrap; align-items: center; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    .filter-group { flex: 1; min-width: 250px; }
    
    label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.4rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { width: 100%; padding: 0.7rem 0.9rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: #0f172a; color: white; outline: none; font-size: 0.85rem; transition: border-color 0.2s; }
    input:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.15); }

    .tabela-container { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 12px; overflow-x: auto; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    
    .tabela-estoque { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; min-width: 1050px; }
    .tabela-estoque th { background: rgba(15, 23, 42, 0.8); color: var(--gold); padding: 1rem; font-weight: 700; border-bottom: 2px solid var(--border-color); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
    .tabela-estoque td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    .tabela-estoque tr:hover { background: rgba(255, 255, 255, 0.02); }

    .item-foto-wrapper { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; width: 85px; margin: 0 auto; }
    .item-foto { width: 60px; height: 75px; object-fit: contain; background: #0f172a; border-radius: 6px; border: 1px solid var(--border-color); padding: 2px; }
    
    .input-tabela { padding: 0.45rem 0.6rem; font-size: 0.8rem; border-radius: 6px; }
    
    .btn-acao { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.4); color: #93c5fd; padding: 0.35rem 0.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.7rem; transition: all 0.2s; width: 100%; text-align: center; white-space: nowrap; display: block; }
    .btn-acao:hover { background: #3b82f6; color: white; border-color: #3b82f6; }

    .btn-excluir { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 0.45rem 0.75rem; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.3rem; white-space: nowrap; }
    .btn-excluir:hover { background: #ef4444; color: white; border-color: #ef4444; }

    .acoes-grupo { display: flex; gap: 0.4rem; align-items: center; justify-content: center; }
    .file-input-hidden { display: none; }

    .load-more-container { text-align: center; margin: 1.5rem 0 3rem 0; }
    .btn-load-more { background: rgba(245, 158, 11, 0.1); border: 1px solid var(--gold); color: var(--gold); padding: 0.75rem 2.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
    .btn-load-more:hover { background: var(--gold); color: #0f172a; }

    .vazio-mensagem { text-align: center; padding: 3rem; color: #94a3b8; font-size: 0.95rem; }
  </style>
</head>
<body>

  <header>
    <div class="top-nav">
      <div class="nav-links">
        <a href="index.html">🏠 Home</a>
        <a href="perfil.html">👤 Meu Perfil</a>
        <a href="vitrine.html">🛍️ Vitrine</a>
        <div id="adminLinks" style="display:inline; display:none;">
          <a href="admin.html">⚙️ Painel Admin</a>
          <a href="estoque.html" style="color: var(--gold);">📊 Estoque</a>
        </div>
      </div>
      <div class="user-profile-top">
        <img id="userAvatar" src="https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg" class="user-avatar" onerror="this.src='https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'">
        <span id="userGreeting" class="user-greeting">Carregando...</span>
        <button class="btn-logout" onclick="fazerLogout()">Sair 🚪</button>
      </div>
    </div>
    <h1>📊 Gerenciador de Cadastro de Figurinhas</h1>
  </header>

  <div class="container">
    <div class="controls-panel">
      <div class="filter-group">
        <label>Filtrar por Álbum:</label>
        <select id="filterAlbum" onchange="aplicarFiltros()">
          <option value="todos">Todos os Álbuns</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Buscar Figurinha:</label>
        <input type="text" id="search" placeholder="🔍 Ex: #001, 001, 1, Messi, Brasil...">
      </div>
    </div>

    <div class="tabela-container">
      <table class="tabela-estoque">
        <thead>
          <tr>
            <th style="width: 110px; text-align: center;">Foto</th>
            <th style="width: 250px;">Álbum</th>
            <th style="width: 110px;">Código</th>
            <th>Nome da Figurinha</th>
            <th style="width: 180px;">Seleção / Escuderia</th>
            <th style="width: 160px;">Tipo</th>
            <th style="width: 120px; text-align: center;">Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo">
          <tr><td colspan="7" class="vazio-mensagem">Carregando figurinhas...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="load-more-container" id="loadMoreContainer" style="display: none;">
      <button class="btn-load-more" onclick="carregarMaisFigurinhas()">Carregar mais 30 itens</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const ITENS_POR_PAGINA = 30;

    let usuarioLogado = null;
    let figurinhasGlobal = [];
    let mapaAlbuns = {};
    let listaAlbunsSelectOptions = '';
    let paginaAtual = 0;

    async function verificarAcesso() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) { window.location.href = "login.html"; return null; }

      const { data: perfil } = await _supabase
        .from('vendedores_autorizados')
        .select('*')
        .eq('email', session.user.email)
        .maybeSingle();

      if (!perfil) { window.location.href = "login.html"; return null; }

      usuarioLogado = perfil;
      document.getElementById('userGreeting').innerText = `Olá, ${perfil.nome || 'Vendedor'}`;
      if (perfil.avatar) document.getElementById('userAvatar').src = perfil.avatar;
      
      if (perfil.is_admin === true || perfil.funcao === 'admin' || perfil.funcao === 'master') {
        document.getElementById('adminLinks').style.display = 'inline';
      }
      return session;
    }

    async function carregarOpcoesAuxiliares() {
      const { data: albuns } = await _supabase.from('albuns').select('*').order('nome', { ascending: true });
      if (albuns) {
        const selectFiltro = document.getElementById('filterAlbum');
        albuns.forEach(a => { 
          mapaAlbuns[a.id] = a.nome; 
          selectFiltro.innerHTML += `<option value="${a.id}">${a.nome}</option>`; 
          listaAlbunsSelectOptions += `<option value="${a.id}">${a.nome}</option>`;
        });
      }
    }

    function executarConsultaSupabase(albumId, termo, inicio, fim) {
      let query = _supabase.from('figurinhas').select('*').order('id', { ascending: true });
      
      if (albumId !== 'todos') {
        query = query.eq('album_id', albumId);
      }

      if (termo !== "") {
        const t = termo.trim();
        const tSemHash = t.replace('#', '');
        
        // Verificamos se o termo digitado corresponde a um número puro ou com formato de texto no banco
        if (!isNaN(tSemHash) && tSemHash !== "") {
          const numInt = parseInt(tSemHash, 10);
          // Usamos string literal para garantir que o PostgREST processe o filtro corretamente
          query = query.or(`numero.eq.${numInt},numero.eq.${tSemHash},numero.eq.${t},nome.ilike.%${t}%`);
        } else {
          query = query.or(`nome.ilike.%${t}%,selecao_escuderia.ilike.%${t}%,tipo.ilike.%${t}%`);
        }
      }

      return query.range(inicio, fim);
    }

    async function aplicarFiltros() {
      paginaAtual = 0;
      figurinhasGlobal = [];
      const albumId = document.getElementById('filterAlbum').value;
      let termo = document.getElementById('search').value;
      
      const { data, error } = await executarConsultaSupabase(albumId, termo, 0, ITENS_POR_PAGINA - 1);
      
      if (error) {
        console.error("Erro ao buscar:", error);
        return;
      }

      figurinhasGlobal = data || [];
      renderizarTabela(figurinhasGlobal);
      document.getElementById('loadMoreContainer').style.display = (data && data.length >= ITENS_POR_PAGINA) ? 'block' : 'none';
    }

    let timeoutBusca;
    document.getElementById('search').addEventListener('input', () => {
      clearTimeout(timeoutBusca);
      timeoutBusca = setTimeout(aplicarFiltros, 300);
    });

    async function carregarMaisFigurinhas() {
      paginaAtual++;
      const inicio = paginaAtual * ITENS_POR_PAGINA;
      const fim = inicio + ITENS_POR_PAGINA - 1;
      const albumId = document.getElementById('filterAlbum').value;
      let termo = document.getElementById('search').value;

      const { data, error } = await executarConsultaSupabase(albumId, termo, inicio, fim);
      
      if (!error && data && data.length > 0) {
        figurinhasGlobal = figurinhasGlobal.concat(data);
        renderizarTabela(figurinhasGlobal);
        document.getElementById('loadMoreContainer').style.display = (data.length >= ITENS_POR_PAGINA) ? 'block' : 'none';
      } else {
        document.getElementById('loadMoreContainer').style.display = 'none';
      }
    }

    function renderizarTabela(lista) {
      const tbody = document.getElementById('tabelaCorpo');
      if (!lista || lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="vazio-mensagem">Nenhuma figurinha encontrada.</td></tr>`;
        return;
      }

      tbody.innerHTML = lista.map(f => {
        const imgUrl = f.imagem_url || f.imagem || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg';
        return `
          <tr id="row-${f.id}">
            <td style="text-align: center;">
              <div class="item-foto-wrapper">
                <img id="img-${f.id}" src="${imgUrl}" class="item-foto" onerror="this.src='https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'">
                <input type="file" id="file-${f.id}" class="file-input-hidden" accept="image/*" onchange="trocarFoto(${f.id}, this)">
                <button class="btn-acao" onclick="document.getElementById('file-${f.id}').click()">Trocar</button>
              </div>
            </td>
            <td>
              <select class="input-tabela" id="album-${f.id}" onchange="atualizarCampo(${f.id}, 'album_id', this.value)">
                <option value="">Selecione...</option>
                ${listaAlbunsSelectOptions.replace(`value="${f.album_id}"`, `value="${f.album_id}" selected`)}
              </select>
            </td>
            <td>
              <input type="text" class="input-tabela" id="numero-${f.id}" value="${f.numero || ''}" onchange="atualizarCampo(${f.id}, 'numero', this.value)">
            </td>
            <td>
              <input type="text" class="input-tabela" id="nome-${f.id}" value="${f.nome || ''}" onchange="atualizarCampo(${f.id}, 'nome', this.value)">
            </td>
            <td>
              <input type="text" class="input-tabela" id="selecao-${f.id}" value="${f.selecao_escuderia || ''}" onchange="atualizarCampo(${f.id}, 'selecao_escuderia', this.value)">
            </td>
            <td>
              <input type="text" class="input-tabela" id="tipo-${f.id}" value="${f.tipo || ''}" onchange="atualizarCampo(${f.id}, 'tipo', this.value)">
            </td>
            <td style="text-align: center;">
              <div class="acoes-grupo">
                <button class="btn-excluir" onclick="excluirFigurinha(${f.id}, '${imgUrl}')">🗑️ Excluir</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function atualizarCampo(id, campo, valor) {
      const valorFinal = (valor === "") ? null : valor;
      const { error } = await _supabase
        .from('figurinhas')
        .update({ [campo]: valorFinal })
        .eq('id', id);

      if (error) {
        alert("Erro ao atualizar: " + error.message);
      }
    }

    async function trocarFoto(id, input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      const fileName = `${Date.now()}_${file.name}`;

      const { error: uploadError } = await _supabase.storage
        .from('figurinhas')
        .upload(fileName, file);

      if (uploadError) {
        alert("Erro no upload da imagem: " + uploadError.message);
        return;
      }

      const { data: publicUrlData } = _supabase.storage.from('figurinhas').getPublicUrl(fileName);
      const novaUrl = publicUrlData.publicUrl;

      const { error: updateError } = await _supabase
        .from('figurinhas')
        .update({ imagem_url: novaUrl })
        .eq('id', id);

      if (updateError) {
        alert("Erro ao salvar nova URL da imagem: " + updateError.message);
      } else {
        document.getElementById(`img-${id}`).src = novaUrl;
        alert("Foto atualizada com sucesso!");
      }
    }

    async function excluirFigurinha(id, imagemUrl) {
      if (!confirm("Tem certeza que deseja excluir esta figurinha? Isto irá apagá-la permanentemente da base de dados, remover a imagem do storage e limpá-la de quaisquer vitrines de ofertas.")) {
        return;
      }

      await _supabase.from('vitrine_ofertas').delete().eq('figurinha_id', id);

      if (imagemUrl && imagemUrl.includes('/storage/v1/object/public/figurinhas/')) {
        const partes = imagemUrl.split('/figurinhas/');
        if (partes.length > 1) {
          const nomeArquivoStorage = partes[1];
          await _supabase.storage.from('figurinhas').remove([nomeArquivoStorage]);
        }
      }

      const { error } = await _supabase.from('figurinhas').delete().eq('id', id);

      if (error) {
        alert("Erro ao excluir figurinha: " + error.message);
      } else {
        const rowElement = document.getElementById(`row-${id}`);
        if (rowElement) rowElement.remove();
        alert("Figurinha excluída com sucesso!");
      }
    }

    async function init() {
      const session = await verificarAcesso();
      if (!session) return;
      
      await carregarOpcoesAuxiliares();
      aplicarFiltros();
    }

    function fazerLogout() { 
      _supabase.auth.signOut(); 
      window.location.href = "login.html"; 
    }
    
    init();
  </script>
</body>
</html>
