<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo - Álbum Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: white;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
    }

    .login-card h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }

    .login-card p {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 1.8rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 0.85rem;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #0f172a;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }

    .btn-login {
      width: 100%;
      background: var(--gold);
      color: #0f172a;
      border: none;
      padding: 0.85rem;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }

    .btn-login:hover { background: #d97706; }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 0.7rem;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>🔐 Acesso Restrito</h2>
    <p>Entre com suas credenciais para acessar o painel</p>

    <form id="loginForm" onsubmit="realizarLogin(event)">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="admin@seuemail.com">
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn-login" id="btnLogin">Entrar no Painel</button>
    </form>

    <div class="error-msg" id="errorMsg"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Se já estiver logado, valida o direcionamento automaticamente
    async function checarSessaoExistente() {
      try {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session && session.user) {
          await redirecionarConformePermissao(session.user.email);
        }
      } catch (err) {
        console.error("Erro ao checar sessão:", err);
      }
    }
    checarSessaoExistente();

    async function realizarLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errorMsg = document.getElementById('errorMsg');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('senha').value.trim();

      errorMsg.style.display = "none";
      btn.innerText = "Acessando...";
      btn.disabled = true;

      try {
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error) throw error;

        // Redireciona de acordo com o perfil
        await redirecionarConformePermissao(email);

      } catch (err) {
        errorMsg.innerText = "Falha no login: " + (err.message || "E-mail ou senha inválidos.");
        errorMsg.style.display = "block";
        btn.innerText = "Entrar no Painel";
        btn.disabled = false;
      }
    }

    async function redirecionarConformePermissao(email) {
      // Usamos .maybeSingle() em vez de .single() para evitar erros caso o e-mail não esteja na tabela
      const { data: autorizado, error } = await _supabase
        .from('vendedores_autorizados')
        .select('*')
        .eq('email', email)
        .maybeSingle();

      if (autorizado) {
        // Vendedor parceiro vai para o estoque gerenciar os preços dele
        window.location.href = "estoque.html";
      } else {
        // Administrador mestre vai para o admin central
        window.location.href = "admin.html";
      }
    }
  </script>
</body>
</html>
