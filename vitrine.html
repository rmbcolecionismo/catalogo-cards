<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Vitrine - Álbum Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #f59e0b; --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); min-height: 100vh; color: white; padding: 1rem; }
    header { max-width: 1300px; margin: 0 auto 1.5rem; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
    .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-right: 15px; }
    .top-nav a:hover { color: var(--gold); }
    .user-profile-top { display: flex; align-items: center; gap: 0.75rem; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 0.4rem 0.8rem; border-radius: 30px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
    .btn-logout { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    h1 { font-size: 1.8rem; color: var(--gold); }
    
    .container { max-width: 1300px; margin: 0 auto; }
    .controls-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    .filter-group { flex: 1; min-width: 200px; }
    input, select { width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: white; outline: none; }
    
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .card { background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.5rem; }
    .card img { width: 90px; height: 115px; object-fit: contain; background: #0f172a; border-radius: 6px; }
    .card-title { font-size: 0.9rem; font-weight: 600; }
    .card-subtitle { font-size: 0.75rem; color: #94a3b8; }
    
    .card-inputs { width: 100%; display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
    .input-row { display: flex; gap: 0.5rem; width: 100%; }
    .input-wrapper { flex: 1; text-align: left; }
    .input-wrapper label { font-size: 0.65rem; color: var(--gold); display: block; margin-bottom: 2px; }
    .input-wrapper input, .input-wrapper select { width: 100%; padding: 0.4rem; font-size: 0.8rem; text-align: center; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: white; }
    .btn-add-vitrine { background: var(--gold); color: #0f172a; border: none; width: 100%; padding: 0.5rem; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 0.5rem; }
    
    .pagination-nav { text-align: center; margin: 2rem 0; display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; }
    .btn-page { background: #1e293b; color: white; border: 1px solid rgba(255,255,255,0.1); padding: 0.5rem 0.9rem; border-radius: 6px; cursor: pointer; }
    .btn-page.active { background: var(--gold); color: #0f172a; font-weight: 800; }
    .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="top-nav">
      <div class="nav-links">
        <a href="index.html">🏠 Home</a>
        <a href="perfil.html">👤 Meu Perfil</a>
        <a href="vitrine.html" style="color: var(--gold);">🛍️ Vitrine</a>
        <div id="adminLinks" style="display:none;">
          <a href="admin.html">⚙️ Painel Admin</a>
          <a href="estoque.html">📊 Estoque</a>
        </div>
      </div>
      <div class="user-profile-top">
        <img id="userAvatar" src="https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg" class="user-avatar">
        <span id="userGreeting">Carregando...</span>
        <button class="btn-logout" onclick="fazerLogout()">Sair 🚪</button>
      </div>
      <div class="nav-controls">
  <select id="selectMoeda" class="select-control" onchange="mudarMoeda(this.value)">
    <option value="EUR">💶 EUR (€)</option>
    <option value="BRL">🇧🇷 BRL (R$)</option>
    <option value="USD">💵 USD ($)</option>
    <option value="GBP">🇬🇧 GBP (£)</option>
  </select>
  <select id="selectIdioma" class="select-control" onchange="mudarIdioma(this.value)">
    <option value="pt">PT</option>
    <option value="es">ES</option>
    <option value="fr">FR</option>
    <option value="it">IT</option>
    <option value="en">EN</option>
  </select>
</div>
    </div>
    <h1>🛍️ Gerenciar Minha Vitrine</h1>
  </header>

  <div class="container">
    <div class="controls-panel">
      <div class="filter-group">
        <label>Filtrar por Álbum:</label>
        <select id="filterAlbum" onchange="resetEBuscar()">
          <option value="todos">Todos os Álbuns</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Buscar Figurinha:</label>
        <input type="text" id="search" placeholder="🔍 Ex: 10, #10, Messi, Brasil...">
      </div>
    </div>

    <div class="cards-grid" id="vitrineGrid">
      <div style="grid-column: 1 / -1; text-align: center; padding: 2rem; color: #94a3b8;">Carregando...</div>
    </div>

    <div class="pagination-nav" id="paginationNav"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const ITENS_POR_PAGINA = 30;

    let usuarioLogado = null, authUserId = null, paginaAtual = 0;
    let mapaAlbuns = {}, meusPrecosQtd = {};

    async function buscarDados() {
      const albumId = document.getElementById('filterAlbum').value;
      const termo = document.getElementById('search').value.trim();
      const inicio = paginaAtual * ITENS_POR_PAGINA;
      
      let query = _supabase.from('figurinhas').select('*', { count: 'exact' }).order('numero', { ascending: true });
      if (albumId !== 'todos') query = query.eq('album_id', albumId);
      if (termo !== "") {
        const t = termo.replace('#', '');
        query = (!isNaN(t) && t !== "") ? query.or(`numero.eq.${t},nome.ilike.%${termo}%`) : query.ilike('nome', `%${termo}%`);
      }

      const { data, count, error } = await query.range(inicio, inicio + ITENS_POR_PAGINA - 1);
      if (error) return;

      renderizarCards(data || []);
      renderizarPaginacao(count || 0);
    }

    function renderizarPaginacao(totalItems) {
      const totalPaginas = Math.ceil(totalItems / ITENS_POR_PAGINA);
      const nav = document.getElementById('paginationNav');
      nav.innerHTML = '';

      const btnPrev = document.createElement('button');
      btnPrev.innerText = 'Anterior';
      btnPrev.className = 'btn-page';
      btnPrev.disabled = paginaAtual === 0;
      btnPrev.onclick = () => { paginaAtual--; buscarDados(); window.scrollTo(0, 0); };
      nav.appendChild(btnPrev);

      for (let i = 0; i < totalPaginas; i++) {
        const btn = document.createElement('button');
        btn.innerText = i + 1;
        btn.className = `btn-page ${i === paginaAtual ? 'active' : ''}`;
        btn.onclick = () => { paginaAtual = i; buscarDados(); window.scrollTo(0, 0); };
        nav.appendChild(btn);
      }

      const btnNext = document.createElement('button');
      btnNext.innerText = 'Próximo';
      btnNext.className = 'btn-page';
      btnNext.disabled = paginaAtual >= totalPaginas - 1;
      btnNext.onclick = () => { paginaAtual++; buscarDados(); window.scrollTo(0, 0); };
      nav.appendChild(btnNext);
    }

    async function verificarAcesso() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) { window.location.href = "login.html"; return null; }
      authUserId = session.user.id;
      const { data: perfil } = await _supabase.from('vendedores_autorizados').select('*').eq('email', session.user.email).maybeSingle();
      if (perfil) {
        usuarioLogado = perfil;
        document.getElementById('userGreeting').innerText = `Olá, ${perfil.nome || 'Vendedor'}`;
        if (perfil.avatar) document.getElementById('userAvatar').src = perfil.avatar;
        if (perfil.is_admin || perfil.funcao === 'admin' || perfil.funcao === 'master') document.getElementById('adminLinks').style.display = 'inline';
      }
      
      const { data: vitrineSalva } = await _supabase.from('vitrine_ofertas').select('figurinha_id, preco, estoque, tipo, qualidade').eq('user_id', authUserId);
      if (vitrineSalva) {
        vitrineSalva.forEach(item => {
          meusPrecosQtd[item.figurinha_id] = { 
            preco: item.preco, 
            estoque: item.estoque, 
            tipo: item.tipo || 'venda',
            qualidade: item.qualidade || '100% (Nova / Perfeita)'
          };
        });
      }
      return session;
    }

    function renderizarCards(lista) {
      const grid = document.getElementById('vitrineGrid');
      if (!lista.length) { grid.innerHTML = `<div style="grid-column: 1 / -1; padding: 2rem; color: #94a3b8;">Nenhuma figurinha encontrada.</div>`; return; }
      grid.innerHTML = lista.map(f => {
        const salvo = meusPrecosQtd[f.id] || { preco: 0, estoque: 0, tipo: 'venda', qualidade: '100% (Nova / Perfeita)' };
        const estiloPreco = salvo.tipo === 'troca' ? 'display: none;' : 'display: block;';

        return `<div class="card">
            <img src="${f.imagem || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'}">
            <div class="card-title">${f.numero} - ${f.nome}</div>
            <div class="card-subtitle">${mapaAlbuns[f.album_id] || 'Álbum Geral'}</div>
            
            <div class="card-inputs">
              <div class="input-wrapper">
                <label>Tipo de Anúncio</label>
                <select id="tipo-${f.id}" onchange="alternarTipo(${f.id})">
                  <option value="venda" ${salvo.tipo === 'venda' ? 'selected' : ''}>Venda</option>
                  <option value="troca" ${salvo.tipo === 'troca' ? 'selected' : ''}>Troca</option>
                </select>
              </div>

              <div class="input-wrapper">
                <label>Qualidade</label>
                <select id="qualidade-${f.id}">
                  <option value="100% (Nova / Perfeita)" ${salvo.qualidade === '100% (Nova / Perfeita)' ? 'selected' : ''}>✨ 100% (Nova / Perfeita)</option>
                  <option value="Ótimo estado" ${salvo.qualidade === 'Ótimo estado' ? 'selected' : ''}>👍 Ótimo estado</option>
                  <option value="Leve detalhe / Amassadinha" ${salvo.qualidade === 'Leve detalhe / Amassadinha' ? 'selected' : ''}>⚠️ Leve detalhe / Amassadinha</option>
                  <option value="Com marcas de uso" ${salvo.qualidade === 'Com marcas de uso' ? 'selected' : ''}>📌 Com marcas de uso</option>
                </select>
              </div>

              <div class="input-row">
                <div class="input-wrapper" id="wrapper-preco-${f.id}" style="${estiloPreco}">
                  <label>Preço (€)</label>
                  <input type="number" id="preco-${f.id}" value="${salvo.preco}" step="0.01">
                </div>
                <div class="input-wrapper">
                  <label>Qtd</label>
                  <input type="number" id="qtd-${f.id}" value="${salvo.estoque}" min="0">
                </div>
              </div>
            </div>

            <button class="btn-add-vitrine" onclick="adicionarNaVitrine(${f.id})">Salvar</button>
          </div>`;
      }).join('');
    }

    function alternarTipo(fId) {
      const tipo = document.getElementById(`tipo-${fId}`).value;
      const wrapperPreco = document.getElementById(`wrapper-preco-${fId}`);
      if (tipo === 'troca') {
        wrapperPreco.style.display = 'none';
      } else {
        wrapperPreco.style.display = 'block';
      }
    }

    async function adicionarNaVitrine(fId) {
      const tipo = document.getElementById(`tipo-${fId}`).value;
      const qualidade = document.getElementById(`qualidade-${fId}`).value;
      const preco = tipo === 'troca' ? 0 : (parseFloat(document.getElementById(`preco-${fId}`).value) || 0);
      const estoque = parseInt(document.getElementById(`qtd-${fId}`).value) || 0;

      // Se o usuário está tentando colocar estoque (novo anúncio)
      if (estoque > 0 && !meusPrecosQtd[fId]?.estoque) {
        const planoUsuario = usuarioLogado.plano || 'gratis';
        
        // Busca o limite dinâmico na tabela que criamos
        const { data: config } = await _supabase
          .from('configuracoes_planos')
          .select('limite_anuncios')
          .eq('plano', planoUsuario)
          .single();

        const limiteMaximo = config ? config.limite_anuncios : 10;

        if (limiteMaximo !== -1) {
          // Conta quantos anúncios ativos ele tem na vitrine (estoque > 0)
          const { count } = await _supabase
            .from('vitrine_ofertas')
            .select('*', { count: 'exact', head: true })
            .eq('user_id', authUserId)
            .gt('estoque', 0);

          if (count >= limiteMaximo) {
            alert(`Você atingiu o limite de ${limiteMaximo} anúncios ativos no seu plano ${planoUsuario.toUpperCase()}! Faça upgrade para o Premium ou Vitalício.`);
            return;
          }
        }
      }

      const { error } = await _supabase.from('vitrine_ofertas').upsert({ 
        user_id: authUserId, 
        figurinha_id: fId, 
        preco: preco, 
        estoque: estoque, 
        tipo: tipo, 
        qualidade: qualidade,
        nome_vendedor: usuarioLogado.nome 
      }, { onConflict: 'user_id, figurinha_id' });

      if (error) {
        alert("Erro ao salvar: " + error.message);
      } else {
        meusPrecosQtd[fId] = { preco, estoque, tipo, qualidade };
        alert("Salvo com sucesso!");
      }
    }

    function resetEBuscar() { paginaAtual = 0; buscarDados(); }
    document.getElementById('search').addEventListener('input', () => { clearTimeout(window.t); window.t = setTimeout(resetEBuscar, 500); });
    
    async function init() {
      if (!(await verificarAcesso())) return;
      const { data: albuns } = await _supabase.from('albuns').select('*');
      if (albuns) albuns.forEach(a => { mapaAlbuns[a.id] = a.nome; document.getElementById('filterAlbum').innerHTML += `<option value="${a.id}">${a.nome}</option>`; });
      buscarDados();
    }
    function fazerLogout() { _supabase.auth.signOut(); window.location.href = "index.html"; }
    init();
  </script>
</body>
</html>
