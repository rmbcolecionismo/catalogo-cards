      --radius-lg: 16px;

      --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);

    [data-theme="light"] {
      --gold: #d97706;
      --bg: #f1f5f9;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;

    body { background: var(--bg); min-height: 100vh; color: var(--text-main); padding: 20px; padding-bottom: 30px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
    
    .top-container { max-width: 1400px; margin: 0 auto 25px; width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .top-utils-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; background: var(--bg-card); padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
    .nav-tabs-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--bg-card); padding: 8px 15px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
    .nav-tabs-bar a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; padding: 6px 12px; border-radius: 8px; transition: 0.2s; background: var(--bg); border: 1px solid var(--border-color); }
    .nav-tabs-bar a:hover, .nav-tabs-bar a.active { color: var(--gold); border-color: var(--gold); background: rgba(245, 158, 11, 0.05); }

    .user-profile-header { display: flex; align-items: center; gap: 10px; }
    .user-avatar-top { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--gold); background: var(--bg); }
    
    .container { max-width: 1400px; margin: 0 auto; width: 100%; flex: 1; }

    .header-title-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    h1 { font-size: 1.8rem; color: var(--gold); font-weight: 800; display: flex; align-items: center; gap: 10px; }
    
    .plan-badge { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--gold); color: var(--gold); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }

    .controls-panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 25px; display: flex; gap: 15px; flex-wrap: wrap; box-shadow: var(--shadow-sm); }
    .filter-group { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
    .filter-group label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    
    .filter-field { background: var(--bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; width: 100%; }
    .filter-field:focus { border-color: var(--gold); }

    .cards-grid { 
      display: grid; 
      grid-template-columns: repeat(5, minmax(0, 1fr)); 
      gap: 16px; 
    }

    @media (max-width: 1200px) {
      .cards-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 900px) {
      .cards-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; transition: 0.2s; box-shadow: var(--shadow-sm); position: relative; }
    .card:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 6px 16px rgba(245,158,11,0.12); }
    
    .card-img-wrap { width: 90px; height: 120px; background: var(--bg); border-radius: 8px; padding: 6px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); }
    .card img { width: 100%; height: 100%; object-fit: contain; }
    
    .card-title { font-size: 0.85rem; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    .card-subtitle { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; margin-top: -4px; }
    
    .card-inputs { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 2px; text-align: left; }
    .input-row { display: flex; gap: 4px; width: 100%; align-items: flex-end; }
    .input-wrapper { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .input-wrapper label { font-size: 0.58rem; color: var(--gold); font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .input-wrapper select, .input-wrapper input { width: 100%; padding: 5px 4px; font-size: 0.68rem; text-align: center; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg); color: var(--text-main); outline: none; transition: 0.2s; }
    .input-wrapper select:focus, .input-wrapper input:focus { border-color: var(--gold); }

    .btn-add-vitrine { background: var(--gold); color: #0f172a; border: none; width: 100%; padding: 7px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 2px; font-size: 0.75rem; transition: 0.2s; box-shadow: 0 3px 8px rgba(245,158,11,0.2); }
    .btn-add-vitrine:hover { opacity: 0.9; transform: translateY(-1px); }

    .pagination-nav { text-align: center; margin: 35px 0; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .btn-page { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
    .btn-page.active { background: var(--gold); color: #0f172a; font-weight: 800; border-color: var(--gold); }
    .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }

    .language-selector-flags { display: flex; align-items: center; gap: 5px; background: var(--bg); border: 1px solid var(--border-color); padding: 3px 6px; border-radius: 8px; }
    .flag-option { background: none; border: 1px solid transparent; border-radius: 4px; padding: 2px; cursor: pointer; font-size: 1.1rem; line-height: 1; transition: 0.2s; opacity: 0.6; }
    .flag-option:hover { opacity: 0.9; transform: scale(1.05); }
    .flag-option.active { opacity: 1; border-color: var(--gold); background: rgba(245, 158, 11, 0.1); }

    .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.8rem; text-decoration: none; text-align: center; transition: 0.2s; }

        return; 
      }
      authUserId = session.user.id;

      let { data: perfil } = await _supabase
        .from('usuarios_cadastrados')
        .select('*')
        .eq('id', authUserId)
        .maybeSingle();

      if (!perfil) {
        const { data: perfilEmail } = await _supabase
          .from('usuarios_cadastrados')
          .select('*')
          .eq('email', session.user.email)
          .maybeSingle();
        perfil = perfilEmail;
      }

      if (perfil) {
        perfilLogado = perfil;
        idiomaAtual = perfil.idioma_preferido || 'pt-PT';
        
        const nomeUsuario = perfil.nome || session.user.email.split('@')[0];
        const avatarUrl = session.user.user_metadata?.avatar_url || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg';

        document.getElementById('userInfoHeader').innerHTML = `
          <img src="${avatarUrl}" class="user-avatar-top" onerror="this.src='https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'">
          <span style="font-size: 0.85rem; color: var(--text-main); font-weight: 600; padding-right: 6px;">Olá, <strong style="color: var(--gold);">${nomeUsuario}</strong></span>
          <button class="btn-outline" onclick="fazerLogout()" style="padding: 3px 6px; font-size: 0.7rem; margin-left: 3px;">${t('sair')}</button>
        `;

        const planoNome = (perfil.plano || 'gratis').toUpperCase();
        document.getElementById('badgePlanoContainer').innerText = `Plano: ${planoNome}`;

        const funcaoUsuario = String(perfil.funcao || '').toLowerCase().trim();
        if (funcaoUsuario === 'administrador' || funcaoUsuario === 'master') {
          const linkAdminEl = document.getElementById('linkAdmin');
          if (linkAdminEl) linkAdminEl.style.display = 'inline';
        }
      }

      const planoUsuario = (perfil?.plano || 'gratis').toLowerCase().trim();
      const { data: configPlano } = await _supabase
        .from('configuracoes_planos')
        .select('limite_anuncios')
        .ilike('plano', planoUsuario)
        .maybeSingle();

      const limiteMaximo = configPlano ? configPlano.limite_anuncios : 10;

      const { count: totalAtivos } = await _supabase
        .from('vitrine_ofertas')
        .select('*', { count: 'exact', head: true })
        .eq('user_id', authUserId)
        .gt('estoque', 0);

      const qtdAtivos = totalAtivos || 0;
      const avisoEl = document.getElementById('avisoLimiteVitrine');

      if (limiteMaximo !== -1 && qtdAtivos >= limiteMaximo) {
        avisoEl.style.display = 'block';
        avisoEl.innerHTML = `⚠️ Excedeu o limite da Vitrine (${qtdAtivos}/${limiteMaximo}). <a href="plano.html" style="color: var(--gold); text-decoration: underline;">Mudar de plano</a>`;
      } else if (limiteMaximo !== -1) {
        avisoEl.style.display = 'block';
        avisoEl.style.color = 'var(--text-muted)';
        avisoEl.innerText = `Anúncios ativos: ${qtdAtivos} / ${limiteMaximo}`;
      } else {
        avisoEl.style.display = 'block';
        avisoEl.style.color = 'var(--gold)';
        avisoEl.innerText = `Anúncios ativos: ${qtdAtivos} (Ilimitado)`;
      }

      const { data: albuns } = await _supabase.from('albuns').select('*');
      if (albuns) {
        const selectAlbum = document.getElementById('filterAlbum');
        let optionsHtml = `<option value="todos">${t('opcao_todos_albuns')}</option>`;
        albuns.forEach(a => { 
          mapaAlbuns[a.id] = a.nome; 
          optionsHtml += `<option value="${a.id}">${a.nome}</option>`; 
        });
        selectAlbum.innerHTML = optionsHtml;
      }

      const { data: vitrineSalva } = await _supabase
        .from('vitrine_ofertas')
        .select('figurinha_id, preco, estoque, qualidade, moeda')
        .eq('user_id', authUserId);

      if (vitrineSalva) {
        vitrineSalva.forEach(item => {
          meusPrecosQtd[item.figurinha_id] = { 
            preco: item.preco, 
            estoque: item.estoque, 
            qualidade: item.qualidade || '100% (Nova / Perfeita)',
            moeda: item.moeda || 'EUR'
          };
        });
      }

      marcarIdiomaAtivo();
      aplicarTraducaoInterface();
      buscarDados();
    }

    async function buscarDados() {
      const albumId = document.getElementById('filterAlbum').value;
      const termo = document.getElementById('search').value.trim();
      const inicio = paginaAtual * ITENS_POR_PAGINA;
      
      try {
        let query = _supabase.from('figurinhas').select('*', { count: 'exact' }).order('numero', { ascending: true });
        
        if (albumId !== 'todos') {
          query = query.eq('album_id', albumId);
        }
        
        if (termo !== "") {
          const termoLimpo = termo.replace('#', '').trim();
          
          if (!isNaN(termoLimpo) && termoLimpo !== "") {
            const numeroInt = parseInt(termoLimpo, 10);
            query = query.or(`numero.eq.${numeroInt},nome.ilike.%${termo}%,selecao_escuderia.ilike.%${termo}%,tipo.ilike.%${termo}%`);
          } else {
            query = query.or(`nome.ilike.%${termo}%,selecao_escuderia.ilike.%${termo}%,tipo.ilike.%${termo}%`);
          }
        }

        const { data, count, error } = await query.range(inicio, inicio + ITENS_POR_PAGINA - 1);
        
        if (error) {
          console.error("Erro retornado pelo Supabase:", error);
          document.getElementById('vitrineGrid').innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: #ef4444;">Erro ao carregar: ${error.message}</div>`;
          return;
        }

        renderizarCards(data || []);
        renderizarPaginacao(count || 0);
      } catch (err) {
        console.error("Erro inesperado:", err);
        document.getElementById('vitrineGrid').innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: #ef4444;">Erro inesperado ao consultar a base de dados.</div>`;
      }
    }

    function renderizarCards(lista) {
      const grid = document.getElementById('vitrineGrid');
      if (!lista.length) { 
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);">Nenhuma figurinha encontrada.</div>`; 
        return; 
      }

      grid.innerHTML = lista.map(f => {
        const salvo = meusPrecosQtd[f.id] || { preco: 0, estoque: 0, qualidade: '100% (Nova / Perfeita)', moeda: 'EUR' };

        return `
          <div class="card">
            <div class="card-img-wrap">
              <img src="${f.imagem || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'}" loading="lazy" onerror="this.src='https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'">
            </div>
            <div class="card-title">${f.numero} - ${f.nome}</div>
            <div class="card-subtitle">${mapaAlbuns[f.album_id] || t('album_geral')}</div>
            
            <div class="card-inputs">
              <div class="input-wrapper">
                <label>${t('qualidade')}</label>
                <select id="qualidade-${f.id}">
                  <option value="100% (Nova / Perfeita)" ${salvo.qualidade === '100% (Nova / Perfeita)' ? 'selected' : ''}>✨ 100% Nova</option>
                  <option value="Ótimo estado" ${salvo.qualidade === 'Ótimo estado' ? 'selected' : ''}>👍 Ótimo estado</option>
                  <option value="Leve detalhe / Amassadinha" ${salvo.qualidade === 'Leve detalhe / Amassadinha' ? 'selected' : ''}>⚠️ Leve detalhe</option>
                  <option value="Com marcas de uso" ${salvo.qualidade === 'Com marcas de uso' ? 'selected' : ''}>📌 Marcas de uso</option>
                </select>
              </div>

              <div class="input-row">
                <div class="input-wrapper" style="flex: 1.1;">
                  <label>${t('preco')}</label>
                  <input type="number" id="preco-${f.id}" value="${salvo.preco}" step="0.01" min="0">
                </div>
                <div class="input-wrapper" style="flex: 1.1;">
                  <label>${t('moeda')}</label>
                  <select id="moeda-${f.id}">
                    <option value="EUR" ${salvo.moeda === 'EUR' ? 'selected' : ''}>EUR (€)</option>
                    <option value="BRL" ${salvo.moeda === 'BRL' ? 'selected' : ''}>BRL (R$)</option>
                    <option value="USD" ${salvo.moeda === 'USD' ? 'selected' : ''}>USD ($)</option>
                    <option value="GBP" ${salvo.moeda === 'GBP' ? 'selected' : ''}>GBP (£)</option>
                    <option value="CHF" ${salvo.moeda === 'CHF' ? 'selected' : ''}>CHF (Fr)</option>
                  </select>
                </div>
                <div class="input-wrapper" style="flex: 0.9;">
                  <label>${t('qtd_repetida')}</label>
                  <input type="number" id="qtd-${f.id}" value="${salvo.estoque}" min="0">
                </div>
              </div>
            </div>

            <button class="btn-add-vitrine" onclick="adicionarNaVitrine(${f.id})">${t('salvar')}</button>
          </div>
        `;
      }).join('');
    }

    async function adicionarNaVitrine(fId) {
      const qualidade = document.getElementById(`qualidade-${fId}`).value;
      const preco = parseFloat(document.getElementById(`preco-${fId}`).value) || 0;
      const moeda = document.getElementById(`moeda-${fId}`).value;
      const estoque = parseInt(document.getElementById(`qtd-${fId}`).value) || 0;

      const estoqueAnterior = meusPrecosQtd[fId]?.estoque || 0;

      if (estoque > 0 && estoqueAnterior === 0) {
        const planoUsuario = (perfilLogado?.plano || 'gratis').toLowerCase().trim();
        
        const { data: config } = await _supabase
          .from('configuracoes_planos')
          .select('limite_anuncios')
          .ilike('plano', planoUsuario)
          .maybeSingle();

        const limiteMaximo = config ? config.limite_anuncios : 10;

        if (limiteMaximo !== -1) {
          const { count, error: errCount } = await _supabase
            .from('vitrine_ofertas')
            .select('*', { count: 'exact', head: true })
            .eq('user_id', authUserId)
            .gt('estoque', 0);

          if (!errCount && (count || 0) >= limiteMaximo) {
            alert(`Atenção: Atingiu o limite máximo de ${limiteMaximo} anúncios ativos do seu plano (${planoUsuario.toUpperCase()}).`);
            window.location.href = "plano.html";
            return;
          }
        }
      }

      const { error } = await _supabase.from('vitrine_ofertas').upsert({ 
        user_id: authUserId, 
        figurinha_id: fId, 
        preco: preco, 
        moeda: moeda, 
        estoque: estoque, 
        tipo: 'venda', 
        qualidade: qualidade,
        nome_vendedor: perfilLogado?.nome || 'Colecionador'
      }, { onConflict: 'user_id, figurinha_id' });

      if (error) {
        alert(t('msg_erro') + error.message);
      } else {
        meusPrecosQtd[fId] = { preco, estoque, qualidade, moeda };
        alert(t('msg_sucesso'));
        window.location.reload();
      }
    }

    function renderizarPaginacao(totalItems) {
      const totalPaginas = Math.ceil(totalItems / ITENS_POR_PAGINA);
      const nav = document.getElementById('paginationNav');
      if (totalPaginas <= 1) {
        nav.innerHTML = '';
        return;
      }

      let html = '';
      html += `<button class="btn-page" ${paginaAtual === 0 ? 'disabled' : ''} onclick="mudarPagina(${paginaAtual - 1})">${t('anterior')}</button>`;
      
      for (let i = 0; i < totalPaginas; i++) {
        if (i === 0 || i === totalPaginas - 1 || (i >= paginaAtual - 2 && i <= paginaAtual + 2)) {
          html += `<button class="btn-page ${i === paginaAtual ? 'active' : ''}" onclick="mudarPagina(${i})">${i + 1}</button>`;
        }
      }

      html += `<button class="btn-page" ${paginaAtual >= totalPaginas - 1 ? 'disabled' : ''} onclick="mudarPagina(${paginaAtual + 1})">${t('proximo')}</button>`;
      nav.innerHTML = html;
    }

    function mudarPagina(novaPagina) {
      paginaAtual = novaPagina;
      buscarDados();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetEBuscar() { 
      paginaAtual = 0; 
      buscarDados(); 
    }

    document.getElementById('search').addEventListener('input', () => { 
      clearTimeout(window.t); 
      window.t = setTimeout(resetEBuscar, 500); 
    });

    async function alternarTema() {
      const atual = document.documentElement.getAttribute('data-theme');
      if (atual === 'light') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('tema_app', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('tema_app', 'light');
      }
    }

    async function mudarIdiomaGlobal(valor) {
      idiomaAtual = valor;
      localStorage.setItem('idioma_app', valor);
      if (perfilLogado) {
        await _supabase
          .from('usuarios_cadastrados')
          .update({ idioma_preferido: valor })
          .eq('id', authUserId);
      }
      marcarIdiomaAtivo();
      aplicarTraducaoInterface();
      
      const selectAlbum = document.getElementById('filterAlbum');
      if (selectAlbum.options.length > 0) {
        selectAlbum.options[0].text = t('opcao_todos_albuns');
      }
      buscarDados();
    }

    function marcarIdiomaAtivo() {
      document.querySelectorAll('.flag-option').forEach(btn => {
        if (btn.getAttribute('data-lang') === idiomaAtual) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function fazerLogout() { 
      _supabase.auth.signOut(); 
      window.location.href = "index.html"; 
    }

    init();
  </script>
</body>
</html>
