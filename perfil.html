<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Perfil e Vitrine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #f59e0b; --bg: #0f172a; }
    body { background: var(--bg); color: white; font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; }
    .main-layout { display: flex; gap: 20px; max-width: 1300px; margin: 0 auto; flex-wrap: wrap; }
    .profile-sidebar { width: 300px; background: rgba(30, 41, 59, 0.7); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); height: fit-content; }
    .avatar-img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; display: block; margin: 0 auto; }
    .vitrine-content { flex: 1; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    .card { background: #1e293b; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
    .card img { width: 70px; height: 95px; object-fit: contain; background: #0f172a; border-radius: 4px; }
    .card-title { font-size: 0.85rem; font-weight: 600; }
    .card-info { font-size: 0.8rem; margin-top: 0.3rem; color: #94a3b8; width: 100%; display: flex; justify-content: space-around; background: rgba(15, 23, 42, 0.6); padding: 0.3rem; border-radius: 4px; }
    .price { color: var(--gold); font-weight: 700; }
    .edit-field { background: #0f172a; border: 1px solid var(--gold); color: white; padding: 8px; width: 100%; margin-bottom: 10px; border-radius: 4px; box-sizing: border-box; }
    button { cursor: pointer; padding: 10px; border-radius: 6px; border: none; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; }
    button:hover { opacity: 0.9; }
    .btn-logout { background: #ef4444; color: white; }
    .btn-gold { background: var(--gold); color: #0f172a; }
  </style>
</head>
<body>

<div class="main-layout">
  <div class="profile-sidebar">
    <div style="text-align:center">
      <img id="userAvatar" src="https://via.placeholder.com/120" class="avatar-img">
      <input type="file" id="avatarInput" style="display:none" accept="image/*" onchange="uploadAvatar(event)">
      <button class="btn-gold" onclick="document.getElementById('avatarInput').click()">Trocar Foto</button>
    </div>

    <div id="viewMode" style="margin-top:20px; text-align: center;">
      <h3 id="userName">Carregando...</h3>
      <div id="profileDetails" style="font-size: 0.9rem; color: #cbd5e1; margin: 15px 0;"></div>
      <button onclick="toggleEdit()">Editar Perfil</button>
    </div>

    <div id="editMode" style="display:none; margin-top:20px;">
      <label style="font-size: 0.75rem; color: var(--gold);">Nome:</label>
      <input type="text" id="editNome" class="edit-field" placeholder="Seu Nome">
      
      <label style="font-size: 0.75rem; color: var(--gold);">Cidade:</label>
      <input type="text" id="editCidade" class="edit-field" placeholder="Sua Cidade">
      
      <button class="btn-gold" onclick="salvarPerfil()">Salvar Alterações</button>
      <button onclick="toggleEdit()" style="background:transparent; border:1px solid white">Cancelar</button>
    </div>

    <div id="navMenu" style="margin-top:20px; border-top: 1px solid #334155; padding-top:20px;">
      <a href="index.html" style="text-decoration:none;"><button style="background:#334155; color:white">🏠 Home</button></a>
      <a href="vitrine.html" style="text-decoration:none;"><button class="btn-gold">📦 Gerenciar Vitrine</button></a>
      <div id="adminLinks" style="display:none;">
        <a href="admin.html" style="text-decoration:none;"><button style="background:#334155; color:white">⚙️ Painel Admin</button></a>
        <a href="estoque.html" style="text-decoration:none;"><button style="background:#334155; color:white">📊 Ver Estoque</button></a>
      </div>
      <button class="btn-logout" onclick="fazerLogout()">Sair do Sistema</button>
    </div>
  </div>

  <div class="vitrine-content">
    <h2>🛍️ Minha Vitrine</h2>
    <div class="cards-grid" id="vitrineGrid">Carregando vitrine...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let usuarioLogado = null;
  let authUserId = null;

  async function verificarAcesso() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) { window.location.replace("login.html"); return; }

    authUserId = session.user.id;

    const { data: perfil } = await _supabase
      .from('vendedores_autorizados')
      .select('*')
      .eq('email', session.user.email)
      .maybeSingle();

    if (perfil) {
      usuarioLogado = perfil;
      document.getElementById('userName').innerText = perfil.nome || "Usuário";
      document.getElementById('userAvatar').src = perfil.avatar || 'https://via.placeholder.com/120';
      
      document.getElementById('profileDetails').innerHTML = `
        <p>📍 <strong>${perfil.cidade || 'Cidade não informada'}</strong></p>
      `;
      
      document.getElementById('editNome').value = perfil.nome || '';
      document.getElementById('editCidade').value = perfil.cidade || '';

      if (perfil.is_admin === true || perfil.funcao === 'admin' || perfil.funcao === 'master') {
        document.getElementById('adminLinks').style.display = 'block';
      }

      carregarVitrine(authUserId);
    }
  }

  async function uploadAvatar(event) {
    const file = event.target.files[0];
    if (!file) return;
    const fileName = `${usuarioLogado.id}_${Date.now()}.jpg`;
    const { error } = await _supabase.storage.from('avatars').upload(fileName, file);
    
    if (error) return alert("Erro no upload: " + error.message);
    
    const { data: { publicUrl } } = _supabase.storage.from('avatars').getPublicUrl(fileName);
    await _supabase.from('vendedores_autorizados').update({ avatar: publicUrl }).eq('id', usuarioLogado.id);
    location.reload();
  }

  async function salvarPerfil() {
    const updates = {
      nome: document.getElementById('editNome').value,
      cidade: document.getElementById('editCidade').value
    };
    
    const { error } = await _supabase.from('vendedores_autorizados').update(updates).eq('id', usuarioLogado.id);
    
    if (error) {
      alert("Erro ao atualizar perfil: " + error.message);
    } else {
      location.reload();
    }
  }

  function toggleEdit() {
    const view = document.getElementById('viewMode');
    const edit = document.getElementById('editMode');
    view.style.display = (view.style.display === 'none') ? 'block' : 'none';
    edit.style.display = (edit.style.display === 'none') ? 'block' : 'none';
  }

  async function carregarVitrine(userId) {
    const { data, error } = await _supabase
      .from('vitrine_ofertas')
      .select(`
        preco,
        estoque,
        figurinhas (
          numero,
          nome,
          imagem
        )
      `)
      .eq('user_id', userId);

    const grid = document.getElementById('vitrineGrid');
    
    if (error) {
      console.error("Erro ao carregar vitrine:", error);
      grid.innerHTML = "<p>Erro ao carregar vitrine.</p>";
      return;
    }

    if (!data || data.length === 0) { 
      grid.innerHTML = "<p style='color: #94a3b8; grid-column: 1/-1;'>Sua vitrine está vazia.</p>"; 
      return; 
    }

    grid.innerHTML = data.map(item => {
      const f = item.figurinhas || {};
      return `
        <div class="card">
          <img src="${f.imagem || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'}" alt="Figurinha">
          <div class="card-title">${f.numero ? '#' + f.numero : ''} ${f.nome || 'Sem Nome'}</div>
          <div class="card-info">
            <div>Preço: <span class="price">€${Number(item.preco || 0).toFixed(2)}</span></div>
            <div>Qtd: <b>${item.estoque || 0}</b></div>
          </div>
        </div>
      `;
    }).join('');
  }

  async function fazerLogout() {
    await _supabase.auth.signOut();
    window.location.replace("index.html");
  }

  verificarAcesso();
</script>
</body>
</html>
