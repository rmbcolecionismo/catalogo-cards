<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Perfil e Vitrine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --gold: #f59e0b; --bg: #0f172a; }
    body { background: var(--bg); color: white; font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; }
    
    .main-layout { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
    
    /* Coluna Esquerda: Dados e Avatar */
    .profile-sidebar { width: 300px; background: rgba(30, 41, 59, 0.7); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); height: fit-content; }
    .avatar-container { text-align: center; margin-bottom: 20px; }
    .avatar-img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; }
    .btn-upload { background: var(--gold); color: black; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.7rem; margin-top: 10px; }
    
    /* Coluna Direita: Vitrine */
    .vitrine-content { flex: 1; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    .card { background: #1e293b; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>

<div class="main-layout">
  <!-- Sidebar -->
  <div class="profile-sidebar">
    <div class="avatar-container">
      <img id="userAvatar" src="https://via.placeholder.com/120" class="avatar-img">
      <br>
      <button class="btn-upload" onclick="trocarAvatar()">Trocar Avatar</button>
    </div>
    <h3 id="userName">Carregando...</h3>
    <div id="profileDetails" style="font-size: 0.85rem; color: #cbd5e1;"></div>
    <button class="btn-logout" onclick="fazerLogout()" style="margin-top:20px; width:100%">Sair</button>
  </div>

  <!-- Conteúdo Direita -->
  <div class="vitrine-content">
    <h2>🛍️ Minha Vitrine</h2>
    <div class="cards-grid" id="vitrineGrid"></div>
  </div>
</div>

<script>
  const _supabase = supabase.createClient("URL", "KEY");
  let usuarioLogado = null;

  async function verificarAcesso() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) window.location.href = "login.html";

    // Busca o perfil completo
    const { data: perfil } = await _supabase
      .from('vendedores_autorizados')
      .select('*')
      .eq('email', session.user.email)
      .single();

    if (perfil) {
      usuarioLogado = perfil;
      document.getElementById('userName').innerText = perfil.nome;
      document.getElementById('userAvatar').src = perfil.avatar || 'https://via.placeholder.com/120';
      document.getElementById('profileDetails').innerHTML = `
        <p><strong>Cidade:</strong> ${perfil.cidade}</p>
        <p><strong>Morada:</strong> ${perfil.morada}</p>
      `;
      carregarVitrine();
    }
  }

  async function carregarVitrine() {
    // Busca na tabela vitrine_ofertas ligando com a tabela figurinhas
    const { data, error } = await _supabase
      .from('vitrine_ofertas')
      .select('preco, quantidade, figurinhas(nome, numero, imagem)')
      .eq('vendedor_id', usuarioLogado.id);

    const grid = document.getElementById('vitrineGrid');
    grid.innerHTML = data.map(item => `
      <div class="card">
        <img src="${item.figurinhas.imagem}" style="width:60px">
        <p>${item.figurinhas.nome}</p>
        <p>Preço: €${item.preco}</p>
        <p>Qtd: ${item.quantidade}</p>
      </div>
    `).join('');
  }

  async function trocarAvatar() {
    const novoUrl = prompt("Cole a URL da sua nova foto:");
    if (novoUrl) {
      const { error } = await _supabase.from('vendedores_autorizados')
        .update({ avatar: novoUrl })
        .eq('id', usuarioLogado.id);
      if (!error) location.reload();
    }
  }

  async function fazerLogout() {
    await _supabase.auth.signOut();
    window.location.href = "login.html";
  }

  verificarAcesso();
</script>
</body>
</html>
