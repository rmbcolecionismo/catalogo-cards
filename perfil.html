<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meu Perfil e Vitrine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #f59e0b; --bg: #0f172a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #f8fafc; padding: 20px; }
    
    .main-layout { display: flex; gap: 20px; max-width: 1350px; margin: 0 auto; flex-wrap: wrap; }
    .profile-sidebar { width: 300px; background: rgba(30, 41, 59, 0.7); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); height: fit-content; }
    .avatar-img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; display: block; margin: 0 auto; }
    .vitrine-content { flex: 1; }
    
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; }
    
    .sticker-card { 
      background: rgba(30, 41, 59, 0.85); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 12px; 
      overflow: hidden; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
      color: #f8fafc; 
      display: flex; 
      flex-direction: column; 
      transition: 0.3s; 
    }
    .sticker-card:hover { transform: translateY(-3px); border-color: var(--gold); }
    
    .sticker-img-wrap { 
      height: 190px; 
      background: #0f172a; 
      padding: 12px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .sticker-card img { width: 100%; height: 100%; object-fit: contain; }
    
    .sticker-info { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .card-row { font-size: 0.75rem; color: #94a3b8; }
    .card-row span { font-weight: 700; color: #f8fafc; }
    
    .sticker-title { font-size: 0.9rem; font-weight: 700; color: #f8fafc; margin: 2px 0; }
    .sticker-price { font-size: 1.1rem; font-weight: 800; color: #34d399; margin: 4px 0; }
    .sticker-qtd { font-size: 0.75rem; color: #94a3b8; font-weight: 600; }

    .card-actions { display: flex; gap: 5px; margin-top: auto; padding-top: 6px; }
    .btn-card-action { flex: 1; padding: 0.5rem; font-size: 0.75rem; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; text-align: center; }
    .btn-edit { background: #3b82f6; color: white; }
    .btn-edit:hover { background: #2563eb; }
    .btn-delete { background: #ef4444; color: white; }
    .btn-delete:hover { background: #dc2626; }

    .edit-field { background: #0f172a; border: 1px solid var(--gold); color: white; padding: 8px; width: 100%; margin-bottom: 10px; border-radius: 4px; box-sizing: border-box; }
    button { cursor: pointer; padding: 10px; border-radius: 6px; border: none; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; }
    button:hover { opacity: 0.9; }
    .btn-logout { background: #ef4444; color: white; }
    .btn-gold { background: var(--gold); color: #0f172a; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
    .modal-box { background: #1e293b; border: 1px solid var(--gold); padding: 25px; border-radius: 12px; width: 320px; }
  </style>
</head>
<body>

<div class="main-layout">
  <div class="profile-sidebar">
    <div style="text-align:center">
      <img id="userAvatar" src="https://via.placeholder.com/120" class="avatar-img">
      <input type="file" id="avatarInput" style="display:none" accept="image/*" onchange="uploadAvatar(event)">
      <button class="btn-gold" onclick="document.getElementById('avatarInput').click()">Trocar Foto</button>
    </div>

    <div id="viewMode" style="margin-top:20px; text-align: center;">
      <h3 id="userName">Carregando...</h3>
      <div id="profileDetails" style="font-size: 0.9rem; color: #cbd5e1; margin: 15px 0;"></div>
      <button onclick="toggleEdit()">Editar Perfil</button>
    </div>

    <div id="editMode" style="display:none; margin-top:20px;">
      <label style="font-size: 0.75rem; color: var(--gold);">Nome:</label>
      <input type="text" id="editNome" class="edit-field" placeholder="Seu Nome">
      
      <label style="font-size: 0.75rem; color: var(--gold);">Cidade:</label>
      <input type="text" id="editCidade" class="edit-field" placeholder="Sua Cidade">
      
      <button class="btn-gold" onclick="salvarPerfil()">Salvar Alterações</button>
      <button onclick="toggleEdit()" style="background:transparent; border:1px solid white">Cancelar</button>
    </div>

    <div id="navMenu" style="margin-top:20px; border-top: 1px solid #334155; padding-top:20px;">
      <a href="index.html" style="text-decoration:none;"><button style="background:#334155; color:white">🏠 Home</button></a>
      <a href="vitrine.html" style="text-decoration:none;"><button class="btn-gold">📦 Gerenciar Vitrine</button></a>
      <div id="adminLinks" style="display:none;">
        <a href="admin.html" style="text-decoration:none;"><button style="background:#334155; color:white">⚙️ Painel Admin</button></a>
        <a href="estoque.html" style="text-decoration:none;"><button style="background:#334155; color:white">📊 Ver Estoque</button></a>
      </div>
      <button class="btn-logout" onclick="fazerLogout()">Sair do Sistema</button>
    </div>
  </div>

  <div class="vitrine-content">
    <h2>🛍️ Vitrine de Ofertas</h2>
    <div class="cards-grid" id="vitrineGrid">Carregando vitrine...</div>
  </div>
</div>

<!-- Modal de Edição de Oferta -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3 style="margin-bottom: 15px; color: var(--gold);">✏️ Editar Oferta</h3>
    <input type="hidden" id="modalOfertaId">
    
    <label style="font-size: 0.75rem; color: #94a3b8;">Preço (€):</label>
    <input type="number" step="0.01" id="modalPreco" class="edit-field">
    
    <label style="font-size: 0.75rem; color: #94a3b8;">Estoque/Qtd:</label>
    <input type="number" id="modalEstoque" class="edit-field">
    
    <button class="btn-gold" onclick="salvarEdicaoOferta()">Salvar Alterações</button>
    <button onclick="fecharModal()" style="background:transparent; border:1px solid white; color:white;">Cancelar</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  
  let usuarioLogado = null;
  let perfilAlvoId = null;
  let isAdminOrMaster = false;

  async function verificarAcesso() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) { window.location.replace("login.html"); return; }

    const { data: perfilLogado } = await _supabase
      .from('vendedores_autorizados')
      .select('*')
      .eq('email', session.user.email)
      .maybeSingle();

    if (!perfilLogado) { window.location.replace("login.html"); return; }

    usuarioLogado = perfilLogado;
    isAdminOrMaster = (perfilLogado.is_admin === true || perfilLogado.funcao === 'admin' || perfilLogado.funcao === 'master');

    const urlParams = new URLSearchParams(window.location.search);
    const idParam = urlParams.get('id');

    if (idParam && idParam !== String(perfilLogado.id) && idParam !== String(perfilLogado.user_id)) {
      const { data: perfilAlvo } = await _supabase
        .from('vendedores_autorizados')
        .select('*')
        .or(`id.eq.${idParam},user_id.eq.${idParam}`)
        .maybeSingle();

      if (perfilAlvo) {
        perfilAlvoId = perfilAlvo.user_id || perfilAlvo.id;
        preencherDadosPerfil(perfilAlvo, false);
      } else {
        preencherDadosPerfil(perfilLogado, true);
        perfilAlvoId = perfilLogado.user_id || perfilLogado.id;
      }
    } else {
      preencherDadosPerfil(perfilLogado, true);
      perfilAlvoId = perfilLogado.user_id || perfilLogado.id;
    }

    if (isAdminOrMaster) {
      document.getElementById('adminLinks').style.display = 'block';
    }

    carregarVitrine(perfilAlvoId);
  }

  function preencherDadosPerfil(perfil, ehProprio) {
    document.getElementById('userName').innerText = perfil.nome || "Usuário";
    document.getElementById('userAvatar').src = perfil.avatar || 'https://via.placeholder.com/120';
    document.getElementById('profileDetails').innerHTML = `<p>📍 <strong>${perfil.cidade || 'Cidade não informada'}</strong></p>`;
    
    document.getElementById('editNome').value = perfil.nome || '';
    document.getElementById('editCidade').value = perfil.cidade || '';

    if (!ehProprio && !isAdminOrMaster) {
      document.getElementById('viewMode').querySelector('button').style.display = 'none';
    }
  }

  async function uploadAvatar(event) {
    const file = event.target.files[0];
    if (!file) return;
    const fileName = `${usuarioLogado.id}_${Date.now()}.jpg`;
    const { error } = await _supabase.storage.from('avatars').upload(fileName, file);
    if (error) return alert("Erro no upload: " + error.message);
    
    const { data: { publicUrl } } = _supabase.storage.from('avatars').getPublicUrl(fileName);
    await _supabase.from('vendedores_autorizados').update({ avatar: publicUrl }).eq('id', usuarioLogado.id);
    location.reload();
  }

  async function salvarPerfil() {
    const updates = {
      nome: document.getElementById('editNome').value,
      cidade: document.getElementById('editCidade').value
    };
    const { error } = await _supabase.from('vendedores_autorizados').update(updates).eq('id', usuarioLogado.id);
    if (error) alert("Erro ao atualizar perfil: " + error.message);
    else location.reload();
  }

  function toggleEdit() {
    const view = document.getElementById('viewMode');
    const edit = document.getElementById('editMode');
    view.style.display = (view.style.display === 'none') ? 'block' : 'none';
    edit.style.display = (edit.style.display === 'none') ? 'block' : 'none';
  }

  async function carregarVitrine(userId) {
    const grid = document.getElementById('vitrineGrid');
    
    // Busca segura de ofertas vinculadas ao usuário
    const { data: ofertas, error } = await _supabase
      .from('vitrine_ofertas')
      .select('*')
      .eq('user_id', userId);

    if (error) {
      console.error("Erro ao carregar vitrine:", error);
      grid.innerHTML = `<p style='color: #ef4444; grid-column: 1/-1;'>Erro ao carregar vitrine: ${error.message}</p>`;
      return;
    }

    if (!ofertas || ofertas.length === 0) { 
      grid.innerHTML = "<p style='color: #94a3b8; grid-column: 1/-1;'>Esta vitrine está vazia.</p>"; 
      return; 
    }

    // Busca todas as figurinhas correspondentes para preencher os dados visuais
    const figIds = ofertas.map(o => o.figurinha_id || o.id_figurinha).filter(Boolean);
    let figurinhasMap = {};
    
    if (figIds.length > 0) {
      const { data: figs } = await _supabase
        .from('figurinhas')
        .select('*')
        .in('id', figIds);
        
      if (figs) {
        figs.forEach(f => { figurinhasMap[f.id] = f; });
      }
    }

    grid.innerHTML = ofertas.map(item => {
      const fId = item.figurinha_id || item.id_figurinha;
      const f = figurinhasMap[fId] || {};
      const precoNum = item.preco || 0;
      const precoFormatado = Number(precoNum).toFixed(2).replace('.', ',');

      const podeGerenciar = (String(item.user_id) === String(usuarioLogado.user_id) || String(item.user_id) === String(usuarioLogado.id) || isAdminOrMaster);

      return `
        <div class="sticker-card">
          <div class="sticker-img-wrap">
            <img src="${f.imagem || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'}" alt="${f.nome || 'Figurinha'}">
          </div>
          <div class="sticker-info">
            <div class="sticker-title">${f.nome || 'Sem Nome'}</div>
            <div class="card-row">Código: <span>${f.numero || 'N/A'}</span></div>
            <div class="card-row">Seleção: <span>${f.selecao_escuderia || 'N/A'}</span></div>
            <div class="card-row">Tipo: <span>${f.tipo || 'N/A'}</span></div>
            <div class="sticker-qtd" style="margin-top: 2px;">Disponível: ${item.estoque || 0}</div>
            <div class="sticker-price">€ ${precoFormatado}</div>
            
            ${podeGerenciar ? `
              <div class="card-actions">
                <button class="btn-card-action btn-edit" onclick="abrirModalEdicao('${item.id}', ${item.preco}, ${item.estoque})">Editar</button>
                <button class="btn-card-action btn-delete" onclick="deletarOferta('${item.id}')">Excluir</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  function abrirModalEdicao(ofertaId, precoAtual, estoqueAtual) {
    document.getElementById('modalOfertaId').value = ofertaId;
    document.getElementById('modalPreco').value = precoAtual;
    document.getElementById('modalEstoque').value = estoqueAtual;
    document.getElementById('editModal').style.display = 'flex';
  }

  function fecharModal() {
    document.getElementById('editModal').style.display = 'none';
  }

  async function salvarEdicaoOferta() {
    const ofertaId = document.getElementById('modalOfertaId').value;
    const novoPreco = parseFloat(document.getElementById('modalPreco').value);
    const novoEstoque = parseInt(document.getElementById('modalEstoque').value);

    const { error } = await _supabase
      .from('vitrine_ofertas')
      .update({ preco: novoPreco, estoque: novoEstoque })
      .eq('id', ofertaId);

    if (error) {
      alert("Erro ao atualizar oferta: " + error.message);
    } else {
      fecharModal();
      location.reload();
    }
  }

  async function deletarOferta(ofertaId) {
    if (!confirm("Tem certeza que deseja excluir esta figurinha da vitrine?")) return;

    const { error } = await _supabase
      .from('vitrine_ofertas')
      .delete()
      .eq('id', ofertaId);

    if (error) {
      alert("Erro ao excluir oferta: " + error.message);
    } else {
      location.reload();
    }
  }

  async function fazerLogout() {
    await _supabase.auth.signOut();
    window.location.replace("index.html");
  }

  verificarAcesso();
</script>
</body>
</html>
