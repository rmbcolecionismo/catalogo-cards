<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Perfil e Vitrine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #f59e0b; --bg: #0f172a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #f8fafc; padding: 20px; }
    
    .main-layout { display: flex; gap: 20px; max-width: 1350px; margin: 0 auto; flex-wrap: wrap; }
    .profile-sidebar { width: 320px; background: rgba(30, 41, 59, 0.7); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); height: fit-content; }
    .avatar-img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; display: block; margin: 0 auto; }
    .vitrine-content { flex: 1; }

    /* Filtros da Vitrine */
    .vitrine-filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; background: rgba(30, 41, 59, 0.7); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
    .filter-field { background: #0f172a; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; outline: none; flex: 1; min-width: 200px; }
    .filter-field:focus { border-color: var(--gold); }
    
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; }
    
    .sticker-card { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); color: #f8fafc; display: flex; flex-direction: column; transition: 0.3s; }
    .sticker-card:hover { transform: translateY(-3px); border-color: var(--gold); }
    
    .sticker-img-wrap { height: 190px; background: #0f172a; padding: 12px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .sticker-card img { width: 100%; height: 100%; object-fit: contain; }
    
    .sticker-info { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .card-row { font-size: 0.75rem; color: #94a3b8; }
    .card-row span { font-weight: 700; color: #f8fafc; }
    
    .sticker-title { font-size: 0.9rem; font-weight: 700; color: #f8fafc; margin: 2px 0; }
    .sticker-price { font-size: 1.1rem; font-weight: 800; color: #34d399; margin: 4px 0; }
    .sticker-qtd { font-size: 0.75rem; color: #94a3b8; font-weight: 600; }
    .sticker-qualidade { font-size: 0.75rem; background: rgba(245, 158, 11, 0.15); color: var(--gold); padding: 3px 6px; border-radius: 4px; font-weight: 600; display: inline-block; margin-top: 4px; }

    .card-actions { display: flex; gap: 5px; margin-top: auto; padding-top: 6px; }
    .btn-card-action { flex: 1; padding: 0.5rem; font-size: 0.75rem; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; text-align: center; }
    .btn-edit { background: #3b82f6; color: white; }
    .btn-delete { background: #ef4444; color: white; }

    .edit-field { background: #0f172a; border: 1px solid var(--gold); color: white; padding: 8px; width: 100%; margin-bottom: 10px; border-radius: 4px; font-size: 0.9rem; }
    button { cursor: pointer; padding: 10px; border-radius: 6px; border: none; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; }
    .btn-logout { background: #ef4444; color: white; }
    .btn-gold { background: var(--gold); color: #0f172a; }

    /* Área de Avaliações */
    .reviews-section { margin-top: 25px; border-top: 1px solid #334155; padding-top: 15px; }
    .review-card { background: rgba(15, 23, 42, 0.6); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.05); position: relative; }
    .stars-display { color: var(--gold); font-size: 0.9rem; letter-spacing: 2px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
    .modal-box { background: #1e293b; border: 1px solid var(--gold); padding: 25px; border-radius: 12px; width: 340px; }
  </style>
</head>
<body>

<div class="main-layout">
  <div class="profile-sidebar">
    <div style="text-align:center">
      <img id="userAvatar" src="https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg" class="avatar-img">
      <input type="file" id="avatarInput" style="display:none" accept="image/*" onchange="uploadAvatar(event)">
      <button id="btnTrocarFoto" class="btn-gold" style="display:none;" onclick="document.getElementById('avatarInput').click()">Trocar Foto</button>
    </div>

    <div id="viewMode" style="margin-top:20px; text-align: center;">
      <h3 id="userName">Carregando...</h3>
      <div id="profileDetails" style="font-size: 0.9rem; color: #cbd5e1; margin: 15px 0;"></div>
      <div id="mediaEstrelas" style="margin-bottom: 10px;"></div>
      <a id="linkWhatsApp" href="#" target="_blank" style="display:none; color: var(--gold); font-size: 0.9rem; text-decoration: none; font-weight: 600; display:block; margin-bottom:10px;">💬 Falar no WhatsApp</a>
      <button id="btnEditarPerfil" style="display:none; margin-top:5px;" onclick="toggleEdit()">Editar Perfil</button>
    </div>

    <div id="editMode" style="display:none; margin-top:20px;">
      <label style="font-size: 0.75rem; color: var(--gold);">Nome:</label>
      <input type="text" id="editNome" class="edit-field">
      <label style="font-size: 0.75rem; color: var(--gold);">Cidade:</label>
      <input type="text" id="editCidade" class="edit-field">
      <label style="font-size: 0.75rem; color: var(--gold);">WhatsApp (apenas números):</label>
      <input type="text" id="editWhatsApp" class="edit-field" placeholder="Ex: 5511999999999">
      
      <button class="btn-gold" onclick="salvarPerfil()">Salvar Alterações</button>
      <button onclick="toggleEdit()" style="background:transparent; border:1px solid white; color: white;">Cancelar</button>
    </div>

    <div class="reviews-section">
      <h4 style="font-size: 0.9rem; margin-bottom: 10px; color: var(--gold);">⭐ Avaliações do Vendedor</h4>
      <div id="listaAvaliacoes" style="max-height: 200px; overflow-y: auto; margin-bottom: 12px;">Carregando avaliações...</div>
      <button style="background: #334155; color: white; font-size: 0.8rem; padding: 8px;" onclick="abrirModalAvaliacao()">Deixar Avaliação</button>
    </div>

    <div id="navMenu" style="margin-top:20px; border-top: 1px solid #334155; padding-top:20px;">
      <a href="index.html" style="text-decoration:none;"><button style="background:#334155; color:white">🏠 Home</button></a>
      <div id="loggedMenu" style="display:none;">
        <a href="vitrine.html" style="text-decoration:none;"><button class="btn-gold">📦 Gerenciar Vitrine</button></a>
        <div id="adminLinks" style="display:none;">
          <a href="admin.html" style="text-decoration:none;"><button style="background:#334155; color:white">⚙️ Painel Admin</button></a>
          <a href="estoque.html" style="text-decoration:none;"><button style="background:#334155; color:white">📊 Ver Estoque</button></a>
        </div>
        <button class="btn-logout" onclick="fazerLogout()">Sair do Sistema</button>
      </div>
      <div id="unloggedMenu" style="display:none; margin-top: 10px;">
        <a href="login.html" style="text-decoration:none;"><button class="btn-gold">Entrar / Fazer Login</button></a>
      </div>
    </div>
  </div>

  <div class="vitrine-content">
    <h2>🛍️ Vitrine de Ofertas</h2>
    <div class="vitrine-filters">
      <select id="filtroAlbum" class="filter-field" onchange="aplicarFiltros()">
        <option value="">Filtrar por Álbum (Todos)</option>
      </select>
      <input type="text" id="filtroBusca" class="filter-field" placeholder="Buscar por Nome ou Código (ex: 15 ou #15)" oninput="aplicarFiltros()">
    </div>
    <div class="cards-grid" id="vitrineGrid">Carregando vitrine...</div>
    <div id="carregarMaisContainer" style="text-align: center; margin-top: 20px; display: none;">
      <button class="btn-gold" style="width: 200px;" onclick="carregarMais()">Carregar Mais</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3 style="margin-bottom: 15px; color: var(--gold);">✏️ Editar Oferta</h3>
    <input type="hidden" id="modalOfertaId">
    <label style="font-size: 0.75rem; color: #94a3b8;">Preço (€):</label>
    <input type="number" step="0.01" id="modalPreco" class="edit-field">
    <label style="font-size: 0.75rem; color: #94a3b8;">Estoque:</label>
    <input type="number" id="modalEstoque" class="edit-field">
    <label style="font-size: 0.75rem; color: #94a3b8;">Nota de Qualidade / Estado:</label>
    <select id="modalQualidade" class="edit-field">
      <option value="100% (Nova / Perfeita)">✨ 100% (Nova / Perfeita)</option>
      <option value="Ótimo estado">👍 Ótimo estado</option>
      <option value="Leve detalhe / Amassadinha">⚠️ Leve detalhe / Amassadinha</option>
      <option value="Com marcas de uso">📌 Com marcas de uso</option>
    </select>
    <button class="btn-gold" onclick="salvarEdicaoOferta()">Salvar</button>
    <button onclick="fecharModal()" style="background:transparent; border:1px solid white; color:white;">Cancelar</button>
  </div>
</div>

<div class="modal-overlay" id="modalAvaliar">
  <div class="modal-box">
    <h3 style="margin-bottom: 15px; color: var(--gold);">⭐ Avaliar Vendedor</h3>
    <label style="font-size: 0.75rem; color: #94a3b8;">Seu Nome:</label>
    <input type="text" id="avaliacaoNome" class="edit-field" placeholder="Como te chamam?">
    <label style="font-size: 0.75rem; color: #94a3b8;">Nota (Estrelas):</label>
    <select id="avaliacaoEstrelas" class="edit-field">
      <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
      <option value="4">⭐⭐⭐⭐ (4/5)</option>
      <option value="3">⭐⭐⭐ (3/5)</option>
      <option value="2">⭐⭐ (2/5)</option>
      <option value="1">⭐ (1/5)</option>
    </select>
    <label style="font-size: 0.75rem; color: #94a3b8;">Comentário:</label>
    <textarea id="avaliacaoComentario" class="edit-field" rows="3" placeholder="Sua experiência..."></textarea>
    <button class="btn-gold" onclick="enviarAvaliacao()">Enviar Avaliação</button>
    <button onclick="fecharModalAvaliacao()" style="background:transparent; border:1px solid white; color:white;">Cancelar</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  
  let usuarioLogado = null;
  let authUserId = null;
  let perfilAlvoUuid = null;
  let isAdminOrMaster = false;
  let todasOfertas = [];
  let figsMapGlobal = {};
  let albunsMapGlobal = {};
  let limiteExibicao = 30;

  async function verificarAcesso() {
    const urlParams = new URLSearchParams(window.location.search);
    const idParam = urlParams.get('id');
    const { data: { session } } = await _supabase.auth.getSession();
    let perfilAlvo = null;

    if (session) {
      authUserId = session.user.id;
      const { data: perfilLogado } = await _supabase.from('vendedores_autorizados').select('*').eq('email', session.user.email).maybeSingle();
      if (perfilLogado) {
        usuarioLogado = perfilLogado;
        isAdminOrMaster = (perfilLogado.is_admin === true || perfilLogado.funcao === 'admin' || perfilLogado.funcao === 'master');
      }
      document.getElementById('loggedMenu').style.display = 'block';
    } else {
      document.getElementById('unloggedMenu').style.display = 'block';
    }

    if (idParam) {
      const { data } = await _supabase.from('vendedores_autorizados').select('*').eq('user_id', idParam).maybeSingle();
      perfilAlvo = data;
    } else if (usuarioLogado) {
      perfilAlvo = usuarioLogado;
    }

    if (perfilAlvo && perfilAlvo.user_id) {
      perfilAlvoUuid = perfilAlvo.user_id;
      const ehProprio = usuarioLogado && (String(perfilAlvo.user_id) === String(usuarioLogado.user_id) || perfilAlvo.user_id === authUserId);
      preencherDadosPerfil(perfilAlvo, ehProprio);
      carregarVitrine(perfilAlvoUuid);
      carregarAvaliacoes(perfilAlvoUuid);
    } else {
      document.getElementById('userName').innerText = "Vendedor não encontrado";
      document.getElementById('vitrineGrid').innerHTML = "Não foi possível localizar este vendedor.";
    }
    if (isAdminOrMaster) document.getElementById('adminLinks').style.display = 'block';
  }

  function preencherDadosPerfil(perfil, ehProprio) {
    document.getElementById('userName').innerText = perfil.nome || "Usuário";
    document.getElementById('userAvatar').src = perfil.avatar || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg';
    document.getElementById('profileDetails').innerHTML = `<p>📍 <strong>${perfil.cidade || 'Cidade não informada'}</strong></p>`;
    if (perfil.telefone_whats) {
      const linkWpp = document.getElementById('linkWhatsApp');
      linkWpp.href = `https://wa.me/${perfil.telefone_whats.replace(/\D/g, '')}`;
      linkWpp.style.display = 'block';
    }
    document.getElementById('editNome').value = perfil.nome || '';
    document.getElementById('editCidade').value = perfil.cidade || '';
    document.getElementById('editWhatsApp').value = perfil.telefone_whats || '';
    if (ehProprio || isAdminOrMaster) {
      document.getElementById('btnTrocarFoto').style.display = 'block';
      document.getElementById('btnEditarPerfil').style.display = 'block';
    }
  }

  async function carregarAvaliacoes(vendedorUuid) {
    const container = document.getElementById('listaAvaliacoes');
    const { data: avaliacoes, error } = await _supabase
      .from('avaliacoes_vendedores')
      .select('*')
      .eq('vendedor_id', vendedorUuid)
      .order('created_at', { ascending: false });

    if (error) { container.innerHTML = "Erro ao carregar avaliações."; return; }
    if (!avaliacoes || avaliacoes.length === 0) {
      container.innerHTML = "<p style='color:#94a3b8; text-align:center;'>Nenhuma avaliação ainda.</p>";
      document.getElementById('mediaEstrelas').innerHTML = "<span style='font-size:0.8rem; color:#94a3b8;'>Sem avaliações</span>";
      return;
    }

    let soma = avaliacoes.reduce((acc, curr) => acc + curr.estrelas, 0);
    let media = (soma / avaliacoes.length).toFixed(1);
    document.getElementById('mediaEstrelas').innerHTML = `<div class="stars-display">${"⭐".repeat(Math.round(media))}</div><span style="font-size:0.8rem; color:#cbd5e1;">Média ${media}</span>`;

    container.innerHTML = avaliacoes.map(av => `
      <div class="review-card">
        ${isAdminOrMaster ? `<button onclick="excluirAvaliacao('${av.id}')" style="position:absolute; right:5px; top:5px; background:none; border:none; color:#ef4444; font-weight:bold; cursor:pointer;">X</button>` : ''}
        <div style="display:flex; justify-content:space-between; margin-bottom: 3px; padding-right: 15px;">
          <strong>${av.visitante_nome}</strong>
          <span style="color:var(--gold);">${'⭐'.repeat(av.estrelas)}</span>
        </div>
        <p style="color:#cbd5e1;">${av.comentario || ''}</p>
      </div>
    `).join('');
  }

  async function excluirAvaliacao(id) {
    if (!confirm("Tem certeza que deseja apagar este comentário?")) return;
    const { error } = await _supabase.from('avaliacoes_vendedores').delete().eq('id', id);
    if (error) alert("Erro ao excluir: " + error.message);
    else { alert("Comentário removido!"); carregarAvaliacoes(perfilAlvoUuid); }
  }

  async function enviarAvaliacao() {
    const nome = document.getElementById('avaliacaoNome').value.trim();
    const estrelas = parseInt(document.getElementById('avaliacaoEstrelas').value);
    const comentario = document.getElementById('avaliacaoComentario').value.trim();
    if (!nome) return alert("Por favor, digite seu nome.");
    const { error } = await _supabase.from('avaliacoes_vendedores').insert([{ vendedor_id: perfilAlvoUuid, visitante_nome: nome, estrelas: estrelas, comentario: comentario }]);
    if (error) alert("Erro ao enviar: " + error.message);
    else { alert("Avaliação enviada!"); fecharModalAvaliacao(); carregarAvaliacoes(perfilAlvoUuid); }
  }

  function abrirModalAvaliacao() { document.getElementById('modalAvaliar').style.display = 'flex'; }
  function fecharModalAvaliacao() { document.getElementById('modalAvaliar').style.display = 'none'; }
  function abrirModalEdicao(id, preco, estoq, qual) { document.getElementById('modalOfertaId').value = id; document.getElementById('modalPreco').value = preco; document.getElementById('modalEstoque').value = estoq; document.getElementById('modalQualidade').value = qual; document.getElementById('editModal').style.display = 'flex'; }
  function fecharModal() { document.getElementById('editModal').style.display = 'none'; }
  function toggleEdit() { const view = document.getElementById('viewMode'); const edit = document.getElementById('editMode'); view.style.display = (view.style.display === 'none') ? 'block' : 'none'; edit.style.display = (edit.style.display === 'none') ? 'block' : 'none'; }
  async function fazerLogout() { await _supabase.auth.signOut(); window.location.replace("index.html"); }

  verificarAcesso();
</script>
</body>
</html>
