<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Perfil e Vitrine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #f59e0b; --bg: #0f172a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #f8fafc; padding: 20px; }
    
    .main-layout { display: flex; gap: 20px; max-width: 1350px; margin: 0 auto; flex-wrap: wrap; }
    .profile-sidebar { width: 300px; background: rgba(30, 41, 59, 0.7); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); height: fit-content; }
    .avatar-img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; display: block; margin: 0 auto; }
    .vitrine-content { flex: 1; }
    
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; }
    
    .sticker-card { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); color: #f8fafc; display: flex; flex-direction: column; transition: 0.3s; }
    .sticker-card:hover { transform: translateY(-3px); border-color: var(--gold); }
    
    .sticker-img-wrap { height: 190px; background: #0f172a; padding: 12px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .sticker-card img { width: 100%; height: 100%; object-fit: contain; }
    
    .sticker-info { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .card-row { font-size: 0.75rem; color: #94a3b8; }
    .card-row span { font-weight: 700; color: #f8fafc; }
    
    .sticker-title { font-size: 0.9rem; font-weight: 700; color: #f8fafc; margin: 2px 0; }
    .sticker-price { font-size: 1.1rem; font-weight: 800; color: #34d399; margin: 4px 0; }
    .sticker-qtd { font-size: 0.75rem; color: #94a3b8; font-weight: 600; }

    .card-actions { display: flex; gap: 5px; margin-top: auto; padding-top: 6px; }
    .btn-card-action { flex: 1; padding: 0.5rem; font-size: 0.75rem; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; text-align: center; }
    .btn-edit { background: #3b82f6; color: white; }
    .btn-delete { background: #ef4444; color: white; }

    .edit-field { background: #0f172a; border: 1px solid var(--gold); color: white; padding: 8px; width: 100%; margin-bottom: 10px; border-radius: 4px; }
    button { cursor: pointer; padding: 10px; border-radius: 6px; border: none; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; }
    .btn-logout { background: #ef4444; color: white; }
    .btn-gold { background: var(--gold); color: #0f172a; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
    .modal-box { background: #1e293b; border: 1px solid var(--gold); padding: 25px; border-radius: 12px; width: 320px; }
  </style>
</head>
<body>

<div class="main-layout">
  <div class="profile-sidebar">
    <div style="text-align:center">
      <img id="userAvatar" src="https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg" class="avatar-img">
      <input type="file" id="avatarInput" style="display:none" accept="image/*" onchange="uploadAvatar(event)">
      <button id="btnTrocarFoto" class="btn-gold" style="display:none;" onclick="document.getElementById('avatarInput').click()">Trocar Foto</button>
    </div>

    <div id="viewMode" style="margin-top:20px; text-align: center;">
      <h3 id="userName">Carregando...</h3>
      <div id="profileDetails" style="font-size: 0.9rem; color: #cbd5e1; margin: 15px 0;"></div>
      <a id="linkWhatsApp" href="#" target="_blank" style="display:none; color: var(--gold); font-size: 0.9rem; text-decoration: none; font-weight: 600;">💬 Falar no WhatsApp</a>
      <button id="btnEditarPerfil" style="display:none; margin-top:15px;" onclick="toggleEdit()">Editar Perfil</button>
    </div>

    <div id="editMode" style="display:none; margin-top:20px;">
      <label style="font-size: 0.75rem; color: var(--gold);">Nome:</label>
      <input type="text" id="editNome" class="edit-field">
      <label style="font-size: 0.75rem; color: var(--gold);">Cidade:</label>
      <input type="text" id="editCidade" class="edit-field">
      <label style="font-size: 0.75rem; color: var(--gold);">WhatsApp (apenas números):</label>
      <input type="text" id="editWhatsApp" class="edit-field" placeholder="Ex: 5511999999999">
      
      <button class="btn-gold" onclick="salvarPerfil()">Salvar Alterações</button>
      <button onclick="toggleEdit()" style="background:transparent; border:1px solid white; color: white;">Cancelar</button>
    </div>

    <div id="navMenu" style="margin-top:20px; border-top: 1px solid #334155; padding-top:20px;">
      <a href="index.html" style="text-decoration:none;"><button style="background:#334155; color:white">🏠 Home</button></a>
      <div id="loggedMenu" style="display:none;">
        <a href="vitrine.html" style="text-decoration:none;"><button class="btn-gold">📦 Gerenciar Vitrine</button></a>
        <div id="adminLinks" style="display:none;">
          <a href="admin.html" style="text-decoration:none;"><button style="background:#334155; color:white">⚙️ Painel Admin</button></a>
          <a href="estoque.html" style="text-decoration:none;"><button style="background:#334155; color:white">📊 Ver Estoque</button></a>
        </div>
        <button class="btn-logout" onclick="fazerLogout()">Sair do Sistema</button>
      </div>
      <div id="unloggedMenu" style="display:none; margin-top: 10px;">
        <a href="login.html" style="text-decoration:none;"><button class="btn-gold">Entrar / Fazer Login</button></a>
      </div>
    </div>
  </div>

  <div class="vitrine-content">
    <h2>🛍️ Vitrine de Ofertas</h2>
    <div class="cards-grid" id="vitrineGrid">Carregando vitrine...</div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3 style="margin-bottom: 15px; color: var(--gold);">✏️ Editar Oferta</h3>
    <input type="hidden" id="modalOfertaId">
    <label style="font-size: 0.75rem; color: #94a3b8;">Preço (€):</label>
    <input type="number" step="0.01" id="modalPreco" class="edit-field">
    <label style="font-size: 0.75rem; color: #94a3b8;">Estoque:</label>
    <input type="number" id="modalEstoque" class="edit-field">
    <button class="btn-gold" onclick="salvarEdicaoOferta()">Salvar</button>
    <button onclick="fecharModal()" style="background:transparent; border:1px solid white; color:white;">Cancelar</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  
  let usuarioLogado = null;
  let authUserId = null;
  let perfilAlvoUuid = null;
  let isAdminOrMaster = false;

  function isUUID(uuid) {
    if (!uuid) return false;
    const regex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    return regex.test(String(uuid));
  }

  async function verificarAcesso() {
    const urlParams = new URLSearchParams(window.location.search);
    const idParam = urlParams.get('id');

    const { data: { session } } = await _supabase.auth.getSession();
    
    let perfilAlvo = null;

    if (session) {
      authUserId = session.user.id;
      const { data: perfilLogado } = await _supabase.from('vendedores_autorizados').select('*').eq('email', session.user.email).maybeSingle();
      if (perfilLogado) {
        usuarioLogado = perfilLogado;
        isAdminOrMaster = (perfilLogado.is_admin === true || perfilLogado.funcao === 'admin' || perfilLogado.funcao === 'master');
      }
      document.getElementById('loggedMenu').style.display = 'block';
    } else {
      document.getElementById('unloggedMenu').style.display = 'block';
    }

    if (idParam) {
      const { data, error } = await _supabase.from('vendedores_autorizados').select('*').eq('user_id', idParam).maybeSingle();
      if (error) console.error("Erro na busca:", error);
      perfilAlvo = data;
    } else if (usuarioLogado) {
      perfilAlvo = usuarioLogado;
    }

    if (perfilAlvo && perfilAlvo.user_id) {
      perfilAlvoUuid = perfilAlvo.user_id;
      const ehProprio = usuarioLogado && (String(perfilAlvo.user_id) === String(usuarioLogado.user_id) || perfilAlvo.user_id === authUserId);
      preencherDadosPerfil(perfilAlvo, ehProprio);
      carregarVitrine(perfilAlvoUuid);
    } else if (perfilAlvo && perfilAlvo.id) {
      perfilAlvoUuid = perfilAlvo.id;
      const ehProprio = usuarioLogado && (String(perfilAlvo.id) === String(usuarioLogado.id) || perfilAlvo.id === authUserId);
      preencherDadosPerfil(perfilAlvo, ehProprio);
      carregarVitrine(perfilAlvoUuid);
    } else {
      document.getElementById('userName').innerText = "Vendedor não encontrado";
      document.getElementById('vitrineGrid').innerHTML = "Não foi possível localizar este vendedor no banco de dados ou a sessão expirou.";
      console.warn("Nenhum perfil válido encontrado para carregar.");
      return;
    }

    if (isAdminOrMaster) document.getElementById('adminLinks').style.display = 'block';
  }

  function preencherDadosPerfil(perfil, ehProprio) {
    document.getElementById('userName').innerText = perfil.nome || "Usuário";
    document.getElementById('userAvatar').src = perfil.avatar || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg';
    document.getElementById('profileDetails').innerHTML = `<p>📍 <strong>${perfil.cidade || 'Cidade não informada'}</strong></p>`;
    
    if (perfil.telefone_whats) {
      const linkWpp = document.getElementById('linkWhatsApp');
      linkWpp.href = `https://wa.me/${perfil.telefone_whats.replace(/\D/g, '')}`;
      linkWpp.style.display = 'block';
    }
    
    document.getElementById('editNome').value = perfil.nome || '';
    document.getElementById('editCidade').value = perfil.cidade || '';
    document.getElementById('editWhatsApp').value = perfil.telefone_whats || '';

    if (ehProprio || isAdminOrMaster) {
      document.getElementById('btnTrocarFoto').style.display = 'block';
      document.getElementById('btnEditarPerfil').style.display = 'block';
    }
  }

  async function salvarPerfil() {
    if (!usuarioLogado) return alert("Você precisa estar logado.");
    const updates = {
      nome: document.getElementById('editNome').value,
      cidade: document.getElementById('editCidade').value,
      telefone_whats: document.getElementById('editWhatsApp').value
    };
    const { error } = await _supabase.from('vendedores_autorizados').update(updates).eq('id', usuarioLogado.id);
    if (error) alert("Erro ao atualizar: " + error.message);
    else location.reload();
  }

  function toggleEdit() {
    const view = document.getElementById('viewMode');
    const edit = document.getElementById('editMode');
    view.style.display = (view.style.display === 'none') ? 'block' : 'none';
    edit.style.display = (edit.style.display === 'none') ? 'block' : 'none';
  }

  async function uploadAvatar(event) {
    const file = event.target.files[0];
    if (!file || !usuarioLogado) return;
    const fileName = `${usuarioLogado.id}_${Date.now()}.jpg`;
    const { error } = await _supabase.storage.from('avatars').upload(fileName, file);
    if (error) return alert("Erro no upload: " + error.message);
    const { data: { publicUrl } } = _supabase.storage.from('avatars').getPublicUrl(fileName);
    await _supabase.from('vendedores_autorizados').update({ avatar: publicUrl }).eq('id', usuarioLogado.id);
    location.reload();
  }

  async function carregarVitrine(uuidVal) {
    const grid = document.getElementById('vitrineGrid');
    const { data: ofertas, error } = await _supabase.from('vitrine_ofertas').select('*').eq('user_id', uuidVal);
    if (error) { grid.innerHTML = `Erro: ${error.message}`; return; }
    if (!ofertas || ofertas.length === 0) { grid.innerHTML = "Vitrine vazia."; return; }
    
    const figIds = ofertas.map(o => o.figurinha_id || o.id_figurinha);
    const { data: figs } = await _supabase.from('figurinhas').select('*').in('id', figIds);
    const figsMap = figs ? Object.fromEntries(figs.map(f => [f.id, f])) : {};

    const albumIds = [...new Set(Object.values(figsMap).map(f => f.album_id).filter(Boolean))];
    let albunsMap = {};
    if (albumIds.length > 0) {
      const { data: albuns } = await _supabase.from('albuns').select('*').in('id', albumIds);
      if (albuns) albunsMap = Object.fromEntries(albuns.map(a => [a.id, a.nome]));
    }

    grid.innerHTML = ofertas.map(item => {
      const f = figsMap[item.figurinha_id || item.id_figurinha] || {};
      const nomeAlbum = albunsMap[f.album_id] || '-';
      const selecaoEscuderia = f.selecao_escuderia || f.selecao || f.escuderia || '-';
      const podeGerenciar = usuarioLogado && (String(item.user_id) === String(authUserId) || isAdminOrMaster);
      return `
        <div class="sticker-card">
          <div class="sticker-img-wrap"><img src="${f.imagem || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'}"></div>
          <div class="sticker-info">
            <div class="card-row">Álbum: <span>${nomeAlbum}</span></div>
            <div class="card-row">Número: <span>${f.numero || '-'}</span></div>
            <div class="sticker-title">${f.nome || 'Sem Nome'}</div>
            <div class="card-row">Seleção: <span>${selecaoEscuderia}</span></div>
            <div class="card-row">Tipo: <span>${f.tipo || '-'}</span></div>
            <div class="sticker-qtd" style="margin-top: 4px;">Estoque: ${item.estoque || 0}</div>
            <div class="sticker-price">€ ${Number(item.preco).toFixed(2).replace('.', ',')}</div>
            ${podeGerenciar ? `<div class="card-actions"><button class="btn-card-action btn-edit" onclick="abrirModalEdicao('${item.id}', ${item.preco}, ${item.estoque})">Editar</button></div>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  function abrirModalEdicao(id, preco, estoq) {
    document.getElementById('modalOfertaId').value = id;
    document.getElementById('modalPreco').value = preco;
    document.getElementById('modalEstoque').value = estoq;
    document.getElementById('editModal').style.display = 'flex';
  }

  function fecharModal() { document.getElementById('editModal').style.display = 'none'; }

  async function salvarEdicaoOferta() {
    const { error } = await _supabase.from('vitrine_ofertas').update({ preco: document.getElementById('modalPreco').value, estoque: document.getElementById('modalEstoque').value }).eq('id', document.getElementById('modalOfertaId').value);
    if (error) alert("Erro: " + error.message);
    else location.reload();
  }

  async function fazerLogout() { await _supabase.auth.signOut(); window.location.replace("index.html"); }

  verificarAcesso();
</script>
</body>
</html>
