<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil e Vitrine - Álbum Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #f59e0b; --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); min-height: 100vh; color: white; padding: 1rem; }
    
    header { max-width: 1300px; margin: 0 auto 1.5rem; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
    .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-right: 15px; }
    .top-nav a:hover { color: var(--gold); }
    .user-profile-top { display: flex; align-items: center; gap: 0.75rem; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 0.4rem 0.8rem; border-radius: 30px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
    .btn-logout { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    
    /* PAINEL DE PERFIL */
    .profile-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .profile-card h2 { color: var(--gold); font-size: 1.4rem; }
    .profile-info { display: flex; gap: 2rem; flex-wrap: wrap; font-size: 0.9rem; color: #cbd5e1; }
    .profile-info span strong { color: white; }

    .container { max-width: 1300px; margin: 0 auto; }
    .controls-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    .filter-group { flex: 1; min-width: 200px; }
    input, select { width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: white; outline: none; }
    input:focus, select:focus { border-color: var(--gold); }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .card { background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.5rem; }
    .card img { width: 90px; height: 115px; object-fit: contain; background: #0f172a; border-radius: 6px; }
    .card-title { font-size: 0.9rem; font-weight: 600; }
    .card-subtitle { font-size: 0.75rem; color: #94a3b8; }
    .card-inputs { width: 100%; display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .input-wrapper { flex: 1; text-align: left; }
    .input-wrapper label { font-size: 0.65rem; color: var(--gold); font-weight: 600; }
    .input-wrapper input { width: 100%; padding: 0.4rem; font-size: 0.8rem; text-align: center; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: white; outline: none; }
    .btn-add-vitrine { background: var(--gold); color: #0f172a; border: none; width: 100%; padding: 0.5rem; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 0.5rem; }
    .btn-add-vitrine:hover { background: #d97706; }

    .load-more-container { text-align: center; margin: 2rem 0; }
    .btn-load-more { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--gold); color: var(--gold); padding: 0.75rem 2rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <div class="top-nav">
      <div class="nav-links">
        <a href="index.html">🏠 Home</a>
        <a href="perfil.html" style="color: var(--gold);">👤 Meu Perfil / Vitrine</a>
      </div>
      <div class="user-profile-top">
        <img id="userAvatar" src="https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg" class="user-avatar">
        <span id="userGreeting">Carregando...</span>
        <button class="btn-logout" onclick="fazerLogout()">Sair 🚪</button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Bloco de Dados do Perfil -->
    <div class="profile-card">
      <h2>👤 Meus Dados</h2>
      <div class="profile-info" id="profileDetails">
        <span>Carregando informações...</span>
      </div>
    </div>

    <div class="controls-panel">
      <div class="filter-group">
        <label>Filtrar por Álbum:</label>
        <select id="filterAlbum" onchange="aplicarFiltros()">
          <option value="todos">Todos os Álbuns</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Buscar Figurinha:</label>
        <input type="text" id="search" placeholder="🔍 Ex: 10, Messi, Brasil...">
      </div>
    </div>

    <div class="cards-grid" id="vitrineGrid">
      <div style="grid-column: 1 / -1; text-align: center; padding: 2rem; color: #94a3b8;">Carregando figurinhas...</div>
    </div>

    <div class="load-more-container" id="loadMoreContainer" style="display: none;">
      <button class="btn-load-more" onclick="carregarMaisFigurinhas()">Carregar mais 30 itens</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://eyddrnjrewehojfmskvd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZGRybmpyZXdlaG9qZm1za3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDEwMzksImV4cCI6MjEwMjIxNzAzOX0.fR3cQArpbz4dzTHx80jhfsYJJfDZHJZ7KUkDCdCoJuE";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const ITENS_POR_PAGINA = 30;

    let usuarioLogado = null;
    let figurinhasGlobal = [];
    let mapaAlbuns = {};
    let paginaAtual = 0;

    async function verificarAcesso() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) { window.location.href = "login.html"; return null; }

      // Buscando dados do perfil na tabela 'vendedores_autorizados' (ajuste as colunas 'morada' e 'cidade' caso tenham nomes diferentes no banco, ex: 'endereco')
      const { data: perfil } = await _supabase
        .from('vendedores_autorizados')
        .select('*')
        .eq('email', session.user.email)
        .maybeSingle();

      if (perfil) {
        usuarioLogado = perfil;
        document.getElementById('userGreeting').innerText = `Olá, ${perfil.nome || 'Vendedor'}`;
        if (perfil.avatar) document.getElementById('userAvatar').src = perfil.avatar;
        
        // Renderiza os dados do perfil na tela
        document.getElementById('profileDetails').innerHTML = `
          <span><strong>Nome:</strong> ${perfil.nome || 'Não informado'}</span>
          <span><strong>Morada:</strong> ${perfil.morada || perfil.endereco || 'Não informada'}</span>
          <span><strong>Cidade:</strong> ${perfil.cidade || 'Não informada'}</span>
          <span><strong>E-mail:</strong> ${session.user.email}</span>
        `;
      }
      return session;
    }

    async function aplicarFiltros() {
      paginaAtual = 0;
      figurinhasGlobal = [];
      const albumId = document.getElementById('filterAlbum').value;
      const termo = document.getElementById('search').value.trim().replace('#', '');

      let query = _supabase.from('figurinhas').select('*').order('numero', { ascending: true });
      
      if (albumId !== 'todos') {
        query = query.eq('album_id', albumId);
      }
      if (termo !== "") {
        if (!isNaN(termo)) {
          query = query.or(`numero.eq.${termo},nome.ilike.%${termo}%,selecao_escuderia.ilike.%${termo}%`);
        } else {
          query = query.or(`nome.ilike.%${termo}%,selecao_escuderia.ilike.%${termo}%`);
        }
      }

      const { data, error } = await query.range(0, ITENS_POR_PAGINA - 1);
      if (error) {
        console.error("Erro ao buscar:", error);
        return;
      }

      figurinhasGlobal = data || [];
      renderizarCards(figurinhasGlobal);
      document.getElementById('loadMoreContainer').style.display = (data && data.length >= ITENS_POR_PAGINA) ? 'block' : 'none';
    }

    let timeoutBusca;
    document.getElementById('search').addEventListener('input', () => {
      clearTimeout(timeoutBusca);
      timeoutBusca = setTimeout(aplicarFiltros, 400);
    });

    async function carregarMaisFigurinhas() {
      paginaAtual++;
      const inicio = paginaAtual * ITENS_POR_PAGINA;
      const albumId = document.getElementById('filterAlbum').value;
      const termo = document.getElementById('search').value.trim().replace('#', '');

      let query = _supabase.from('figurinhas').select('*').order('numero', { ascending: true });
      if (albumId !== 'todos') query = query.eq('album_id', albumId);
      if (termo !== "") {
        if (!isNaN(termo)) {
          query = query.or(`numero.eq.${termo},nome.ilike.%${termo}%,selecao_escuderia.ilike.%${termo}%`);
        } else {
          query = query.or(`nome.ilike.%${termo}%,selecao_escuderia.ilike.%${termo}%`);
        }
      }

      const { data } = await query.range(inicio, inicio + ITENS_POR_PAGINA - 1);
      if (data && data.length > 0) {
        figurinhasGlobal = figurinhasGlobal.concat(data);
        renderizarCards(figurinhasGlobal);
        document.getElementById('loadMoreContainer').style.display = (data.length >= ITENS_POR_PAGINA) ? 'block' : 'none';
      } else {
        document.getElementById('loadMoreContainer').style.display = 'none';
      }
    }

    function renderizarCards(lista) {
      const grid = document.getElementById('vitrineGrid');
      if (!lista || lista.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 2rem; color: #94a3b8;">Nenhuma figurinha encontrada.</div>`;
        return;
      }

      grid.innerHTML = lista.map(f => `
        <div class="card">
          <img src="${f.imagem || 'https://raw.githubusercontent.com/rmbcolecionismo/catalogo-cards/main/sem-foto.jpg'}" alt="Figurinha">
          <div class="card-title">${f.numero || ''} - ${f.nome || 'Sem Nome'}</div>
          <div class="card-subtitle">${f.selecao_escuderia || mapaAlbuns[f.album_id] || 'Álbum Geral'}</div>
          
          <div class="card-inputs">
            <div class="input-wrapper">
              <label>Preço (€)</label>
              <input type="number" id="preco-${f.id}" value="0" step="0.01">
            </div>
            <div class="input-wrapper">
              <label>Qtd</label>
              <input type="number" id="qtd-${f.id}" value="0" min="0">
            </div>
          </div>

          <button class="btn-add-vitrine" onclick="adicionarNaVitrine(${f.id})">Adicionar à Vitrine</button>
        </div>
      `).join('');
    }

    async function adicionarNaVitrine(figurinhaId) {
      if (!usuarioLogado) return;
      const preco = parseFloat(document.getElementById(`preco-${figurinhaId}`).value) || 0;
      const quantidade = parseInt(document.getElementById(`qtd-${figurinhaId}`).value) || 0;

      const { error } = await _supabase.from('vitrine_ofertas').upsert({
        vendedor_id: usuarioLogado.id,
        figurinha_id: figurinhaId,
        preco: preco,
        quantidade: quantidade
      }, { onConflict: 'vendedor_id, figurinha_id' });

      if (error) alert("Erro ao salvar: " + error.message);
      else alert("Figurinha atualizada na vitrine com sucesso!");
    }

    async function init() {
      const session = await verificarAcesso();
      if (!session) return;
      
      const { data: albuns } = await _supabase.from('albuns').select('*');
      if (albuns) {
        albuns.forEach(a => { 
          mapaAlbuns[a.id] = a.nome; 
          document.getElementById('filterAlbum').innerHTML += `<option value="${a.id}">${a.nome}</option>`; 
        });
      }
      aplicarFiltros();
    }

    function fazerLogout() { 
      _supabase.auth.signOut(); 
      window.location.href = "login.html"; 
    }
    
    init();
  </script>
</body>
</html>
